<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>browser_RA Skirmish by Miko Mynski</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        user-select: none;
      }

      /* --- LAYOUT --- */
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
      }

      canvas {
        flex-grow: 1;
        background-color: #2b3a2b;
        cursor: crosshair;
      }

      /* --- SIDEBAR DESIGN --- */
      #sidebar {
        width: 280px;
        height: 100%;
        display: flex;
        background-color: #333;
        border-left: 4px solid #111;
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }

      .icon-strip {
        width: 45px;
        background-color: #1a1a1a;
        border-right: 2px solid #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 10px;
        gap: 5px;
      }

      .tab-icon {
        width: 36px;
        height: 36px;
        background: #222;
        border: 2px outset #555;
        color: #888;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
      }

      .tab-icon:hover {
        background: #333;
        color: #fff;
      }

      /* Aktiver Tab */
      .tab-icon.active {
        background: #4a5a4a;
        border-style: inset;
        color: #00ff00;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
      }

      .tab-icon.disabled {
        filter: grayscale(100%);
        opacity: 0.3;
        pointer-events: none;
        border-color: #333;
      }

      .sidebar-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: 10px;
        background-color: #252525;
      }

      /* --- UI ELEMENTE --- */

      .radar-box {
        width: 100%;
        aspect-ratio: 4 / 3; /* Radarschirm-Fläche, breiter als hoch (Letterboxing bei nicht passenden Feldern) */
        background-color: #000;
        border: 2px inset #555;
        margin-bottom: 15px;
        position: relative;
        overflow: hidden;
      }

      .minimap-text {
        color: #00ff00;
        font-size: 10px;
        padding: 5px;
        opacity: 0.7;
      }

      .radar-scan {
        width: 100%;
        height: 2px;
        background: rgba(0, 255, 0, 0.3);
        position: absolute;
        top: 0;
        animation: scan 4s infinite linear;
      }
      @keyframes scan {
        from {
          top: 0;
        }
        to {
          top: 100%;
        }
      }

      #radar-canvas {
        position: absolute;
        left: 0;
        top: 0; /* wird per JS mittig positioniert (Letterboxing) */
        background-color: #000;
        image-rendering: pixelated;
        display: none; /* wird per JS eingeblendet, sobald ein Radar gebaut ist */
      }

      .build-menu-container {
        flex-grow: 1;
        overflow-y: scroll;
        scrollbar-gutter: stable;
        background: #222;
        border: 2px inset #555;
        padding: 10px;
        display: none;
      }

      .build-menu-container.active {
        display: block;
      }

      .build-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .build-item {
        aspect-ratio: 1;
        background: #333;
        border: 2px outset #666;
        cursor: pointer;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: #ccc;
        overflow: hidden; /* Für Progress Bar */
      }

      .build-item:hover {
        background: #444;
        border-color: #fff;
      }

      .build-item.ready {
        border-color: #ffd24d;
        box-shadow:
          inset 0 0 0 1px rgba(255, 210, 77, 0.8),
          0 0 8px rgba(255, 210, 77, 0.35);
      }

      /* Placing State für Gebäude */
      .build-item.placing {
        border-color: #00ff00;
        background: #2a3a2a;
      }

      /* Produktion Progress Bar Overlay */
      .progress-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px; /* Dünne Leiste am unteren Rand */
        background-color: #00ff00;
        transform-origin: left;
        transition: height 0.1s;
        z-index: 1;
        opacity: 0.55;
      }

      .timer-text {
        position: absolute;
        top: 2px;
        left: 2px;
        font-size: 8px;
        color: #fff;
        text-shadow: 1px 1px 0 #000;
        z-index: 3;
      }

      .count-text {
        position: absolute;
        top: 2px;
        right: 2px;
        font-size: 10px;
        color: #ddd;
        text-shadow: 1px 1px 0 #000;
        z-index: 3;
      }

      .build-item .icon-box,
      .build-item .cost-label {
        position: relative;
        z-index: 2;
      }

      .icon-box {
        width: 24px;
        height: 24px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #000;
        border-radius: 3px;
        background: #555; /* Fallback */
      }

      .icon-box.unit-icon {
        width: 72px;
        height: 72px;
        max-width: 80%;
        max-height: 80%;
        font-size: 30px;
        margin-bottom: 0;
        background: #3f3f3f;
        color: #fff;
        position: relative;
      }

      .icon-box .count-text {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        font-size: 11px;
        line-height: 18px;
        color: #fff;
        background: rgba(0, 0, 0, 0.32);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        z-index: 2;
      }

      .build-item.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(100%);
        border-color: #333;
      }
      .build-item.disabled .count-text {
        pointer-events: auto;
        cursor: pointer;
      }

      .build-item.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(100%);
        border-color: #333;
        pointer-events: none;
      }

      #unit-info {
        margin-top: auto;
        padding-top: 10px;
        font-size: 11px;
        color: #aaa;
        height: 40px;
        display: flex;
        align-items: center;
      }

      /* --- ACTION BUTTONS ABOVE RADAR --- */
      .action-buttons {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
        height: 32px;
      }

      .action-btn {
        flex: 1;
        background: #333;
        border: 2px outset #666;
        color: #ccc;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.1s;
      }

      .action-btn:hover {
        background: #444;
        border-color: #fff;
      }

      .action-btn:active {
        border-style: inset;
        background: #555;
      }

      .action-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .action-btn.active {
        background: #6a5a22;
        border-style: inset;
        color: #fff1a6;
      }

      /* --- RESOURCE INFO BELOW RADAR --- */
      .radar-info {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
        font-size: 11px;
        font-family: "Courier New", monospace;
        font-weight: bold;
      }

      .info-cell {
        background: #222;
        border: 1px solid #444;
        padding: 6px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
      }

      #credits-cell {
        text-align: left;
        color: gold;
      }

      #time-cell {
        color: #0f0;
      }

      #energy-cell {
        text-align: right;
        color: gold;
      }

      #energy-cell.low-power {
        color: #ff0000;
      }

      /* --- CONFIG MENU MODAL --- */
      #config-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      #config-overlay.hidden {
        display: none;
      }

      #config-modal {
        width: 70%;
        height: 70%;
        background: #2b3a2b;
        background-image: linear-gradient(rgba(128, 128, 128, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(128, 128, 128, 0.1) 1px, transparent 1px);
        background-size: 25px 25px;
        border: 3px solid #9e3a3a;
        border-radius: 8px;
        box-shadow:
          0 0 20px rgba(158, 58, 58, 0.3),
          inset 0 0 10px rgba(0, 0, 0, 0.8);
        padding: 20px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        max-height: 90vh;
      }

      #config-modal h1 {
        text-align: center;
        color: #9e3a3a;
        margin: 0 0 15px 0;
        font-size: 28px;
        text-shadow: 0 0 10px rgba(158, 58, 58, 0.5);
      }

      .config-section {
        margin-bottom: 15px;
      }

      .config-row {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-bottom: 10px;
        color: #9e3a3a;
      }

      .config-header {
        display: flex;
        gap: 15px;
        font-weight: bold;
        color: #9e3a3a;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .config-label {
        width: 100px;
        font-weight: bold;
        color: #9e3a3a;
        text-align: right;
      }

      .config-name {
        width: 100px;
        font-size: 16px;
      }

      .config-color {
        width: 80px;
        font-size: 16px;
      }

      .config-team {
        width: 80px;
        font-size: 16px;
      }

      .config-spawn {
        width: 60px;
        font-size: 16px;
      }

      input[type="text"].config-input {
        background: #222;
        border: 2px inset #555;
        color: #fff;
        padding: 6px;
        font-size: 12px;
        color: #ccc;
        margin: 0;
        min-width: 80px;
      }

      input[type="text"].config-input:focus {
        outline: none;
        border-color: #9e3a3a;
        box-shadow: 0 0 5px rgba(158, 58, 58, 0.5);
      }

      select.config-select {
        background: #222;
        border: 2px outset #666;
        color: #ccc;
        padding: 5px;
        font-size: 12px;
        cursor: pointer;
        min-width: 75px;
      }

      select.config-select:hover {
        background: #333;
        border-color: #9e3a3a;
      }

      select.config-select:focus {
        outline: none;
        border-color: #9e3a3a;
        box-shadow: 0 0 5px rgba(158, 58, 58, 0.5);
      }

      input[type="checkbox"].config-checkbox {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #9e3a3a;
      }

      .config-checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        color: #9e3a3a;
      }

      .config-bottom {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-top: 15px;
        padding-top: 15px;
      }

      .config-bottom-left {
        display: flex;
        gap: 30px;
        flex: 1;
      }

      .config-option-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: flex-start;
      }

      .config-option-group label {
        font-weight: bold;
        color: #9e3a3a;
        font-size: 12px;
      }

      button#config-start-btn {
        background: #222;
        border: 3px outset #9e3a3a;
        color: #9e3a3a;
        padding: 10px 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 4px;
        margin-left: auto;
        transition: all 0.2s;
        text-shadow: 0 0 5px rgba(158, 58, 58, 0.3);
      }

      button#config-start-btn:hover {
        background: #333;
        box-shadow: 0 0 10px rgba(158, 58, 58, 0.4);
        border-style: inset;
      }

      /* --- PAUSE MENU OVERLAY --- */
      #pause-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }

      #pause-overlay.hidden {
        display: none;
      }

      #pause-modal {
        width: 70%;
        height: 70%;
        background: #2b3a2b;
        background-image: linear-gradient(rgba(128, 128, 128, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(128, 128, 128, 0.1) 1px, transparent 1px);
        background-size: 25px 25px;
        border: 3px solid #9e3a3a;
        border-radius: 8px;
        box-shadow:
          0 0 20px rgba(158, 58, 58, 0.3),
          inset 0 0 10px rgba(0, 0, 0, 0.8);
        padding: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        max-height: 90vh;
      }

      #pause-modal h1 {
        text-align: center;
        color: #9e3a3a;
        margin: 0 0 15px 0;
        font-size: 28px;
        text-shadow: 0 0 10px rgba(158, 58, 58, 0.5);
      }

      .pause-content {
        display: flex;
        flex: 1;
        gap: 20px;
        overflow: hidden;
      }

      .pause-menu-left {
        width: 25%;
        min-width: 140px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 10px;
      }

      .pause-menu-btn {
        background: #2b3a2b;
        border: 2px outset #666;
        color: #ccc;
        padding: 10px 15px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 4px;
        text-align: left;
        transition: all 0.15s;
        text-shadow: 0 0 5px rgba(158, 58, 58, 0.2);
        border-left: 3px solid #9e3a3a;
      }

      .pause-menu-btn:hover {
        background: #3a4a3a;
        box-shadow: 0 0 8px rgba(158, 58, 58, 0.3);
      }

      .pause-menu-btn.active {
        background: #2b3a2b;
        border-style: inset;
        color: #9e3a3a;
        border-left-color: #ffffff;
      }

      .pause-menu-right {
        flex: 1;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 15px;
        overflow-y: auto;
        color: #ccc;
        font-size: 13px;
      }

      .pause-info-table {
        width: 100%;
        border-collapse: collapse;
      }

      .pause-info-table th {
        color: #ccc;
        font-size: 14px;
        padding: 8px 10px;
        text-align: left;
        border-bottom: 2px solid #ccc;
      }

      .pause-info-table td {
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .pause-info-table tr:hover td {
        background: rgba(255, 255, 255, 0.05);
      }

      .player-color-dot {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: middle;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .pause-restart-option {
        background: #2b3a2b;
        border: 2px outset #666;
        color: #ccc;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 25%;
        transition: all 0.15s;
        text-align: left;
      }

      .pause-restart-option:hover {
        background: #333;
        box-shadow: 0 0 8px rgba(158, 58, 58, 0.3);
        border-color: #9e3a3a;
      }

      .pause-restart-option:active {
        border-style: inset;
      }

      .pause-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #666;
        font-style: italic;
        font-size: 14px;
      }

      /* --- DEBUG LOG FENSTER --- */
      #debug-log-container {
        height: 50px; /* ~2 Spielfeldzellen (2 * 25px) */
        background: #0a0a0a;
        border: 2px inset #444;
        margin-top: 8px;
        padding: 4px;
        font-family: "Courier New", monospace;
        font-size: 10px;
        color: #00ff00;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        scrollbar-width: thin;
        scrollbar-color: #555 #111;
        user-select: text; /* Markierbar/Kopierbar */
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
      }
      #debug-log-container::-webkit-scrollbar {
        width: 8px;
      }
      #debug-log-container::-webkit-scrollbar-track {
        background: #111;
      }
      #debug-log-container::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 4px;
      }
      #debug-log-container::-webkit-scrollbar-thumb:hover {
        background: #777;
      }
      .debug-line {
        margin: 1px 0;
        line-height: 1.2;
        opacity: 0.7;
      }
      .debug-line:last-child {
        opacity: 1;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="rtscanvas"></canvas>

      <!-- CONFIG MODAL OVERLAY -->
      <div id="config-overlay">
        <div id="config-modal">
          <h1>Skirmish Game</h1>

          <!-- Player Configuration Section -->
          <div class="config-section">
            <!-- Header Row -->
            <div class="config-header">
              <div class="config-name" style="margin-left: 100px">Name</div>
              <div class="config-color" style="width: 70px; margin-left: 30px">Color</div>
              <div class="config-fraction" style="width: 70px; margin-left: 10px">Fraction</div>
              <div class="config-team" style="width: 80px; margin-left: 10px">Team</div>
              <div class="config-spawn" style="width: 60px; margin-left: 10px">Spawn</div>
            </div>

            <!-- Human Player Row -->
            <div class="config-row">
              <div class="config-label">Human:</div>
              <input type="text" class="config-input" id="config-human-name" value="Commander" maxlength="20" style="width: 75px" />
              <select class="config-select config-color-select" id="config-human-color">
                <option value="brown">🟫🟫🟫</option>
                <option value="red">🟥🟥🟥</option>
                <option value="orange">🟧🟧🟧</option>
                <option value="yellow">🟨🟨🟨</option>
                <option value="green">🟩🟩🟩</option>
                <option value="blue">🟦🟦🟦</option>
                <option value="magenta">🟪🟪🟪</option>
                <option value="black">⬛⬛⬛</option>
              </select>
              <select class="config-select" id="config-human-fraction" style="width: 80px; margin-left: 10px">
                <option value="0" selected>Random</option>
                <option value="1">Ukraine</option>
                <option value="2">Russia</option>
                <option value="3">US</option>
                <option value="4">Iran</option>
              </select>
              <select class="config-select" id="config-human-team" style="width: 60px; margin-left: 10px">
                <option value="-" selected>-</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
              <select class="config-select" id="config-human-spawn">
                <option value="A">A (Top-Left)</option>
                <option value="B">B (Top-Right)</option>
                <option value="C">C (Bot-Right)</option>
                <option value="D">D (Bot-Left)</option>
              </select>
            </div>

            <!-- AI Player 1 Row -->
            <div class="config-row">
              <div class="config-label">AI 1:</div>
              <select class="config-select" id="config-ai1-type" style="width: 96px">
                <option value="Open">Open</option>
                <option value="Rush-AI">Rush-AI</option>
                <option value="Normal-AI">Normal-AI</option>
                <option value="Turtle-AI">Turtle-AI</option>
                <option value="Naval-AI" selected>Naval-AI</option>
              </select>
              <select class="config-select config-color-select" id="config-ai1-color">
                <option value="brown">🟫🟫🟫</option>
                <option value="red" selected>🟥🟥🟥</option>
                <option value="orange">🟧🟧🟧</option>
                <option value="yellow">🟨🟨🟨</option>
                <option value="green">🟩🟩🟩</option>
                <option value="blue">🟦🟦🟦</option>
                <option value="magenta">🟪🟪🟪</option>
                <option value="black">⬛⬛⬛</option>
              </select>
              <select class="config-select" id="config-ai1-fraction" style="width: 80px; margin-left: 10px">
                <option value="0">Random</option>
                <option value="1">Ukraine</option>
                <option value="2">Russia</option>
                <option value="3">US</option>
                <option value="4">Iran</option>
              </select>
              <select class="config-select" id="config-ai1-team" style="width: 60px; margin-left: 10px">
                <option value="-" selected>-</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
              <select class="config-select" id="config-ai1-spawn">
                <option value="A">A (Top-Left)</option>
                <option value="B">B (Top-Right)</option>
                <option value="C">C (Bot-Right)</option>
                <option value="D">D (Bot-Left)</option>
              </select>
            </div>

            <!-- AI Player 2 Row -->
            <div class="config-row">
              <div class="config-label">AI 2:</div>

      function getBuildingGridRect(building) {
        const widthTiles = building.widthTiles || Math.max(1, Math.round((building.drawSize || TILE_SIZE) / TILE_SIZE));
        const heightTiles = building.heightTiles || widthTiles;

        let tileX;
        let tileY;

        if (typeof building.tileX === "number" && typeof building.tileY === "number") {
          tileX = building.tileX;
          tileY = building.tileY;
        } else {
          const cx = building.x ?? TILE_SIZE / 2;
          const cy = building.y ?? TILE_SIZE / 2;
          tileX = Math.round(cx / TILE_SIZE - widthTiles / 2);
          tileY = Math.round(cy / TILE_SIZE - heightTiles / 2);
        }

        return { tileX, tileY, widthTiles, heightTiles };
      }

      function getBuildingPixelRect(building) {
        const grid = getBuildingGridRect(building);
        return {
          x: grid.tileX * TILE_SIZE,
          y: grid.tileY * TILE_SIZE,
          width: grid.widthTiles * TILE_SIZE,
          height: grid.heightTiles * TILE_SIZE,
        };
      }

      function getBuildingBodyPixelRect(building) {
        const rect = getBuildingPixelRect(building);
        const bibRows = Math.max(0, Math.min(building.bibRows || 0, building.heightTiles || 0));
        const bibHeight = bibRows * TILE_SIZE;

        return {
          x: rect.x,
          y: rect.y,
          width: rect.width,
          height: Math.max(0, rect.height - bibHeight),
          bibY: rect.y + rect.height - bibHeight,
          bibHeight,
        };
      }

      function getBuildingBlockedGridRect(building) {
        const grid = getBuildingGridRect(building);
        const bibRows = Math.max(0, Math.min(building.bibRows || 0, grid.heightTiles));

        return {
          tileX: grid.tileX,
          tileY: grid.tileY,
          widthTiles: grid.widthTiles,
          heightTiles: Math.max(0, grid.heightTiles - bibRows),
        };
      }

      // --- A* PATHFINDER ---
      class Pathfinder {
        static getGridPos(x, y) {
          return { x: Math.floor(x / TILE_SIZE), y: Math.floor(y / TILE_SIZE) };
        }

        // Findet Pfad von Start (Pixel) zu Ziel (Pixel) unter Berücksichtigung von Gebäude-Blockaden
        // options.dockTarget: {x, y} Grid-Koordinate, die als Ziel erlaubt ist, auch wenn blockiert
        static findPath(startX, startY, endX, endY, buildings, mapWidth, mapHeight, options = {}) {
          const startNode = this.getGridPos(startX, startY);
          const endNode = this.getGridPos(endX, endY);
          const allowEndInBlocked = !!options.allowEndInBlocked;
          const dockTarget = options.dockTarget || null;

          // Grid Dimensionen
          const cols = Math.ceil(mapWidth / TILE_SIZE);
          const rows = Math.ceil(mapHeight / TILE_SIZE);

          // Closed Set (Besuchte Nodes)
          const closedSet = new Set();

          // Open Set (zu besuchende Nodes) mit Priority Queue simuliert durch Array Sortierung
          let openSet = [startNode];

          // CameFrom Map für Rekonstruktion
          const cameFrom = new Map();

          // gScore: Kosten vom Start bis hier
          const gScore = new Map();
          gScore.set(this.key(startNode), 0);

          // fScore: Geschätzte Gesamtkosten
          const fScore = new Map();
          fScore.set(this.key(startNode), Math.hypot(endNode.x - startNode.x, endNode.y - startNode.y));

          while (openSet.length > 0) {
            // Node mit niedrigstem fScore holen
            openSet.sort((a, b) => {
              const fa = fScore.get(this.key(a)) ?? Infinity;
              const fb = fScore.get(this.key(b)) ?? Infinity;
              return fa - fb;
            });

            const current = openSet.shift();

            // Ziel erreicht?
            if (current.x === endNode.x && current.y === endNode.y) {
              return this.reconstructPath(cameFrom, current);
            }

            closedSet.add(this.key(current));

            // Nachbarn
            const neighbors = [
              { x: 0, y: -1 },
              { x: 0, y: 1 },
              { x: -1, y: 0 },
              { x: 1, y: 0 }, // 4-Richtung
              // Diagonale könnten hier ergänzt werden, aber für RTT ist Manhattan oft besser
            ];

            for (let offset of neighbors) {
              const neighbor = { x: current.x + offset.x, y: current.y + offset.y };
              const nKey = this.key(neighbor);

              // Grenzen prüfen
              if (neighbor.x < 0 || neighbor.x >= cols || neighbor.y < 0 || neighbor.y >= rows) continue;

              // Kollision mit Gebäuden
              let blocked = false;
              for (let b of buildings) {
                const bGrid = getBuildingBlockedGridRect(b);
                if (neighbor.x >= bGrid.tileX && neighbor.x < bGrid.tileX + bGrid.widthTiles && neighbor.y >= bGrid.tileY && neighbor.y < bGrid.tileY + bGrid.heightTiles) {
                  blocked = true;
                  break;
                }
              }

              // Wenn der Nachbar das spezifische Dock-Ziel ist, erlauben wir den Eintritt
              if (blocked && dockTarget && neighbor.x === dockTarget.x && neighbor.y === dockTarget.y) {
                blocked = false;
              }

              // Ziel in blockierter Zelle nur erlauben, wenn explizit freigegeben (z.B. Harvester-Dock).
              if (blocked && !(allowEndInBlocked && neighbor.x === endNode.x && neighbor.y === endNode.y)) continue;

              if (closedSet.has(nKey)) continue;

              const tentativeG = gScore.get(this.key(current)) + 1; // Kosten immer 1 pro Kachel

              if (tentativeG < (gScore.get(nKey) ?? Infinity)) {
                cameFrom.set(nKey, current);
                gScore.set(nKey, tentativeG);
                fScore.set(nKey, tentativeG + Math.hypot(endNode.x - neighbor.x, endNode.y - neighbor.y));

                if (!openSet.some((n) => n.x === neighbor.x && n.y === neighbor.y)) {
                  openSet.push(neighbor);
                }
              }
            }
          }

          // Kein Pfad gefunden (Direkte Linie als Fallback für sehr kurze Distanzen oder Bug-Vermeidung)
          return null;
        }

        static key(node) {
          return `${node.x},${node.y}`;
        }

        static reconstructPath(cameFrom, current) {
          const totalPath = [current];
          let cKey = this.key(current);
          while (cameFrom.has(cKey)) {
            current = cameFrom.get(cKey);
            cKey = this.key(current);
            totalPath.unshift(current);
          }

          // Konvertiere Grid-Koordinaten zurück zu Pixel-Mittelpunkten
          return totalPath.map((n) => ({ x: n.x * TILE_SIZE + TILE_SIZE / 2, y: n.y * TILE_SIZE + TILE_SIZE / 2 }));
        }
      }

            this.alignTargetAngle = 0; // Zielwinkel für Ausrichtungs-Phase
            this.alignForLanding = false; // true: Ausrichtung dient der Landung, false: Kreuzflug/Neu-Ziel

            // Raketen-Beladung (Luft-Boden-Raketen): neu produzierter Heli startet voll bestückt
            this.maxMissiles = stats.raketen || 5;
            this.missiles = this.maxMissiles;
            this.lastMissileShotTime = 0; // Zeitstempel des letzten abgefeuerten Schusses (für 1s/2s-Linien-Wechsel)

            // Heliport-Dock: Ziel-Heliport, Docking-Status & Nachlade-Timer
            this.targetHelipad = null;
            this.helipadDocked = false;
            this.lastRefuelTime = 0;

            // Angriffs-Schwebeposition (verhindert dass mehrere Helis am selben Punkt schweben)
            this.attackHoverX = null;
            this.attackHoverY = null;
          }
        }

        // True wenn der Heli aktuell im Dock eines Heliports geparkt ist
        get isAtHelipadDock() {
          return !!this.helipadDocked && this.flightPhase === "parking";
        }

        update(units, buildings) {
          if (this.isDead) return;

          // Repair Bay Docking Logic
          if (this.type === "vehicle" && this.targetRepairBay) {
            const dock = game.getRepairBayDockPoint(this.targetRepairBay);
            const dist = Math.hypot(this.x - dock.x, this.y - dock.y);

            // Prüfe ob Dock bereits von einem anderen Fahrzeug belegt ist
            const dockOccupied = units.some((u) => {
              if (u === this || u.isDead) return false;
              return u.isDocked && u.targetRepairBay === this.targetRepairBay;
            });

            if (dist < 5) {
              if (dockOccupied) {
                // Dock belegt: Suche freie Zelle in der Nähe und postiere dort
                const freeSpot = game.findFreeSpotAroundTarget(dock.x, dock.y, TILE_SIZE * 2, units, buildings);
                if (freeSpot) {
                  this.targetX = freeSpot.x;
                  this.targetY = freeSpot.y;
                  this.path = [];
                  this.currentPathIndex = 0;
                  this.allowEndInBlocked = false;
                } else {
                  // Fallback: Bleibe stehen, aber nicht docked
                  this.targetX = null;
                  this.targetY = null;
                  this.path = [];
                  this.currentPathIndex = 0;
                }
                // Reparaturstatus zurücksetzen, da nicht angedockt
                this.isDocked = false;
                this.isRepairing = false;
                this.repairElapsed = 0;
                this.repairLastTick = 0;
                this.repairBlinkState = 0;
                this.targetRepairBay = null; // Befehl aufheben, um Endlosschleifen zu vermeiden
              } else {
                // Dock frei: Anlegen
                this.isDocked = true;
                this.currentTarget = null;
                this.targetX = null;
                this.targetY = null;
                this.path = [];
                this.currentPathIndex = 0;
                this.allowEndInBlocked = false;
              }
            } else {
              // Nicht mehr angedockt → Reparatur stoppen
              if (this.isDocked) {
                this.isDocked = false;
                this.isRepairing = false;
                this.repairElapsed = 0;
                this.repairLastTick = 0;
                this.repairBlinkState = 0;
              }
            }
          } else if (this.isDocked && !(this.type === "aircraft" && this.targetRepairBay)) {
            // targetRepairBay ist null aber noch als angedockt markiert → zurücksetzen
            this.isDocked = false;
            this.isRepairing = false;
            this.repairElapsed = 0;
            this.repairLastTick = 0;
            this.repairBlinkState = 0;
          }

          if (getBaseTypeId(this.typeKey) === "harvester") {
            this.updateHarvester(units, buildings);
            return;
          }

          if (this.type === "infantry" && this.formationGroupId !== null && !this.formationIsLeader) {
            return;
          }

          // Helikopter: Flug-Logik (direkte Bewegung, keine A*, keine Kollision)
          if (this.type === "aircraft") {
            // Heliport-Dock: fehlende Raketen nachladen ohne Kosten
            this.updateHelipadDockRefuel();

            // RepairBay-Dock: Gebäude nicht mehr vorhanden? → Docking aufheben
            if (this.targetRepairBay && !buildings.includes(this.targetRepairBay)) {
              this.targetRepairBay = null;
              this.isDocked = false;
              this.isRepairing = false;
              this.repairElapsed = 0;
              this.repairLastTick = 0;
              this.repairBlinkState = 0;
            }

            // Helikopter greifen NIE automatisch an (begrenzte Raketen):
            // nur per Angriffscursor gesetzte Attack-Moves feuern (updateHelicopterAttack)
            if (this.isAttackMove && this.attackTarget) {
              this.updateHelicopterAttack(units, buildings);
            } else {
              this.updateHelicopterFlight(units, buildings);
            }
          } else {
            this.moveAlongPath(units, buildings, false);

            // Kampf für Bodeneinheiten
            if (this.targetX === null && this.targetY === null && this.schaden > 0 && !this.isDocked) {
              this.combatUpdate(units, buildings);
            }
          }
        }

        setMoveTarget(x, y, allowEndInBlocked = false, dockTargetGrid = null) {
          this.targetX = x;
          this.targetY = y;
          this.path = [];
          this.currentPathIndex = 0;
          this.allowEndInBlocked = allowEndInBlocked;
          this.isDocked = false;
          this.isRepairing = false; // Reparaturstatus zurücksetzen
          this.repairElapsed = 0;
          this.repairLastTick = 0;
          this.repairBlinkState = 0;
          this.dockTargetGrid = dockTargetGrid;
          // Normaler Bewegungsbefehl: Vergiss altes Angriffsziel
          this.attackTarget = null;
          this.isAttackMove = false;
        }

        moveAlongPath(units, buildings, allowEndInBlocked = false) {
          if (this.targetX === null || this.targetY === null) {
            return { movedDistance: 0, reachedDestination: false };
          }

          if (!this.path || this.path.length === 0) {
            const pathOptions = { allowEndInBlocked };
            if (this.dockTargetGrid) {
              pathOptions.dockTarget = this.dockTargetGrid;
            }

            const p = Pathfinder.findPath(this.x, this.y, this.targetX, this.targetY, buildings, window.innerWidth - 280, window.innerHeight, pathOptions);

            if (p && p.length > 1) {
              this.path = p;
              this.currentPathIndex = 1;
            } else {
              // Kein Pfad gefunden → Ziel als unerreichbar markieren
              // Harvester: Kurs ändern um Endlosschleifen zu vermeiden
              if (getBaseTypeId(this.typeKey) === "harvester") {
                this.harvesterHeading += (Math.random() - 0.5) * Math.PI; // ±90° Kursänderung
                this.blockedFrames = 0; // Dodge-Counter zurücksetzen
              }
              this.targetX = null;
              this.targetY = null;
              this.path = [];
              this.currentPathIndex = 0;
              this.allowEndInBlocked = false;
              this.dockTargetGrid = null;
              return { movedDistance: 0, reachedDestination: false };
            }
          }

          let movedDistance = 0;

          if (this.path && this.currentPathIndex < this.path.length) {
            const nextPoint = this.path[this.currentPathIndex];
            const dx = nextPoint.x - this.x;
            const dy = nextPoint.y - this.y;
            const dist = Math.hypot(dx, dy);
            const prevX = this.x;
            const prevY = this.y;

            const moveMult = this.ownerData?.gameSpeedFactor || 1;
            if (dist < this.speed * moveMult) {
              this.x = nextPoint.x;
              this.y = nextPoint.y;
              this.currentPathIndex++;
            } else {
              const angle = Math.atan2(dy, dx);

              // Fahrzeuge (außer Harvester) ignorieren sich gegenseitig unterwegs
              // Infanterie und Harvester weichen aus
              const isHarvester = getBaseTypeId(this.typeKey) === "harvester";
              const shouldAvoid = this.type === "infantry" || isHarvester;

              if (shouldAvoid) {
                let avoidX = 0,
                  avoidY = 0;
                units.forEach((other) => {
                  if (other !== this) {
                    if (this.formationGroupId !== null && other.formationGroupId === this.formationGroupId) return;
                    const dOther = Math.hypot(this.x - other.x, this.y - other.y);
                    if (dOther < this.radius * 2 + 5) {
                      avoidX += this.x - other.x;
                      avoidY += this.y - other.y;
                    }
                  }
                });

                const avoidDist = Math.hypot(avoidX, avoidY);
                if (avoidDist > 0) {
                  avoidX = (avoidX / avoidDist) * this.speed * moveMult;
                  avoidY = (avoidY / avoidDist) * this.speed * moveMult;
                  this.x += Math.cos(angle) * (this.speed * moveMult * 0.5) + avoidX * 0.5;
                  this.y += Math.sin(angle) * (this.speed * moveMult * 0.5) + avoidY * 0.5;
                } else {
                  this.x += Math.cos(angle) * this.speed * moveMult;
                  this.y += Math.sin(angle) * this.speed * moveMult;
                }
              } else {
                // Andere Fahrzeuge: Geradeaus, kein Ausweichen
                this.x += Math.cos(angle) * this.speed * moveMult;
                this.y += Math.sin(angle) * this.speed * moveMult;
              }
            }

            movedDistance = Math.hypot(this.x - prevX, this.y - prevY);
          }

          if (!this.path || this.currentPathIndex >= this.path.length) {
            // Ziel erreicht

            // Attack-Move: Prüfe ob Angriffsziel noch in Reichweite
            if (this.isAttackMove && this.attackTarget && !this.attackTarget.isDead && this.attackTarget.bruchfest > 0) {
              const targetX = this.attackTarget.x;
              const targetY = this.attackTarget.y;
              const dist = Math.hypot(this.x - targetX, this.y - targetY);
              const rangePx = this.weite * TILE_SIZE;

              if (dist > rangePx) {
                // Ziel nicht in Reichweite - nachrücken auf 2/3 Reichweite
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                const parkRange = rangePx * (2 / 3);
                let newTargetX = targetX - Math.cos(angle) * parkRange;
                let newTargetY = targetY - Math.sin(angle) * parkRange;

                // Prüfe ob Position blockiert oder belegt
                const gridPos = Pathfinder.getGridPos(newTargetX, newTargetY);
                const isBlocked = game.isTileBlockedByBuildingBody(gridPos.x, gridPos.y);
                const isOccupied = units.some((u) => {
                  if (u.isDead || u === this) return false;
                  const uGrid = Pathfinder.getGridPos(u.x, u.y);
                  return uGrid.x === gridPos.x && uGrid.y === gridPos.y;
                });

                if (isBlocked || isOccupied) {
                  // Suche freie Zelle in der Nähe
                  const freeSpot = game.findFreeSpotAroundTarget(newTargetX, newTargetY, TILE_SIZE * 2, units, buildings);
                  if (freeSpot) {
                    newTargetX = freeSpot.x;
                    newTargetY = freeSpot.y;
                  }
                }

                this.targetX = newTargetX;
                this.targetY = newTargetY;
                this.path = [];
                this.currentPathIndex = 0;
                return { movedDistance, reachedDestination: false };
              }

              // Ziel in Reichweite: Bewegung stoppen, Kampf-Logik aktivieren
              // isAttackMove und attackTarget BEIBEHALTEN damit combatUpdate() weiter feuert

              // Prüfe ob aktuelle Position von anderer Einheit belegt ist (Umparken bei Gruppen)
              const myGrid = Pathfinder.getGridPos(this.x, this.y);
              const isOccupied = units.some((u) => {
                if (u.isDead || u === this) return false;
                const uGrid = Pathfinder.getGridPos(u.x, u.y);
                return uGrid.x === myGrid.x && uGrid.y === myGrid.y;
              });

              if (isOccupied) {
                // Umparken: Suche freie Zelle in der Nähe
                const freeSpot = game.findFreeSpotAroundTarget(this.x, this.y, TILE_SIZE * 2, units, buildings);
                if (freeSpot) {
                  this.targetX = freeSpot.x;
                  this.targetY = freeSpot.y;
                  this.path = [];
                  this.currentPathIndex = 0;
                  return { movedDistance, reachedDestination: false };
                }
              }

              this.targetX = null;
              this.targetY = null;
              this.path = [];
              this.currentPathIndex = 0;
              return { movedDistance, reachedDestination: true };
            }

            // Kein Attack-Move oder Ziel vernichtet: Wache stehen (1.)
            // Für Fahrzeuge (außer Harvester): Entzerrung in der Zielregion
            if ((this.type === "vehicle" || this.type === "aircraft") && getBaseTypeId(this.typeKey) !== "harvester" && !this.isAttackMove) {
              const otherUnits = units.filter((u) => u !== this);
              const freeSpot = game.findFreeSpotAroundTarget(this.targetX, this.targetY, this.radius * 2, otherUnits, buildings);
              if (freeSpot) {
                this.x = freeSpot.x;
                this.y = freeSpot.y;
              }
            }

            this.targetX = null;
            this.targetY = null;
            this.path = [];
            this.currentPathIndex = 0;
            this.allowEndInBlocked = false;
            this.isAttackMove = false;
            this.attackTarget = null;
            return { movedDistance, reachedDestination: true };
          }

          return { movedDistance, reachedDestination: false };
        }

        resolveHarvesterRefinery(buildings) {
          if (this.targetRefinery && buildings.includes(this.targetRefinery) && getBaseTypeId(this.targetRefinery.name) === "refinery") {
            return this.targetRefinery;
          }

          // Nur eigene Raffinerien als Ziel erlauben (index-basiert, robust gegen doppelte AI-Typen)
          const myOwnerIndex = this.ownerIndex !== undefined ? this.ownerIndex : gameConfig.players.indexOf(this.ownerData);
          const nearest =
            buildings
              .filter((b) => getBaseTypeId(b.name) === "refinery" && b.ownerIndex === myOwnerIndex)
              .sort((a, b) => {
                const ca = getBuildingCenter(a);
                const cb = getBuildingCenter(b);
                return Math.hypot(this.x - ca.x, this.y - ca.y) - Math.hypot(this.x - cb.x, this.y - cb.y);
              })[0] || null;

          this.targetRefinery = nearest;
          return nearest;
        }

        setNextHarvesterRoamTarget() {
          if (!game || !game.canvas) return;

          const step = TILE_SIZE * 3;
          const margin = TILE_SIZE * 0.6;
          const maxX = game.canvas.width - margin;
          const maxY = game.canvas.height - margin;

          let nextX = this.x + Math.cos(this.harvesterHeading) * step;
          let nextY = this.y + Math.sin(this.harvesterHeading) * step;

          if (nextX < margin || nextX > maxX) {
            this.harvesterHeading = Math.PI - this.harvesterHeading;
            nextX = this.x + Math.cos(this.harvesterHeading) * step;
          }

          if (nextY < margin || nextY > maxY) {
            this.harvesterHeading = -this.harvesterHeading;
            nextY = this.y + Math.sin(this.harvesterHeading) * step;
          }

          nextX = Math.max(margin, Math.min(maxX, nextX));
          nextY = Math.max(margin, Math.min(maxY, nextY));

          if (game && typeof game.getValidatedMoveTarget === "function") {
            const safe = game.getValidatedMoveTarget(this, nextX, nextY, { allowRefineryDock: false });
            nextX = safe.x;
            nextY = safe.y;
          }

          // Mindestabstand-Check: Verhindert dass Ziel zu nah am aktuellen Standort liegt
          // (kann in engen Gebieten vorkommen wenn getValidatedMoveTarget den aktuellen Standort zurückgibt)
          const distToTarget = Math.hypot(nextX - this.x, nextY - this.y);
          if (distToTarget < TILE_SIZE * 0.8) {
            // Kurs randomisieren um im engen Gebiet trotzdem Fortschritt zu ermöglichen
            this.harvesterHeading += (Math.random() - 0.5) * Math.PI * 0.8;
            nextX = this.x + Math.cos(this.harvesterHeading) * step;
            nextY = this.y + Math.sin(this.harvesterHeading) * step;
            nextX = Math.max(margin, Math.min(maxX, nextX));
            nextY = Math.max(margin, Math.min(maxY, nextY));
            if (game && typeof game.getValidatedMoveTarget === "function") {
              const safe = game.getValidatedMoveTarget(this, nextX, nextY, { allowRefineryDock: false });
              nextX = safe.x;
              nextY = safe.y;
            }
          }

          this.setMoveTarget(nextX, nextY, false);
        }

        orderHarvesterReturnToRefinery(refinery, dockX, dockY) {
          this.targetRefinery = refinery;
          this.harvesterState = "returning";
          this.speed = this.harvesterNormalSpeed;
          const dockGrid = getDockGridPos(refinery);
          this.setMoveTarget(dockX, dockY, true, dockGrid);
        }

        startHarvesterUnload() {
          this.harvesterState = "unloading";
          this.unloadStartMs = Date.now();
          this.unloadProgressMs = 0;
          this.unloadLastTick = this.unloadStartMs;
          this.unloadTickIndex = 0;
          this.hitStorageLimitThisUnload = false;
          this.targetX = null;
          this.targetY = null;
          this.path = [];
          this.currentPathIndex = 0;
          this.allowEndInBlocked = false;
          if (this.ownerIndex === 0) game.updateUI("Harvester entlädt...");
        }

        updateHelicopterFlight(units, buildings) {
          const now = Date.now();
          const moveMult = this.ownerData?.gameSpeedFactor || 1;

          // Rotor-Animation: Nur während Flugs (taking_off + aligning + cruising)
          if (this.flightPhase === "taking_off" || this.flightPhase === "aligning" || this.flightPhase === "cruising") {
            this.rotorTimer += 16;
            if (this.rotorTimer > 100) {
              this.rotorFrame = (this.rotorFrame + 1) % 3;
              this.rotorTimer = 0;
            }
          }

          // --- PHASE: ABFLUG ---
          // Heli startet senkrecht (Blick Osten), bewegt sich 1 Kachel nach Norden
          if (this.flightPhase === "taking_off") {
            const targetY = Math.max(TILE_SIZE, this.takeoffStartY - TILE_SIZE);
            const dy = targetY - this.y;
            const dist = Math.abs(dy);

            if (dist < this.speed * moveMult) {
              this.y = targetY;
              // Berechne Winkel zum Ziel und wechsle zu Ausrichtung (Kreuzflug, keine Landung)
              this.alignTargetAngle = Math.atan2(this.cruiseTargetY - this.y, this.cruiseTargetX - this.x);
              this.alignForLanding = false;
              this.flightPhase = "aligning";
            } else {
              this.y += dy > 0 ? this.speed * moveMult : -this.speed * moveMult;
            }
            return;
          }

          // --- PHASE: AUSRICHTUNG ---
          // Heli dreht sich sichtbar zum Zielwinkel (kurzester Weg, max 180°)
          if (this.flightPhase === "aligning") {
            const alignSpeed = 0.03 * moveMult; // Langsamer für bessere Animation
            let angleDiff = this.alignTargetAngle - this.helicopterHeading;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

            if (Math.abs(angleDiff) < alignSpeed) {
              this.helicopterHeading = this.alignTargetAngle;
              // Wechsle zur nächsten Phase (robust über Flag statt fragiler Winkelwert-Prüfung)
              if (this.alignForLanding) {
                this.flightPhase = "landing";
              } else {
                this.flightPhase = "cruising";
              }
            } else {
              this.helicopterHeading += Math.sign(angleDiff) * alignSpeed;
            }
            return;
          }

          // --- PHASE: KREUZFLUG ---
          // Fliege geradlinig zum Ziel (1 Kachel nördlich des Landeplatzes).
          // Heading bleibt konstant (wurde in der aligning-Phase auf das Ziel ausgerichtet) –
          // keine Neuberechnung pro Frame, da bei geradlinigem Flug nicht erforderlich.
          if (this.flightPhase === "cruising") {
            if (this.cruiseTargetX === null || this.cruiseTargetY === null) {
              this.flightPhase = "landing";
              return;
            }

            const dx = this.cruiseTargetX - this.x;
            const dy = this.cruiseTargetY - this.y;
            const dist = Math.hypot(dx, dy);

            if (dist < this.speed * moveMult) {
              this.x = this.cruiseTargetX;
              this.y = this.cruiseTargetY;
              // Wechsle zu Ausrichtung für Landung (Front nach Osten)
              this.alignTargetAngle = 0;
              this.alignForLanding = true;
              this.flightPhase = "aligning";
            } else {
              const step = Math.min(this.speed * moveMult, dist);
              this.x += Math.cos(this.helicopterHeading) * step;
              this.y += Math.sin(this.helicopterHeading) * step;
            }
            return;
          }

          // --- PHASE: LANDUNG ---
          // Über dem Landeplatz: Front nach Osten, 1 Kachel nach Süden absenken
          if (this.flightPhase === "landing") {
            const landingSpot = this.assignedLandingSpot || { x: this.targetX, y: this.targetY };
            const targetY = landingSpot.y;
            const dy = targetY - this.y;
            const dx = landingSpot.x - this.x;
            const dist = Math.hypot(dx, dy);

            if (dist < this.speed * moveMult) {
              // Heliport-Dock-Check im Moment der Landung: Nur ein Heli pro Dock.
              // Wenn das Dock jetzt belegt ist, suche zuerst einen anderen Heliport des Spielers mit freiem Dock
              // und leite den Heli dorthin um (damit er dort Raketen nachladen kann).
              // Falls kein freies Dock existiert: wie bisher freie Zelle in der Nähe suchen und dorthin fliegen.
              if (this.targetHelipad && game.isHelipadDockOccupied(this.targetHelipad, this)) {
                const altHelipad = this.findFreeDockHelipad();
                if (altHelipad) {
                  // Umleitung auf das freie Dock eines anderen Heliports (setHelipadDockTarget übernimmt die Flugplanung)
                  if (this.ownerIndex === 0) game.updateUI(`Heli-Dock belegt – Umleitung zu ${getBuildingDisplayName(altHelipad.name)}.`);
                  this.setHelipadDockTarget(altHelipad);
                  return;
                }
                const newSpot = game.findHelicopterLandingSpot(landingSpot.x, landingSpot.y, this.radius * 2, game.units, game.buildings, this);
                if (newSpot) {
                  this.setFlightTarget(newSpot.x, newSpot.y);
                  return;
                }
                // Kein freier Platz: NIE auf ein belegtes Dock landen – schweben bleiben und nächsten Frame erneut prüfen
                return;
              }

              // Landeplatz-Check im Moment der Landung: Wenn die Zelle jetzt belegt ist,
              // neue freie Zelle suchen und dorthin fliegen (gleiche Funktion wie bei Spawn/Zielsetzung)
              const spotGrid = Pathfinder.getGridPos(landingSpot.x, landingSpot.y);
              const isOccupiedNow = game.units.some((u) => {
                if (u === this || u.isDead) return false;
                const uGrid = Pathfinder.getGridPos(u.x, u.y);
                return uGrid.x === spotGrid.x && uGrid.y === spotGrid.y;
              });
              if (isOccupiedNow) {
                const newSpot = game.findHelicopterLandingSpot(landingSpot.x, landingSpot.y, this.radius * 2, game.units, game.buildings, this);
                if (newSpot) {
                  this.setFlightTarget(newSpot.x, newSpot.y);
                  return;
                }
                // Kein freier Platz: NIE auf einer belegten Zelle landen – schweben bleiben und nächsten Frame erneut prüfen
                return;
              }

              // Exakt auf der Zielposition landen (bei Heliport-Dock: Mitte des "H", nicht rasterorientiert)
              this.x = landingSpot.x;
              this.y = targetY;
              this.flightPhase = "parking";
              this.parking = true;
              this.helicopterHeading = 0;
              this.rotorFrame = 0;
              this.rotorTimer = 0;
              this.targetX = null;
              this.targetY = null;
              this.cruiseTargetX = null;
              this.cruiseTargetY = null;
              this.assignedLandingSpot = null;

              // Gelandet im Heliport-Dock? → Docking-Status setzen (Raketen-Nachladen startet)
              if (this.targetHelipad) {
                this.helipadDocked = true;
                this.lastRefuelTime = Date.now();
              } else if (this.targetRepairBay) {
                // Gelandet am RepairBay-Dock → Reparatur-Status setzen
                this.isDocked = true;
              } else {
                this.targetHelipad = null;
                this.helipadDocked = false;
              }
            } else {
              // Senkung auf den Landeplatz (x wird dabei exakt nachgeführt, wichtig für nicht rasterorientierte Docks)
              const stepDist = Math.hypot(dx, dy);
              if (stepDist > 0) {
                const step = Math.min(this.speed * moveMult, stepDist);
                this.x += (dx / stepDist) * step;
                this.y += (dy / stepDist) * step;
              }
            }
            return;
          }

          // --- PARKING: Nichts tun ---
        }

        // Angriff mit Raketen: Heli gewinnt (falls gelandet) erst Höhe, richtet sich per Rotation auf das Ziel aus,
        // nähert sich dann auf 2/3 Reichweite an, schwebt in der Luft und feuert nacheinander seine Raketen ab.
        updateHelicopterAttack(units, buildings) {
          const now = Date.now();
          const moveMult = this.ownerData?.gameSpeedFactor || 1;

          // Ziel ungültig (zerstört/tot)? → Angriff beenden, zurück zum Heliport
          if (!this.attackTarget || this.attackTarget.isDead || this.attackTarget.bruchfest <= 0) {
            this.endHelicopterAttack();
            return;
          }

          const targetX = this.attackTarget.x;
          const targetY = this.attackTarget.y;
          const rangePx = this.weite * TILE_SIZE;
          const hoverRange = rangePx * (2 / 3);
          const dx = targetX - this.x;
          const dy = targetY - this.y;
          const dist = Math.hypot(dx, dy) || 0.001;

          // Rotor-Animation während des Angriffs (Abflug + Ausrichtung + Angriff)
          this.rotorTimer += 16;
          if (this.rotorTimer > 100) {
            this.rotorFrame = (this.rotorFrame + 1) % 3;
            this.rotorTimer = 0;
          }

          // --- PHASE: ABFLUG (nur wenn gelandet gestartet wurde): erst Höhe gewinnen ---
          if (this.flightPhase === "taking_off") {
            const takeoffTargetY = Math.max(TILE_SIZE, this.takeoffStartY - TILE_SIZE);
            const dyUp = takeoffTargetY - this.y;
            const distUp = Math.abs(dyUp);

            if (distUp < this.speed * moveMult) {
              this.y = takeoffTargetY;
              // Höhe gewonnen: Richtung Ziel ausrichten
              this.alignTargetAngle = Math.atan2(targetY - this.y, targetX - this.x);
              this.flightPhase = "aligning";
            } else {
              this.y += dyUp > 0 ? this.speed * moveMult : -this.speed * moveMult;
            }
            return;
          }

          // --- PHASE: AUSRICHTUNG (Front per Rotation auf das Ziel drehen, ohne zu bewegen) ---
          if (this.flightPhase === "aligning") {
            const targetAngle = Math.atan2(targetY - this.y, targetX - this.x);
            let angleDiff = targetAngle - this.helicopterHeading;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

            const alignSpeed = 0.03 * moveMult; // Langsame Rotation wie bei Linksklick-Flug
            if (Math.abs(angleDiff) <= alignSpeed) {
              this.helicopterHeading = targetAngle;
              // Ausgerichtet: in Annäherung/Feuer-Phase wechseln
              this.flightPhase = "attacking";
            } else {
              this.helicopterHeading += Math.sign(angleDiff) * alignSpeed;
            }
            return;
          }

          // --- PHASE: ANGRIF (Annäherung auf 2/3 Reichweite + Raketenfeuer) ---
          // Zweierlei Maß: hoverRange (2/3) = bevorzugte Schwebeposition, rangePx (volle weite) = Feuerreichweite.
          // Der Heli feuert sobald er in voller Reichweite ist – unabhängig davon, ob er die exakte Hover-Distanz erreicht hat.
          if (dist > rangePx) {
            // Außerhalb der Feuerreichweite: dem Ziel auf 2/3 Reichweite entgegenfliegen
            this.flightPhase = "attacking";
            // Neue Annäherung: alte Schwebeposition verwerfen (wird bei Ankunft neu vergeben)
            this.attackHoverX = null;
            this.attackHoverY = null;
            const step = Math.min(this.speed * moveMult, dist - hoverRange);
            this.x += (dx / dist) * step;
            this.y += (dy / dist) * step;

            // Front zeigt auf das Ziel (glattes Drehen über den kürzesten Weg)
            const targetAngle = Math.atan2(dy, dx);
            let angleDiff = targetAngle - this.helicopterHeading;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            const turnSpeed = 0.15; // Radiant pro Frame
            if (Math.abs(angleDiff) <= turnSpeed) {
              this.helicopterHeading = targetAngle;
            } else {
              this.helicopterHeading += Math.sign(angleDiff) * turnSpeed;
            }
          } else {
            // In Feuerreichweite: schweben und Raketen nacheinander abfeuern
            this.flightPhase = "attacking";

            // Keine Raketen mehr? → erst jetzt (in Reichweite angekommen) Angriff beenden, zurück zum Heliport
            if (this.missiles <= 0) {
              this.endHelicopterAttack();
              return;
            }

            // --- Schwebeposition verteilen (vermeidet dass mehrere Helis am selben Punkt schweben) ---
            // Gewünschte Position: Projektion meiner aktuellen Position auf den 2/3-Reichweiten-Kreis um das Ziel.
            const desiredX = targetX + ((this.x - targetX) / dist) * hoverRange;
            const desiredY = targetY + ((this.y - targetY) / dist) * hoverRange;

            // Veraltete Schwebeposition verwerfen (Ziel bewegt sich → außerhalb der Feuerreichweite)
            if (this.attackHoverX !== null && Math.hypot(this.attackHoverX - targetX, this.attackHoverY - targetY) > rangePx) {
              this.attackHoverX = null;
              this.attackHoverY = null;
            }

            // Mein reservierter Schwebepunkt wurde von anderem Heli belegt? → neu suchen
            if (this.attackHoverX !== null && game.isHelicopterTileOccupied(this.attackHoverX, this.attackHoverY, this)) {
              this.attackHoverX = null;
              this.attackHoverY = null;
            }

            // Mein aktueller Platz ist von anderem Heli belegt? → nächstgelegene von Helis freie Zelle suchen.
            // Bodeneinheiten blockieren nicht – der Heli fliegt in der Ebene darüber.
            if (this.attackHoverX === null && game.isHelicopterTileOccupied(this.x, this.y, this)) {
              const spot = game.findFreeHelicopterHoverSpot(desiredX, desiredY, this);
              if (spot) {
                this.attackHoverX = spot.x;
                this.attackHoverY = spot.y;
              }
            }

            // Bewegung: zur Schwebeposition fliegen, sonst wie bisher auf 2/3 Reichweite annähern (aber trotzdem feuern)
            if (this.attackHoverX !== null) {
              const hdx = this.attackHoverX - this.x;
              const hdy = this.attackHoverY - this.y;
              const hdist = Math.hypot(hdx, hdy);
              if (hdist > 0.5) {
                const step = Math.min(this.speed * moveMult, hdist);
                this.x += (hdx / hdist) * step;
                this.y += (hdy / hdist) * step;
              }
            } else if (dist > hoverRange) {
              const step = Math.min(this.speed * moveMult, dist - hoverRange);
              this.x += (dx / dist) * step;
              this.y += (dy / dist) * step;
            }

            // Front zeigt auf das Ziel (glattes Drehen über den kürzesten Weg)
            const targetAngle = Math.atan2(dy, dx);
            let angleDiff = targetAngle - this.helicopterHeading;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            const turnSpeed = 0.15; // Radiant pro Frame
            if (Math.abs(angleDiff) <= turnSpeed) {
              this.helicopterHeading = targetAngle;
            } else {
              this.helicopterHeading += Math.sign(angleDiff) * turnSpeed;
            }

            const fireIntervalMs = this.schussfrequenz * 1000;
            if (!this.lastMissileShotTime || now - this.lastMissileShotTime >= fireIntervalMs) {
              // Rakete abfeuern (Schaden + Streuung sofort anwenden)
              this.missiles--;
              this.lastMissileShotTime = now;
              this.applyDamage(this.attackTarget, this.schaden, this.streuung, units, buildings);

              if (this.ownerIndex === 0 && this.missiles <= 0) {
                game.updateUI("Helikopter: Raketen alle.");
              }
            }
          }
        }

        // Angriff beenden: Ziel vergessen und zum nächstgelegenen Heliport des Spielers zurückkehren (landen)
        endHelicopterAttack() {
          this.isAttackMove = false;
          this.attackTarget = null;
          this.currentTarget = null;
          this.lastMissileShotTime = 0;
          // Schwebeposition verwerfen (wird bei neuem Angriff neu vergeben)
          this.attackHoverX = null;
          this.attackHoverY = null;

          const helipad = this.findFreeDockHelipad() || this.findNearestHelipad();
          if (helipad) {
            // Zurück zum Dock des Heliports – bevorzugt ein freies Dock, sonst nächster Heliport.
            // Ist das gewählte Dock bei Ankunft belegt, erfolgt die Umleitung in der Landungs-Phase erneut.
            this.setHelipadDockTarget(helipad);
          } else {
            // Kein Heliport verfügbar: schwebe auf der Stelle
            this.flightPhase = "parking";
            this.parking = true;
            this.targetX = null;
            this.targetY = null;
            this.cruiseTargetX = null;
            this.cruiseTargetY = null;
            this.helipadDocked = false;
            this.targetHelipad = null;
            this.targetRepairBay = null;
            this.isDocked = false;
          }
        }

        // Finde den nächstgelegenen Heliport des eigenen Spielers
        findNearestHelipad() {
          let nearest = null;
          let nearestDist = Infinity;
          for (const b of game.buildings) {
            if (getBaseTypeId(b.name) !== "helipad") continue;
            if (b.ownerIndex !== this.ownerIndex) continue;
            const center = getBuildingCenter(b);
            const dist = Math.hypot(this.x - center.x, this.y - center.y);
            if (dist < nearestDist) {
              nearestDist = dist;
              nearest = b;
            }
          }
          return nearest;
        }

        // Finde den nächstgelegenen Heliport des eigenen Spielers mit FREIEM Dock.
        // Wird genutzt, wenn das Ziel-Dock beim Ankommen belegt ist: Der Heli wird dann
        // auf ein anderes freies Dock umgeleitet, damit er dort Raketen nachladen kann.
        findFreeDockHelipad() {
          let nearest = null;
          let nearestDist = Infinity;
          for (const b of game.buildings) {
            if (getBaseTypeId(b.name) !== "helipad") continue;
            if (b.ownerIndex !== this.ownerIndex) continue;
            if (game.isHelipadDockOccupied(b, this)) continue;
            const center = getBuildingCenter(b);
            const dist = Math.hypot(this.x - center.x, this.y - center.y);
            if (dist < nearestDist) {
              nearestDist = dist;
              nearest = b;
            }
          }
          return nearest;
        }

        updateHarvester(units, buildings) {
          const now = Date.now();
          const refinery = this.resolveHarvesterRefinery(buildings);

          // --- FOOTPRINT STUCK TIMEOUT (Strategie 1 + Ernte-Reset) ---
          if (this.harvesterState === "returning" && this.targetRefinery) {
            const refineryGrid = getBuildingGridRect(this.targetRefinery);
            const myGridPos = Pathfinder.getGridPos(this.x, this.y);
            const isInFootprint = myGridPos.x >= refineryGrid.tileX && myGridPos.x < refineryGrid.tileX + refineryGrid.widthTiles && myGridPos.y >= refineryGrid.tileY && myGridPos.y < refineryGrid.tileY + refineryGrid.heightTiles;

            if (isInFootprint) {
              this.footprintStuckFrames = (this.footprintStuckFrames || 0) + 1;
              // ~3 Sekunden bei 60 FPS. Wenn Harvester im Footprint steckt, wird er zurück zur Ernte geschickt.
              if (this.footprintStuckFrames > 180) {
                this.harvesterState = "leaving";
                this.leaveDistance = 0;
                this.footprintStuckFrames = 0;
                this.path = [];
                this.targetX = null;
                this.targetY = null;
                // harvestedDistance bleibt erhalten -> beim nächsten Update sofort wieder "returning", aber von neuer Position
              }
            } else {
              this.footprintStuckFrames = 0;
            }
          }

          if (this.harvesterState === "unloading") {
            if (!this.unloadLastTick) this.unloadLastTick = now;
            const delta = Math.max(0, now - this.unloadLastTick);
            this.unloadLastTick = now;
            const harvesterOwnerIdx = this.ownerIndex !== undefined && this.ownerIndex >= 0 ? this.ownerIndex : 0;
            const speedFactor = game && typeof game.getProductionSpeedFactor === "function" ? game.getProductionSpeedFactor(harvesterOwnerIdx) : 1;
            this.unloadProgressMs = Math.min(this.unloadDurationMs, this.unloadProgressMs + delta * speedFactor);

            const elapsedSec = Math.floor(this.unloadProgressMs / 1000);
            const payableTicks = Math.min(this.unloadTotalTicks, elapsedSec);

            while (this.unloadTickIndex < payableTicks) {
              // Bestimme das richtige Konto basierend auf dem Harvester-Eigentümer (Human oder AI)
              const targetAccount = this.ownerIndex >= 0 ? game.getAccount(this.ownerIndex) : game.getAccount(0);
              const harvestCreditResult = game.addHarvestCredits(this.unloadCreditsPerSecond, targetAccount);
              if (harvestCreditResult.lost > 0) {
                this.hitStorageLimitThisUnload = true;
              }
              this.unloadTickIndex++;
              if (this.ownerIndex === 0 && this.hitStorageLimitThisUnload) game.updateUI("Silos needed");
            }

            if (this.unloadProgressMs >= this.unloadDurationMs) {
              this.harvestedDistance = 0;
              this.leaveDistance = 0;
              this.harvesterHeading = Math.random() * Math.PI * 2;
              this.harvesterState = "leaving";
              this.speed = this.harvesterNormalSpeed;
              this.unloadTickIndex = 0;
              this.unloadProgressMs = 0;
              this.unloadLastTick = 0;

              // AI Economy: Transfer excess harvest credits to unitBuild if building queue is complete (index-basiert)
              if (this.ownerIndex > 0 && game.npcAiState[this.ownerIndex]) {
                const aiState = game.npcAiState[this.ownerIndex];
                if (aiState.nextBuildingIndex >= aiState.buildQueue.length) {
                  const account = game.getAccount(this.ownerIndex);
                  if (account.harvest > 2500) {
                    const transferAmount = account.harvest - 2500;
                    account.harvest -= transferAmount;
                    account.unitBuild += transferAmount;
                  }
                }
              }

              if (this.ownerIndex === 0 && this.hitStorageLimitThisUnload) game.updateUI("Silos needed");
              else if (this.ownerIndex === 0) game.updateUI("Harvester entladen.");
            }
            return;
          }

          if (!refinery && this.harvesterState === "returning") {
            this.harvesterState = "manual";
            this.allowEndInBlocked = false;
          }

          if (this.harvesterState === "leaving" || this.harvesterState === "harvesting") {
            if (this.targetX === null || this.targetY === null) {
              this.setNextHarvesterRoamTarget();
            }
          }

          if (this.harvesterState === "returning" && this.targetX === null && refinery) {
            const dock = game.getRefineryUnloadPoint(refinery);
            const dockGrid = Pathfinder.getGridPos(dock.x, dock.y);
            const distToDock = Math.hypot(this.x - dock.x, this.y - dock.y);
            const proximityThreshold = TILE_SIZE * 2; // Nur in der Nähe prüfen

            // Prüfe ob Dock bereits von anderem Harvester belegt ist
            const dockOccupied = units.some((u) => {
              if (u === this || u.isDead) return false;
              if (getBaseTypeId(u.typeKey) !== "harvester") return false;
              const uGrid = Pathfinder.getGridPos(u.x, u.y);
              return uGrid.x === dockGrid.x && uGrid.y === dockGrid.y;
            });

            if (distToDock > proximityThreshold) {
              // Weit entfernt: Einfach zum Dock fahren
              this.setMoveTarget(dock.x, dock.y, true);
            } else if (dockOccupied) {
              // In der Nähe und belegt: Ausweichen in der Nähe des Docks
              const dodgeAngle = Math.random() * Math.PI * 2;
              const step = TILE_SIZE * 1.5;
              const margin = TILE_SIZE * 0.6;
              const maxX = (game?.canvas?.width ?? window.innerWidth - 280) - margin;
              const maxY = (game?.canvas?.height ?? window.innerHeight) - margin;
              const dodgeX = Math.max(margin, Math.min(maxX, dock.x + Math.cos(dodgeAngle) * step));
              const dodgeY = Math.max(margin, Math.min(maxY, dock.y + Math.sin(dodgeAngle) * step));
              this.setMoveTarget(dodgeX, dodgeY, false);
            } else {
              // In der Nähe und frei: Ins Dock fahren
              this.setMoveTarget(dock.x, dock.y, true);
            }
          }

          this.speed = this.harvesterState === "harvesting" ? this.harvesterHarvestSpeed : this.harvesterNormalSpeed;

          const movement = this.moveAlongPath(units, buildings, this.allowEndInBlocked);

          if (this.targetX !== null && this.targetY !== null) {
            const moveMult = this.ownerData?.gameSpeedFactor || 1;
            const moveThreshold = Math.max(0.1, this.speed * moveMult * 0.15);

            // --- STUCK DETECTION: Prüfe ob Distanz zum Ziel abnimmt ---
            const distToTarget = Math.hypot(this.targetX - this.x, this.targetY - this.y);
            if (!this._lastDistToTarget) this._lastDistToTarget = distToTarget;

            // Harvester ist "stuck" wenn kaum Bewegung ODER Distanz zum Ziel nicht signifikant abnimmt
            // FIX: Schwellenwert dynamisch an Geschwindigkeit anpassen, sonst werden langsame Einheiten (Naval/Turtle) fälschlich als stuck markiert
            const isMakingProgress = distToTarget < this._lastDistToTarget - Math.max(0.1, this.speed * moveMult * 0.5);
            if (movement.movedDistance < moveThreshold || !isMakingProgress) {
              this.blockedFrames++;
            } else {
              this.blockedFrames = 0;
            }
            this._lastDistToTarget = distToTarget;

            // Dodge nur bei längerem Blockieren (40 Frames statt 20) und mit Cooldown
            if (this.blockedFrames > 40 && this.type !== "aircraft") {
              const originalTarget = {
                x: this.targetX,
                y: this.targetY,
                allowEndInBlocked: this.allowEndInBlocked,
              };

              const approachAngle = Math.atan2(originalTarget.y - this.y, originalTarget.x - this.x);
              const side = Math.random() < 0.5 ? -1 : 1;
              const dodgeAngle = approachAngle + (side * Math.PI) / 2;
              const step = TILE_SIZE * 1.2;
              const margin = TILE_SIZE * 0.6;
              const maxX = (game?.canvas?.width ?? window.innerWidth - 280) - margin;
              const maxY = (game?.canvas?.height ?? window.innerHeight) - margin;
              const dodgeX = Math.max(margin, Math.min(maxX, this.x + Math.cos(dodgeAngle) * step));
              const dodgeY = Math.max(margin, Math.min(maxY, this.y + Math.sin(dodgeAngle) * step));

              // Im Erntemodus kein Zurückkehren zum alten Ziel, falls es weiterhin blockiert ist.
              // Stattdessen wird nach dem Dodge ein neues Ziel generiert, um auf einer freien Nachbarkachel weiter zu ernten.
              if (this.harvesterState !== "harvesting") {
                this.pathAfterDetour = originalTarget;
              }
              this.setMoveTarget(dodgeX, dodgeY, false);
              this.blockedFrames = 0;
              // Harvester: Kurs leicht ändern um Dodge-Schleifen zu vermeiden
              if (getBaseTypeId(this.typeKey) === "harvester") {
                this.harvesterHeading += (Math.random() - 0.5) * Math.PI * 0.5;
              }
            }
          } else {
            this.blockedFrames = 0;
          }

          if (this.pathAfterDetour && this.targetX === null && this.targetY === null && this.type !== "aircraft") {
            const resume = this.pathAfterDetour;
            this.pathAfterDetour = null;
            this._lastDistToTarget = null; // Reset Stuck-Detection beim Resume
            this.setMoveTarget(resume.x, resume.y, resume.allowEndInBlocked);
          }

          // --- HARVESTER EMERGENCY UNSTUCK: Wenn nach Dodge immer noch stuck, komplett neues Ziel ---
          if (getBaseTypeId(this.typeKey) === "harvester" && this.blockedFrames > 120) {
            this.updateUI(`Debug Harvester unstuck: ${this.ownerIndex}`);
            this.blockedFrames = 0;
            this._lastDistToTarget = null;
            this.path = [];
            this.currentPathIndex = 0;
            this.targetX = null;
            this.targetY = null;
            this.allowEndInBlocked = false;
            this.dockTargetGrid = null;
            this.pathAfterDetour = null;
            this.harvesterHeading += (Math.random() - 0.5) * Math.PI; // Radikale Kursänderung
          }

          if (this.harvesterState === "leaving") {
            this.leaveDistance += movement.movedDistance;
            if (this.leaveDistance >= this.leaveDistanceTarget) {
              this.harvesterState = "harvesting";
              this.speed = this.harvesterHarvestSpeed;
              this.path = [];
              this._lastDistToTarget = null; // Reset beim State-Wechsel
            }
          } else if (this.harvesterState === "harvesting") {
            this.harvestedDistance = Math.min(this.maxHarvestDist, this.harvestedDistance + movement.movedDistance);
            if (this.harvestedDistance >= this.maxHarvestDist && refinery) {
              this.harvesterState = "returning";
              this.speed = this.harvesterNormalSpeed;
              this.path = [];
              this.targetX = null;
              this.targetY = null;
            }
          }

          if ((this.harvesterState === "leaving" || this.harvesterState === "harvesting") && movement.reachedDestination && this.type !== "aircraft") {
            this.setNextHarvesterRoamTarget();
          }

          if (this.harvesterState === "returning" && refinery) {
            const dock = game.getRefineryUnloadPoint(refinery);
            const dockDist = Math.hypot(this.x - dock.x, this.y - dock.y);
            if (dockDist <= Math.max(4, this.speed * gameSpeedFactor + 1)) {
              if (this.harvestedDistance >= this.maxHarvestDist) {
                this.startHarvesterUnload();
              } else {
                this.harvesterState = "leaving";
                this.leaveDistance = 0;
                this.harvesterHeading = Math.random() * Math.PI * 2;
                this.path = [];
                this.targetX = null;
                this.targetY = null;
                this.allowEndInBlocked = false;
