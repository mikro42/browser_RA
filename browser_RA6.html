              const totalTime = (unitData.time || 5000) / aiPlayer.gameSpeedFactor;

              if (elapsed >= totalTime) {
                this.spawnUnitForAI(aiIndex, state.currentProduction.type);
                state.currentProduction = null;
              } else {
                continue; // Noch im Bau
              }
            }

            // Wenn nicht produziert und Ziel-Einheit bestimmt: Kredit-Check & Start
            if (targetUnitId) {
              const unitData = UNIT_TYPES[targetUnitId];
              const aiAccount = this.getAccount(aiIndex);
              const hasCY = this.buildings.some((b) => getBaseTypeId(b.name) === "constructionyard" && b.ownerIndex === aiIndex);

              if (hasCY) {
                // Normaler Modus: Nur unitBuild verwenden (20% Quote)
                if (aiAccount.unitBuild >= unitData.cost) {
                  aiAccount.unitBuild -= unitData.cost;
                  if (this.playerStats[aiIndex]) this.playerStats[aiIndex].current.spend_credits_for_units += unitData.cost;
                  state.currentProduction = { type: targetUnitId };
                  state.buildStartTime = now;
                }
              } else {
                // Kein CY: Alle Credits für Einheiten verwenden
                if (aiAccount.credits >= unitData.cost) {
                  this.spendCredits(unitData.cost, aiAccount);
                  if (this.playerStats[aiIndex]) this.playerStats[aiIndex].current.spend_credits_for_units += unitData.cost;
                  state.currentProduction = { type: targetUnitId };
                  state.buildStartTime = now;
                }
              }
            }
          }
        }

        spawnUnitForAI(aiIndex, unitId) {
          const aiPlayer = gameConfig.players[aiIndex];
          let spawner = null;
          const baseId = getBaseTypeId(unitId);

          if (baseId === "rifleman") {
            spawner = this.buildings.find((b) => getBaseTypeId(b.name) === "barracks" && b.ownerIndex === aiIndex);
          } else if (["tank", "harvester", "mobile_flak"].includes(baseId)) {
            spawner = this.buildings.find((b) => getBaseTypeId(b.name) === "warfactory" && b.ownerIndex === aiIndex);
          } else if (baseId === "helicopter") {
            spawner = this.buildings.find((b) => getBaseTypeId(b.name) === "helipad" && b.ownerIndex === aiIndex);
          }

          let spawnX, spawnY;
          if (spawner) {
            const rect = getBuildingPixelRect(spawner);
            const body = getBuildingBodyPixelRect(spawner);

            // Fahrzeuge (Tank, Mobile Flak): Auf BIB (Betonfläche) mittig spawnen, falls belegt → Umreissuche
            if (["tank", "mobile_flak"].includes(baseId) && body.bibHeight > 0) {
              const bibCenterX = rect.x + rect.width / 2;
              const bibCenterY = body.bibY + body.bibHeight / 2;

              // Prüfe ob BIB-Zelle belegt ist
              const bibGrid = Pathfinder.getGridPos(bibCenterX, bibCenterY);
              const isOccupied = this.units.some((u) => {
                if (u.isDead) return false;
                const uGrid = Pathfinder.getGridPos(u.x, u.y);
                return uGrid.x === bibGrid.x && uGrid.y === bibGrid.y;
              });

              if (!isOccupied) {
                spawnX = bibCenterX;
                spawnY = bibCenterY;
              } else {
                // Umreissuche mit steigendem Radius (wie bei Fahrzeuggruppen-Ankunft)
                const freeSpot = this.findFreeSpotAroundTarget(bibCenterX, bibCenterY, TILE_SIZE * 1.5, this.units, this.buildings);
                if (freeSpot) {
                  spawnX = freeSpot.x;
                  spawnY = freeSpot.y;
                } else {
                  // Fallback: Gebäudemitte
                  spawnX = rect.x + rect.width / 2;
                  spawnY = rect.y + rect.height / 2;
                }
              }
            } else if (baseId === "helicopter") {
              // Helikopter wie beim Human-Player: westlich des Heliports, validiert über findHelicopterLandingSpot
              const desiredSpawnX = rect.x - rect.width / 2;
              const desiredSpawnY = rect.y + rect.height / 2;
              const spot = this.findHelicopterLandingSpot(desiredSpawnX, desiredSpawnY, TILE_SIZE, this.units, this.buildings);
              if (spot) {
                spawnX = spot.x;
                spawnY = spot.y;
              } else {
                spawnX = desiredSpawnX;
                spawnY = desiredSpawnY;
              }
            } else {
              // Harvester, Infanterie: Gebäudemitte
              spawnX = rect.x + rect.width / 2;
              spawnY = rect.y + rect.height / 2;
            }
          } else {
            // Fallback auf Spawn-Position
            const spawnMap = { A: [6.5, 6.5], B: [this.cols - 6.5, 6.5], C: [this.cols - 6.5, this.rows - 6.5], D: [6.5, this.rows - 6.5] };
            const pos = spawnMap[aiPlayer.spawn] || [10, 10];
            spawnX = pos[0] * TILE_SIZE;
            spawnY = pos[1] * TILE_SIZE;
          }

          const unit = new Entity(spawnX, spawnY, aiPlayer, unitId);
          this.units.push(unit);

          // Harvester: Raffinerie zuweisen & Erntezyklus starten (nicht Trupp-zuweisen)
          if (getBaseTypeId(unit.typeKey) === "harvester") {
            const refinery = this.buildings.find((b) => getBaseTypeId(b.name) === "refinery" && b.ownerIndex === aiIndex);
            if (refinery) {
              unit.targetRefinery = refinery;
              unit.harvesterState = "harvesting";
              unit.leaveDistance = 0;
              unit.harvestedDistance = 0;
            }
            return;
          }

          // MCV nicht Trupp-zuweisen
          if (unit.typeKey === "mcv") return;

          // Einheit einem Trupp zuweisen (reihum von 5 nach 0 auffüllen)
          this.assignUnitToTroop(aiIndex, unit);
        }

        // Weist eine Einheit einem Trupp zu (reihum von 0 aufwärts, mit Wrap-around).
        // Der fillIndex trackt die aktuelle Auffüllposition. Er rückt nur vor, wenn ein Trupp voll ist.
        // Lücken in früheren Trupps werden erst gefüllt, nachdem alle nachfolgenden Trupps voll sind.
        assignUnitToTroop(aiIndex, unit) {
          const aiState = this.npcAiState[aiIndex];
          if (!aiState || !aiState.troops) return;

          // Fill-Index initialisieren falls noch nicht vorhanden (z.B. nach altem Save)
          if (aiState.fillIndex === undefined) aiState.fillIndex = 0;

          // Starte am aktuellen Fill-Index und gehe aufwärts (mit Wrap-around über alle 6 Trupps)
          for (let i = 0; i < 6; i++) {
            const idx = (aiState.fillIndex + i) % 6;
            const troop = aiState.troops[idx];
            if (troop && !troop.isFull) {
              if (troop.addUnit(unit)) {
                // Nur wenn der Trupp jetzt VOLL ist, Fill-Index auf den nächsten Trupp vorrücken
                if (troop.isFull) {
                  aiState.fillIndex = (idx + 1) % 6;
                }
                return;
              }
            }
          }
        }

        // --- PAUSE MENU ---

        togglePause() {
          this.paused = !this.paused;
          const overlay = document.getElementById("pause-overlay");
          if (this.paused) {
            overlay.classList.remove("hidden");
            this.updatePauseContent();
          } else {
            overlay.classList.add("hidden");
          }
        }

        updatePauseContent() {
          const contentRight = document.getElementById("pause-content-right");
          if (!contentRight) return;

          // Menü-Buttons aktualisieren
          document.querySelectorAll(".pause-menu-btn").forEach((btn) => btn.classList.remove("active"));
          const activeBtn = document.getElementById(`pause-btn-${this.pauseMenuActiveTab}`);
          if (activeBtn) activeBtn.classList.add("active");

          contentRight.innerHTML = "";

          switch (this.pauseMenuActiveTab) {
            case "info":
              this.renderPauseInfo(contentRight);
              break;
            case "stats":
              this.renderPauseStats(contentRight);
              break;
            case "settings":
              this.renderPauseSettings(contentRight);
              break;
            case "restart":
              this.renderPauseRestart(contentRight);
              break;
            default:
              this.renderPauseInfo(contentRight);
          }
        }

        setPauseMenuTab(tabName) {
          this.pauseMenuActiveTab = tabName;
          this.updatePauseContent();
        }

        renderPauseInfo(container) {
          // Game Over Nachricht anzeigen (nur bei State 2=win oder 3=lose)
          if (this.gameOverState >= 2) {
            const missionBox = document.createElement("div");
            missionBox.style.cssText = `
              text-align: center; 
              margin-bottom: 20px; 
              padding: 15px; 
              border: 2px solid #ccc;
            `;

            const missionLine1 = document.createElement("div");
            missionLine1.style.cssText = `
              font-size: 28px; 
              font-weight: bold; 
              color: #ccc;
              margin-bottom: 8px;
            `;
            missionLine1.textContent = this.gameOverState === 2 ? "Mission: Accomplished" : "Mission: Failed";
            missionBox.appendChild(missionLine1);

            const missionLine2 = document.createElement("div");
            missionLine2.style.cssText = `
              font-size: 22px; 
              color: #ccc;
            `;
            const humanName = gameConfig.players[0].name || "Commander";
            missionLine2.textContent = this.gameOverState === 2 ? `${humanName} wins` : `${humanName} loses`;
            missionBox.appendChild(missionLine2);

            container.appendChild(missionBox);
          }

          const table = document.createElement("table");
          table.className = "pause-info-table";

          const thead = document.createElement("thead");
          const headerRow = document.createElement("tr");
          ["Player", "Fraction", "Score"].forEach((text) => {
            const th = document.createElement("th");
            th.textContent = text;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          gameConfig.players.forEach((player, index) => {
            // AI-Spieler mit type "Open" nicht anzeigen
            if (index > 0 && player.type === "Open") return;

            const tr = document.createElement("tr");

            // Player Name mit Gamepad-Symbol in Spielerfarbe
            const tdName = document.createElement("td");
            const gamepadIcon = document.createElement("span");
            gamepadIcon.style.cssText = `font-size: 16px; margin-right: 8px; vertical-align: middle; filter: drop-shadow(0 0 2px ${colorMap[player.color] || "#9e3a3a"});`;
            gamepadIcon.textContent = "🎮";
            tdName.appendChild(gamepadIcon);
            tdName.appendChild(document.createTextNode(player.name));
            tr.appendChild(tdName);

            // Fraction
            const tdFraction = document.createElement("td");
            tdFraction.textContent = FRACTION_LABELS[player.fraction] || "Unknown";
            tr.appendChild(tdFraction);

            // Score (noch frei)
            const tdScore = document.createElement("td");
            tdScore.textContent = "-";
            tr.appendChild(tdScore);

            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          container.appendChild(table);
        }

        renderPauseStats(container) {
          const placeholder = document.createElement("div");
          placeholder.className = "pause-placeholder";
          placeholder.textContent = "Statistics coming soon...";
          container.appendChild(placeholder);
        }

        renderPauseSettings(container) {
          const placeholder = document.createElement("div");
          placeholder.className = "pause-placeholder";
          placeholder.textContent = "Settings coming soon...";
          container.appendChild(placeholder);
        }

        renderPauseRestart(container) {
          // Option 1: Restart this Game
          const btnRestart = document.createElement("button");
          btnRestart.className = "pause-restart-option";
          btnRestart.textContent = "Restart this Game";
          btnRestart.addEventListener("click", () => {
            this.restartCurrentGame();
          });
          container.appendChild(btnRestart);

          // Option 2: Start New Game
          const btnNew = document.createElement("button");
          btnNew.className = "pause-restart-option";
          btnNew.textContent = "Start New Game";
          btnNew.addEventListener("click", () => {
            this.startNewGame();
          });
          container.appendChild(btnNew);
        }

        restartCurrentGame() {
          // Spiel zurücksetzen, Config behalten
          this.paused = false;
          document.getElementById("pause-overlay").classList.add("hidden");

          // Alle Einheiten und Gebäude entfernen
          this.units = [];
          this.buildings = [];
          this.selectedUnits = [];
          this.selectedBuilding = null;
          this.activeRepairs = [];
          this.clickMarkers = [];
          this.repairEffects = [];
          this.samMissiles = [];

          // Accounts zurücksetzen
          this.accounts.forEach((acc) => {
            acc.base = gameConfig.startingCash;
            acc.harvest = 0;
            acc.harvestLimit = 0;
            acc.unitBuild = 0;
            acc.energyBalance = 0;
          });

          // Production Queues zurücksetzen
          this.productionQueueInfantry = [];
          this.productionQueueVehicle = [];
          this.productionQueueAircraft = [];
          this.currentProductionInfantry = null;
          this.currentProductionVehicle = null;
          this.currentProductionAircraft = null;
          this.buildingProductionQueue = [];
          this.defenseProductionQueue = [];
          this.currentBuildingProduction = null;
          this.currentDefenseProduction = null;
          this.buildingProductionStates = {};

          // AI State zurücksetzen
          for (let aiIndex = 1; aiIndex < gameConfig.players.length; aiIndex++) {
            this.npcAiState[aiIndex] = {
              buildQueue: [],
              nextBuildingIndex: 0,
              currentBuilding: null,
              buildStartTime: 0,
              nextBuildDelayUntil: 0,
              nextSellDelayUntil: 0,
              showDefeatMessage: false,
              unitProduction: null,
              currentState: 10,
              productionPaused: false,
              sellTargetCredits: 0,
              defeated: false,
              fillIndex: 0,
              troops: this.createAITroops(aiIndex),
            };
            const aiPlayer = gameConfig.players[aiIndex];
            const fraction = aiPlayer.fraction || 1;
            const buildQueue = NPC_AI_BUILD_QUEUE[fraction];
            if (buildQueue) {
              this.npcAiState[aiIndex].buildQueue = [...buildQueue];
            }
          }
          this.aiUnitStates = {};

          // Game Over zurücksetzen
          this.gameOverState = 0;
          this.gameOverTimer = 0;

          // Flags zurücksetzen
          this.aiMcvsSpawned = false;
          this.constructedBuildings = [];
          this.refineryCount = 0;
          this.buildingsUnlocked = false;
          this.startTime = Date.now();
          this.lastStatsMinute = 0;

          // MCV für Human Player spawnen
          const spawnPositions = {
            A: { x: 6.5 * TILE_SIZE, y: 6.5 * TILE_SIZE },
            B: { x: (this.cols - 6.5) * TILE_SIZE, y: 6.5 * TILE_SIZE },
            C: { x: (this.cols - 6.5) * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE },
            D: { x: 6.5 * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE },
          };
          const humanSpawn = gameConfig.players[0].spawn;
          const mcv = new Entity(spawnPositions[humanSpawn].x, spawnPositions[humanSpawn].y, gameConfig.players[0], "mcv");
          this.units.push(mcv);

          // UI zurücksetzen
          this.initSidebar();
          this.switchTab("buildings");
          this.updateGameDisplay();
          this.updateUI("Game restarted.");
        }

        startNewGame() {
          // Pause-Menü schließen
          this.paused = false;
          document.getElementById("pause-overlay").classList.add("hidden");

          // Config-Modal wieder anzeigen
          document.getElementById("config-overlay").classList.remove("hidden");

          // Game-Instanz zerstören (Loop stoppen)
          // Da wir im Loop sind, setzen wir ein Flag
          this.gameShuttingDown = true;
        }

        // --- GAME LOOP ---

        loop(timestamp) {
          if (this.gameShuttingDown) return;

          const dt = timestamp - this.lastTime;
          this.lastTime = timestamp;

          this.update();
          this.draw();

          requestAnimationFrame(this.loop);
        }

        update() {
          if (this.paused) return;

          // Game Over Timer prüfen (nur wenn State 2 oder 3, d.h. Ergebnis steht)
          if (this.gameOverState >= 2 && this.gameOverTimer && Date.now() >= this.gameOverTimer) {
            this.togglePause();
            this.gameOverTimer = 0; // Verhindert erneutes Öffnen
          }

          const now = Date.now();
          const currentMinute = Math.floor((now - this.startTime) / 60000);
          if (currentMinute > this.lastStatsMinute) {
            for (let i = 0; i < this.playerStats.length; i++) {
              this.playerStats[i].current.total_credits = this.accounts[i].credits;
              this.playerStats[i].history.push({ ...this.playerStats[i].current });
              this.playerStats[i].current = {
                total_credits: 0,
                harvested_credits: 0,
                building_placed: 0,
                building_lost: 0,
                enemy_building_destroyed: 0,
                spend_credits_for_units: 0,
                value_units_lost_in_credits: 0,
                value_units_killed_in_credits: 0,
              };
            }
            this.lastStatsMinute = currentMinute;
          }

          this.updateGameDisplay();
          this.updateRadar();
          this.processRepairBays();
          this.processRepairs();
          this.processSAMMissiles();
          if (!this.aiMcvsSpawned && Date.now() - this.startTime > 500) {
            this.aiMcvsSpawned = true;
            this.updateUI(`[system] AI MCVs spawning now...`, "ai_state");
            const spawnPositions = {
              A: { x: 6.5 * TILE_SIZE, y: 6.5 * TILE_SIZE },
              B: { x: (this.cols - 6.5) * TILE_SIZE, y: 6.5 * TILE_SIZE },
              C: { x: (this.cols - 6.5) * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE },
              D: { x: 6.5 * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE },
            };
            for (let aiIndex = 1; aiIndex < gameConfig.players.length; aiIndex++) {
              const aiPlayer = gameConfig.players[aiIndex];
              if (aiPlayer.type !== "Open") {
                const aiSpawn = aiPlayer.spawn;
                const aiMcv = new Entity(spawnPositions[aiSpawn].x, spawnPositions[aiSpawn].y, aiPlayer, "mcv");
                this.units.push(aiMcv);
              }
            }
          }
          this.processBuildingProduction();
          this.processProduction();
          this.updateAIStateMachine();
          this.updateAllTroops(); // Trupp-System update
          this.updateBuildingCombat();
          this.checkGameEndConditions();

          this.units.forEach((u) => u.update(this.units, this.buildings));
          this.updateInfantryVirtualVehicleFollowers();
          this.regroupIdleInfantryAtDestination();
          this.enforceInfantryTileCapacity();

          this.units = this.units.filter((u) => {
            if (u.bruchfest <= 0 && !u.isDead) {
              u.isDead = true;
              u.deathTime = now;
              const ownerIdx = u.ownerIndex;
              const unitCost = (UNIT_TYPES[u.typeKey] || {}).cost || 0;
              if (this.playerStats[ownerIdx]) this.playerStats[ownerIdx].current.value_units_lost_in_credits += unitCost;
              for (let p = 0; p < this.playerStats.length; p++) {
                if (p !== ownerIdx) this.playerStats[p].current.value_units_killed_in_credits += unitCost;
              }
            }
            return !(u.isDead && now - u.deathTime > 5000);
          });

          this.buildings = this.buildings.filter((b) => {
            if (b.bruchfest <= 0) {
              const ownerIdx = b.ownerIndex;
              if (this.playerStats[ownerIdx]) this.playerStats[ownerIdx].current.building_lost++;
              for (let p = 0; p < this.playerStats.length; p++) {
                if (p !== ownerIdx) this.playerStats[p].current.enemy_building_destroyed++;
              }
              if (b.ownerIndex === 0) {
                const baseId = getBaseTypeId(b.name);
                const hasRemaining = this.buildings.some((ob) => ob !== b && getBaseTypeId(ob.name) === baseId && ob.ownerIndex === 0);
                if (!hasRemaining) {
                  if (baseId === "barracks") this.cancelAllProductionForCategory("infantry");
                  else if (baseId === "warfactory") this.cancelAllProductionForCategory("vehicle");
                  else if (baseId === "helipad") this.cancelAllProductionForCategory("aircraft");
                }
              }
              return false;
            }
            return true;
          });
          this.updateProductionTabs();

          // Prüfe ob AI Spieler besiegt sind
          this.checkAIDefeat();

          for (let i = this.clickMarkers.length - 1; i >= 0; i--) {
            this.clickMarkers[i].life--;
            if (this.clickMarkers[i].life <= 0) this.clickMarkers.splice(i, 1);
          }
        }

        updateBuildingCombat() {
          const now = Date.now();
          for (const building of this.buildings) {
            if (building.isDead || building.bruchfest <= 0) continue;
            const typeData = this.getBuildingTypeById(building.name);
            if (!typeData || typeData.schaden <= 0) continue;

            const rangePx = typeData.weite * TILE_SIZE;
            const center = getBuildingCenter(building);

            // Finde Ziel
            if (!building.currentTarget || building.currentTarget.isDead || building.currentTarget.bruchfest <= 0) {
              building.currentTarget = null;
              // Suche nach feindlichen Einheiten
              for (const unit of this.units) {
                if (unit.isDead || unit.bruchfest <= 0) continue;
                if (unit.ownerIndex === building.ownerIndex) continue;
                if (building.ownerData?.team_id && unit.ownerData?.team_id && building.ownerData.team_id === unit.ownerData.team_id) continue;
                const dist = Math.hypot(center.x - unit.x, center.y - unit.y);
                if (dist <= rangePx && this.canTargetBuildingUnit(typeData, unit)) {
                  building.currentTarget = unit;
                  break;
                }
              }
              // Suche nach feindlichen Gebäuden
              if (!building.currentTarget) {
                for (const otherBuilding of this.buildings) {
                  if (otherBuilding.isDead || otherBuilding.bruchfest <= 0) continue;
                  if (otherBuilding.ownerIndex === building.ownerIndex) continue;
                  if (building.ownerData?.team_id && otherBuilding.ownerData?.team_id && building.ownerData.team_id === otherBuilding.ownerData.team_id) continue;
                  const otherCenter = getBuildingCenter(otherBuilding);
                  const dist = Math.hypot(center.x - otherCenter.x, center.y - otherCenter.y);
                  if (dist <= rangePx && (typeData.ziele & 4) !== 0) {
                    building.currentTarget = otherBuilding;
                    break;
                  }
                }
              }
            }

            // Feuern
            if (building.currentTarget) {
              const targetCenter = building.currentTarget.x !== undefined ? { x: building.currentTarget.x, y: building.currentTarget.y } : getBuildingCenter(building.currentTarget);
              const dist = Math.hypot(center.x - targetCenter.x, center.y - targetCenter.y);
              if (dist > rangePx) {
                building.currentTarget = null;
                continue;
              }
              if (!building.lastShotTime || now - building.lastShotTime >= typeData.schussfrequenz * 1000) {
                building.lastShotTime = now;
                if (getBaseTypeId(building.name) === "sam") {
                  // SAM: sichtbare Boden-Luft-Rakete mit Helicopter-ähnlichem Flug (Homing + Rotation, 2s Flug + 3s Pause)
                  this.fireSAMMissile(building, building.currentTarget);
                } else {
                  if (!building.projectiles) building.projectiles = [];
                  building.projectiles.push({
                    target: building.currentTarget,
                    damage: typeData.schaden,
                    spread: typeData.streuung,
                    travelTime: 600,
                    firedAt: now,
                    sourceX: center.x,
                    sourceY: center.y,
                  });
                }
              }
            }

            // Projektile verarbeiten
            if (building.projectiles) {
              for (let i = building.projectiles.length - 1; i >= 0; i--) {
                const proj = building.projectiles[i];
                if (now - proj.firedAt >= proj.travelTime) {
                  this.applyBuildingDamage(building, proj.target, proj.damage, proj.spread);
                  building.projectiles.splice(i, 1);
                }
              }
            }
          }
        }

        canTargetBuildingUnit(typeData, unit) {
          if (!typeData.ziele) return true;
          if (unit.type === "infantry" || unit.type === "vehicle") return (typeData.ziele & 2) !== 0;
          if (unit.type === "aircraft") return (typeData.ziele & 8) !== 0;
          return true;
        }

        applyBuildingDamage(sourceBuilding, target, damage, spread) {
          if (!target) return;
          if (target.bruchfest !== undefined) target.bruchfest -= damage;
          const spreadPx = spread * TILE_SIZE;
          const targetCenter = target.x !== undefined ? { x: target.x, y: target.y } : getBuildingCenter(target);
          const all = [...this.units, ...this.buildings];
          for (const ent of all) {
            if (ent === target || ent === sourceBuilding || ent.isDead) continue;
            if (ent.ownerIndex === sourceBuilding.ownerIndex) continue;
            const entCenter = ent.x !== undefined ? { x: ent.x, y: ent.y } : getBuildingCenter(ent);
            const dist = Math.hypot(targetCenter.x - entCenter.x, targetCenter.y - entCenter.y);
            if (dist <= spreadPx && ent.bruchfest !== undefined) {
              ent.bruchfest -= Math.floor(damage * 0.5);
            }
          }
        }

        // SAM: Boden-Luft-Rakete abschießen (Homing-Flug mit Rotation wie Helikopter-Angriff)
        fireSAMMissile(building, target) {
          const typeData = this.getBuildingTypeById(building.name);
          const center = getBuildingCenter(building);
          const tPos = target.x !== undefined ? { x: target.x, y: target.y } : getBuildingCenter(target);
          const speedFactor = building.ownerData?.gameSpeedFactor || 1;
          this.samMissiles.push({
            x: center.x,
            y: center.y,
            heading: Math.atan2(tPos.y - center.y, tPos.x - center.x),
            baseSpeed: TILE_SIZE * 0.1, // ~300px in 2s bei Faktor 1 (schneller als Helis)
            speedFactor,
            target,
            sourceBuilding: building,
            damage: typeData.schaden || 0,
            spread: typeData.streuung || 0,
            elapsedMs: 0,
            lastTick: Date.now(),
            lifeMs: 2000 / speedFactor, // 2s Flugzeit (skaliert mit Spieltempo)
          });
        }

        processSAMMissiles() {
          const now = Date.now();
          for (let i = this.samMissiles.length - 1; i >= 0; i--) {
            const m = this.samMissiles[i];
            if (!m || !m.lastTick) {
              this.samMissiles.splice(i, 1);
              continue;
            }

            // Source-Gebäude zerstört? → Rakete einfach entfernen (kein Schaden mehr)
            if (!m.sourceBuilding || m.sourceBuilding.bruchfest <= 0) {
              this.samMissiles.splice(i, 1);
              continue;
            }

            const delta = Math.max(0, now - m.lastTick);
            m.lastTick = now;
            m.elapsedMs += delta;

            const targetAlive = m.target && !m.target.isDead && m.target.bruchfest > 0;
            let tPos = null;
            if (targetAlive) {
              if (typeof m.target.x === "number" && typeof m.target.y === "number") {
                tPos = { x: m.target.x, y: m.target.y };
              } else {
                const c = getBuildingCenter(m.target);
                if (c && isFinite(c.x) && isFinite(c.y)) tPos = c;
              }
            }

            if (tPos && isFinite(tPos.x) && isFinite(tPos.y)) {
              // Homing wie Helikopter-Angriff: Front per Rotation auf das Ziel drehen
              const desiredAngle = Math.atan2(tPos.y - m.y, tPos.x - m.x);
              if (isFinite(desiredAngle)) {
                let angleDiff = desiredAngle - m.heading;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                const turnSpeed = 0.15; // Radiant pro Frame (wie Helikopter)
                if (Math.abs(angleDiff) <= turnSpeed) {
                  m.heading = desiredAngle;
                } else {
                  m.heading += Math.sign(angleDiff) * turnSpeed;
                }
              }

              const dist = Math.hypot(tPos.x - m.x, tPos.y - m.y);
              if (dist < TILE_SIZE * 0.6) {
                // Treffer: Schaden + Streuung anwenden
                this.applyBuildingDamage(m.sourceBuilding, m.target, m.damage, m.spread);
                this.samMissiles.splice(i, 1);
                continue;
              }
            }

            const step = m.baseSpeed * m.speedFactor;
            if (isFinite(step) && isFinite(m.heading)) {
              m.x += Math.cos(m.heading) * step;
              m.y += Math.sin(m.heading) * step;
            }

            // Flugzeit abgelaufen (2s): Rakete explodiert, Treffer nur wenn Ziel noch lebt
            if (m.elapsedMs >= m.lifeMs) {
              if (targetAlive) this.applyBuildingDamage(m.sourceBuilding, m.target, m.damage, m.spread);
              this.samMissiles.splice(i, 1);
            }
          }
        }

        checkGameEndConditions() {
          // State 0 -> 1: Aktivieren sobald AI MCVs da sind
          if (this.gameOverState === 0 && this.aiMcvsSpawned) {
            this.gameOverState = 1;
          }
          // Nur bei State 1 prüfen; bei 2/3 ist das Ergebnis endgültig
          if (this.gameOverState !== 1) return;

          const now = Date.now();
          const humanBuildings = this.buildings.filter((b) => b.ownerIndex === 0).length;
          const humanUnits = this.units.filter((u) => u.ownerIndex === 0 && !u.isDead).length;

          // Human verloren?
          if (humanBuildings === 0 && humanUnits === 0) {
            this.gameOverState = 3; // lose
            this.gameOverTimer = now + 2000;
            this.updateUI("Mission: Failed", "system");
            return;
          }

          // Aktive AIs zählen
          let activeAIs = 0;
          let allAIsDefeated = true;

          for (let aiIndex = 1; aiIndex < gameConfig.players.length; aiIndex++) {
            if (gameConfig.players[aiIndex].type === "Open") continue;
            activeAIs++;

            const aiBuildings = this.buildings.filter((b) => b.ownerIndex === aiIndex).length;
            const aiUnits = this.units.filter((u) => u.ownerIndex === aiIndex && !u.isDead).length;
            const aiMcvs = this.units.filter((u) => u.ownerIndex === aiIndex && u.typeKey === "mcv" && !u.isDead).length;

            let aiLost = false;
            if (gameConfig.shortGame) {
              // Short Game: 0 Gebäude UND 0 MCVs
              if (aiBuildings === 0 && aiMcvs === 0) aiLost = true;
            } else {
              // Normal: 0 Gebäude UND 0 Einheiten
              if (aiBuildings === 0 && aiUnits === 0) aiLost = true;
            }

            if (!aiLost) {
              allAIsDefeated = false;
            }
          }

          // Human gewonnen?
          if (activeAIs > 0 && allAIsDefeated) {
            this.gameOverState = 2; // win
            this.gameOverTimer = now + 2000;
            this.updateUI("Mission: Accomplished", "system");
          }
        }

        // Finde nächstgelegenen Feind für AI-Player (Einheit oder Gebäude)
        findNearestEnemyForAI(aiIndex) {
          const aiPlayer = gameConfig.players[aiIndex];
          const aiTeamId = aiPlayer.team_id;
          let nearest = null;
          let nearestDist = Infinity;

          // Prüfe feindliche Einheiten
          for (const unit of this.units) {
            if (unit.isDead || unit.bruchfest <= 0) continue;
            if (unit.ownerIndex === aiIndex) continue;
            if (unit.ownerData?.team_id && unit.ownerData.team_id === aiTeamId) continue;

            const dist = Math.hypot(unit.x - (this.units.find((u) => u.ownerIndex === aiIndex && !u.isDead)?.x || 0), unit.y - (this.units.find((u) => u.ownerIndex === aiIndex && !u.isDead)?.y || 0));
            if (dist < nearestDist) {
              nearestDist = dist;
              nearest = unit;
            }
          }

          // Prüfe feindliche Gebäude
          for (const building of this.buildings) {
            if (building.isDead || building.bruchfest <= 0) continue;
            if (building.ownerIndex === aiIndex) continue;
            if (building.ownerData?.team_id && building.ownerData.team_id === aiTeamId) continue;

            const center = getBuildingCenter(building);
            const dist = Math.hypot(center.x - (this.units.find((u) => u.ownerIndex === aiIndex && !u.isDead)?.x || 0), center.y - (this.units.find((u) => u.ownerIndex === aiIndex && !u.isDead)?.y || 0));
            if (dist < nearestDist) {
              nearestDist = dist;
              nearest = building;
            }
          }

          return nearest;
        }

        // Berechnet die Patrouillen-Sammelpunkte für Defense-Trupps (Trupp 0 & 1) VOR der AI-Basis.
        // axis "x": horizontale Patrouillenlinie – Y liegt 3 Kacheln außerhalb des jeweils nächsten
        //           eigenen Gebäudes Richtung Spielfeldmitte, Anker über X-Koordinaten.
        // axis "y": vertikale Patrouillenlinie – gleiche Logik für X/Y gespiegelt.
        // Liefert [Sammelpunkt1, Sammelpunkt2 (Mittelpunkt), Sammelpunkt3] in Pixeln oder null,
        // wenn noch keine eigenen Hauptgebäude existieren.
        computeDefensePatrolPoints(aiIndex, axis) {
          const mainBuildingBaseIds = ["constructionyard", "powerplant", "barracks", "refinery", "warfactory", "radar", "helipad"];
          const myBuildings = this.buildings.filter((b) => b.ownerIndex === aiIndex && !b.isDead && b.bruchfest > 0 && mainBuildingBaseIds.includes(getBaseTypeId(b.name)));
          if (myBuildings.length === 0) return null;

          const mapCenterX = this.canvas.width / 2;
          const mapCenterY = this.canvas.height / 2;

          // Basiszentrum als Mittelwert aller eigenen Gebäudemitte-Punkte
          let baseCX = 0;
          let baseCY = 0;
          for (const b of myBuildings) {
            const c = getBuildingCenter(b);
            baseCX += c.x;
            baseCY += c.y;
          }
          baseCX /= myBuildings.length;
          baseCY /= myBuildings.length;

          // Richtung von der Basis zur Spielfeldmitte (pro Achse)
          const dirX = mapCenterX >= baseCX ? 1 : -1;
          const dirY = mapCenterY >= baseCY ? 1 : -1;

          // Patrouillenlinie: 3 Kacheln außerhalb des jeweils nächsten eigenen Gebäudes Richtung Spielfeldmitte
          let fixedTile;
          if (axis === "x") {
            if (dirY > 0) {
              // Basis oberhalb der Mitte → Linie unterhalb der Gebäude
              let maxBottom = -Infinity;
              for (const b of myBuildings) {
                const g = getBuildingGridRect(b);
                maxBottom = Math.max(maxBottom, g.tileY + g.heightTiles - 1);
              }
              fixedTile = maxBottom + 3;
            } else {
              // Basis unterhalb der Mitte → Linie oberhalb der Gebäude
              let minTop = Infinity;
              for (const b of myBuildings) {
                const g = getBuildingGridRect(b);
                minTop = Math.min(minTop, g.tileY);
              }
              fixedTile = minTop - 3;
            }
          } else {
            if (dirX > 0) {
              // Basis links der Mitte → Linie rechts der Gebäude
              let maxRight = -Infinity;
              for (const b of myBuildings) {
                const g = getBuildingGridRect(b);
                maxRight = Math.max(maxRight, g.tileX + g.widthTiles - 1);
              }
              fixedTile = maxRight + 3;
            } else {
              // Basis rechts der Mitte → Linie links der Gebäude
              let minLeft = Infinity;
              for (const b of myBuildings) {
                const g = getBuildingGridRect(b);
                minLeft = Math.min(minLeft, g.tileX);
              }
              fixedTile = minLeft - 3;
            }
          }

          // Patrouillenlinie auf Spielfeldgrenzen clampen
          if (axis === "x") {
            fixedTile = Math.max(0, Math.min(this.rows - 1, fixedTile));
          } else {
            fixedTile = Math.max(0, Math.min(this.cols - 1, fixedTile));
          }

          // Anker 1: eigenes Gebäude, das am weitesten in die Spielfeldmitte reicht (Projektion auf Richtung)
          const dirVecX = mapCenterX - baseCX;
          const dirVecY = mapCenterY - baseCY;
          const dirLen = Math.hypot(dirVecX, dirVecY) || 1;

          let anchorA = myBuildings[0];
          let bestProj = -Infinity;
          for (const b of myBuildings) {
            const c = getBuildingCenter(b);
            const proj = ((c.x - baseCX) * dirVecX + (c.y - baseCY) * dirVecY) / dirLen;
            if (proj > bestProj) {
              bestProj = proj;
              anchorA = b;
            }
          }

          // Anker 3: eigenes Gebäude, das am dichtesten an einem Spielfeldrand liegt
          let anchorB = myBuildings[0];
          let bestEdgeDist = Infinity;
          for (const b of myBuildings) {
            const g = getBuildingGridRect(b);
            const rectX = g.tileX * TILE_SIZE;
            const rectY = g.tileY * TILE_SIZE;
            const rectW = g.widthTiles * TILE_SIZE;
            const rectH = g.heightTiles * TILE_SIZE;
            const edgeDist = Math.min(rectX, rectY, this.canvas.width - (rectX + rectW), this.canvas.height - (rectY + rectH));
            if (edgeDist < bestEdgeDist) {
              bestEdgeDist = edgeDist;
              anchorB = b;
            }
          }

          // Anker auf der Patrouillenlinie zu Sammelpunkten konvertieren (Pixel)
          const toPoint = (building) => {
            const c = getBuildingCenter(building);
            if (axis === "x") return { x: c.x, y: fixedTile * TILE_SIZE + TILE_SIZE / 2 };
            return { x: fixedTile * TILE_SIZE + TILE_SIZE / 2, y: c.y };
          };

          const p1 = toPoint(anchorA);
          const p3 = toPoint(anchorB);
          const p2 = { x: (p1.x + p3.x) / 2, y: (p1.y + p3.y) / 2 }; // Sammelpunkt 2 auf halbem Weg zwischen 1 und 3

          return [p1, p2, p3];
        }

        // Finde Verteidigungsposition am äußeren Rand der AI-Basis (wie Pillbox-Platzierung)
        findDefensePositionForAI(aiIndex) {
          const aiPlayer = gameConfig.players[aiIndex];
          const mainBuildingBaseIds = ["constructionyard", "powerplant", "barracks", "refinery", "warfactory", "radar", "helipad"];
          const myMainBuildings = this.buildings.filter((b) => {
            if (b.ownerIndex !== aiIndex) return false;
            return mainBuildingBaseIds.includes(getBaseTypeId(b.name));
          });

          if (myMainBuildings.length === 0) return null;

          // Finde das Gebäude am weitesten vom Zentrum entfernt (äußerer Rand)
          const mapCenterX = this.canvas.width / 2;
          const mapCenterY = this.canvas.height / 2;

          let furthestBuilding = null;
          let furthestDist = 0;

          for (const b of myMainBuildings) {
            const center = getBuildingCenter(b);
            const dist = Math.hypot(center.x - mapCenterX, center.y - mapCenterY);
            if (dist > furthestDist) {
              furthestDist = dist;
              furthestBuilding = b;
            }
          }

          if (!furthestBuilding) return null;

          // Finde freie Position außerhalb dieses Gebäudes
          const grid = getBuildingGridRect(furthestBuilding);
          const centerX = grid.tileX + grid.widthTiles / 2;
          const centerY = grid.tileY + grid.heightTiles / 2;

          // Suche im Radius außerhalb des Gebäudes
          for (let radius = 2; radius <= 6; radius++) {
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 6) {
              const tx = Math.floor(centerX + Math.cos(angle) * radius);
              const ty = Math.floor(centerY + Math.sin(angle) * radius);

              if (tx < 0 || ty < 0 || tx >= this.cols || ty >= this.rows) continue;
              if (this.isTileBlockedByBuildingBody(tx, ty)) continue;

              const isOccupied = this.units.some((u) => {
                if (u.isDead) return false;
                const uGrid = Pathfinder.getGridPos(u.x, u.y);
                return uGrid.x === tx && uGrid.y === ty;
              });

              if (!isOccupied) {
                return {
                  x: tx * TILE_SIZE + TILE_SIZE / 2,
                  y: ty * TILE_SIZE + TILE_SIZE / 2,
                };
              }
            }
          }

          return null;
        }

        // Update aller Trupps für alle AI-Spieler
        updateAllTroops() {
          const now = Date.now();
          for (let aiIndex = 1; aiIndex < gameConfig.players.length; aiIndex++) {
            const aiState = this.npcAiState[aiIndex];
            if (!aiState || !aiState.troops) continue;
            if (gameConfig.players[aiIndex].type === "Open") continue;

            // Prüfe ob Verteidigungstrupps angreifen sollen (wenn eigene Einheit angegriffen wird)
            this.checkDefenseTroopEngagement(aiIndex);

            // Prüfe ob Angriffstrupps angreifen sollen
            this.checkOffenseTroopEngagement(aiIndex);

            // Update jeden Trupp
            aiState.troops.forEach((troop) => {
              troop.update(this, now);
            });
          }
        }

        // Prüfe ob Verteidigungstrupps (0 & 1) einen Angreifer bekämpfen sollen
        checkDefenseTroopEngagement(aiIndex) {
          const aiState = this.npcAiState[aiIndex];
          if (!aiState || !aiState.troops) return;

          // Finde alle angegriffenen eigenen Einheiten
          const attackedUnits = this.units.filter((u) => {
            if (u.ownerIndex !== aiIndex) return false;
            if (u.isDead || u.bruchfest <= 0) return false;
            if (u.currentTarget && u.currentTarget.ownerIndex !== aiIndex) return true;
            return false;
          });

          if (attackedUnits.length === 0) return;

          // Finde nächstgelegenen Verteidigungstrupp zum Angriffspunkt
          const defenseTroops = aiState.troops.filter((t) => t.type === "defense" && t.isAlive && !t.isDefending);
          if (defenseTroops.length === 0) return;

          // Verwende die Position der ersten angegriffenen Einheit als Referenz
          const attackPoint = attackedUnits[0];
          let nearestTroop = null;
          let nearestDist = Infinity;

          defenseTroops.forEach((troop) => {
            const dist = troop.distanceTo(attackPoint.x, attackPoint.y);
            if (dist < nearestDist) {
              nearestDist = dist;
              nearestTroop = troop;
            }
          });

          if (nearestTroop) {
            // Finde den Angreifer
            const attacker = attackPoint.currentTarget;
            if (attacker) {
              nearestTroop.isDefending = true;
              nearestTroop.targetEnemy = attacker;
            }
          }
        }

        // Prüfe ob Angriffstrupps (2-5) angreifen sollen
        checkOffenseTroopEngagement(aiIndex) {
          const aiState = this.npcAiState[aiIndex];
          if (!aiState || !aiState.troops) return;

          // Trupps 2 & 3: Wenn beide voll, greifen an
          const troop2 = aiState.troops[2];
          const troop3 = aiState.troops[3];
          if (troop2 && troop3 && troop2.isFull && troop3.isFull && !troop2.isAttacking && !troop3.isAttacking) {
            const target = this.findNearestEnemyForAI(aiIndex);
            if (target) {
              troop2.isAttacking = true;
              troop2.targetEnemy = target;
              troop3.isAttacking = true;
              troop3.targetEnemy = target;
            }
          }

          // Trupps 4 & 5: Wenn beide voll, greifen an
          const troop4 = aiState.troops[4];
          const troop5 = aiState.troops[5];
          if (troop4 && troop5 && troop4.isFull && troop5.isFull && !troop4.isAttacking && !troop5.isAttacking) {
            const target = this.findNearestEnemyForAI(aiIndex);
            if (target) {
              troop4.isAttacking = true;
              troop4.targetEnemy = target;
              troop5.isAttacking = true;
              troop5.targetEnemy = target;
            }
          }
        }

        checkAIDefeat() {
          for (let aiIndex = 1; aiIndex < gameConfig.players.length; aiIndex++) {
            if (gameConfig.players[aiIndex].type === "Open") continue;
            const aiState = this.npcAiState[aiIndex];
            if (!aiState) continue;
            if (aiState.defeated) continue;
            if (!aiState.showDefeatMessage) continue;

            // Ausgabe erfolgt hier, State 0 setzt showDefeatMessage = true
            this.updateUI(`AI Player ${aiIndex} was defeated`);
            aiState.defeated = true;
          }
        }

        draw() {
          this.ctx.fillStyle = "#2b3a2b";
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

          // OPTISCHER REPARATUR-EFFEKT
          this.ctx.font = "bold 12px Arial";
          this.ctx.textAlign = "center";
          this.repairEffects.forEach((e) => {
            this.ctx.fillStyle = `rgba(0, 255, 0, ${e.life / 60})`;
            this.ctx.fillText(e.text, e.x, e.y - (60 - e.life));
          });
          this.ctx.textAlign = "start";

          this.ctx.strokeStyle = COLORS.grid;
          this.ctx.lineWidth = 1;
          for (let x = 0; x < this.canvas.width; x += TILE_SIZE) {
            this.ctx.beginPath();
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, this.canvas.height);
            this.ctx.stroke();
          }
          for (let y = 0; y < this.canvas.height; y += TILE_SIZE) {
            this.ctx.beginPath();
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(this.canvas.width, y);
            this.ctx.stroke();
          }

          this.clickMarkers.forEach((m) => {
            this.ctx.strokeStyle = `rgba(0, 255, 0, ${m.life / 15})`;
            this.ctx.lineWidth = 2;
            const s = 10 * WORLD_SCALE;
            this.ctx.beginPath();
            this.ctx.moveTo(m.x - s, m.y);
            this.ctx.lineTo(m.x + s, m.y);
            this.ctx.moveTo(m.x, m.y - s);
            this.ctx.lineTo(m.x, m.y + s);
            this.ctx.stroke();
          });

          this.buildings.forEach((b) => {
            const rect = getBuildingPixelRect(b);
            const body = getBuildingBodyPixelRect(b);

            this.ctx.fillStyle = "rgba(0,0,0,0.4)";
            this.ctx.fillRect(rect.x + 3 * WORLD_SCALE, rect.y + 3 * WORLD_SCALE, rect.width, rect.height);

            if (body.bibHeight > 0) {
              this.ctx.fillStyle = "#8d9499";
              this.ctx.fillRect(rect.x, body.bibY, rect.width, body.bibHeight);
              this.ctx.fillStyle = "rgba(255,255,255,0.25)";
              this.ctx.fillRect(rect.x, body.bibY, rect.width, 2 * WORLD_SCALE);
              this.ctx.strokeStyle = "rgba(0,0,0,0.25)";
              this.ctx.lineWidth = 1;
              for (let gx = rect.x + TILE_SIZE; gx < rect.x + rect.width; gx += TILE_SIZE) {
                this.ctx.beginPath();
                this.ctx.moveTo(gx, body.bibY + 1);
                this.ctx.lineTo(gx, body.bibY + body.bibHeight - 1);
                this.ctx.stroke();
              }
            }

            if (body.height > 0) {
              const cx = body.x + body.width / 2;
              const cy = body.y + body.height / 2;
              const rx = Math.max(6 * WORLD_SCALE, body.width * 0.42);
              const ry = Math.max(6 * WORLD_SCALE, body.height * 0.4);
              const healthRatio = Math.max(0, b.bruchfest / (b.maxBruchfest || b.bruchfest));

              this.ctx.fillStyle = "#8d9499";
              this.ctx.fillRect(body.x, body.y, body.width, body.height);

              this.ctx.fillStyle = "#898980";
              this.ctx.beginPath();
              this.ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
              this.ctx.fill();

              this.ctx.strokeStyle = "#444444";
              this.ctx.lineWidth = 2;
              this.ctx.beginPath();
              this.ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
              this.ctx.stroke();

              this.ctx.strokeStyle = b.color || "#9e3a3a";
              this.ctx.globalAlpha = healthRatio;
              this.ctx.beginPath();
              this.ctx.ellipse(cx, cy, rx, ry, 0, -Math.PI / 2, -Math.PI / 2 + healthRatio * 2 * Math.PI);
              this.ctx.stroke();
              this.ctx.globalAlpha = 1.0;

              const activeRepair = this.activeRepairs.find((r) => r.building === b);
              if (activeRepair) {
                const blinkState = activeRepair.blinkState;
                const showBlink = blinkState === 0 || blinkState === 2 || blinkState === 4;
                if (showBlink) {
                  const startAngle = -Math.PI / 2 + healthRatio * 2 * Math.PI;
                  const endAngle = startAngle + (activeRepair.healthStep / (b.maxBruchfest || b.bruchfest)) * 2 * Math.PI;
                  this.ctx.strokeStyle = b.color || "#9e3a3a";
                  this.ctx.lineWidth = 3;
                  this.ctx.globalAlpha = 0.8;
                  this.ctx.beginPath();
                  this.ctx.ellipse(cx, cy, rx, ry, 0, startAngle, endAngle);
                  this.ctx.stroke();
                  this.ctx.globalAlpha = 1.0;
                }
              }

              if (getBaseTypeId(b.name) === "helipad") {
                const fontSize = Math.max(28, Math.round(32 * WORLD_SCALE));
                this.ctx.fillStyle = "#000";
                this.ctx.font = `italic ${fontSize}px Arial`;
                this.ctx.textAlign = "center";
                this.ctx.textBaseline = "middle";
                this.ctx.lineWidth = 0.5;
                this.ctx.fillText("H", cx, cy);
              } else {
                const label = getBaseTypeId(b.name) === "pillbox" ? "P" : getBuildingDisplayName(b.name);
                const lines = splitLabelTwoLines(label);
                const fontSize = Math.max(9, Math.round(11 * WORLD_SCALE));
                this.ctx.fillStyle = "#000";
                this.ctx.font = `${fontSize}px Arial`;
                this.ctx.textAlign = "center";
                this.ctx.textBaseline = "middle";
                if (lines.length > 1) {
                  this.ctx.fillText(lines[0], cx, cy - fontSize * 0.45);
                  this.ctx.fillText(lines[1], cx, cy + fontSize * 0.55);
                } else {
                  this.ctx.fillText(lines[0], cx, cy);
                }
              }
              this.ctx.textAlign = "start";
              this.ctx.textBaseline = "alphabetic";
            }

            this.ctx.globalAlpha = Math.max(0, b.bruchfest / (b.maxBruchfest || b.bruchfest));
            this.ctx.strokeStyle = b.color || "#9e3a3a";
            this.ctx.lineWidth = 1;
            this.ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);
            this.ctx.globalAlpha = 1.0;

            if (getBaseTypeId(b.name) === "silo" && b === this.selectedBuilding) {
              const playerAccount = this.getAccount(0);
              const fillRatio = playerAccount.harvestLimit > 0 ? playerAccount.harvest / playerAccount.harvestLimit : 0;
              const boxes = 5,
                boxSize = 2,
                gap = 1;
              const totalW = boxes * boxSize + (boxes - 1) * gap;
              const siloRect = getBuildingPixelRect(b);
              const startBX = siloRect.x + siloRect.width / 2 - totalW / 2;
              const bY = siloRect.y + siloRect.height - 4;
              const filled = Math.min(boxes, Math.floor(fillRatio * boxes + 0.0001));
              for (let si = 0; si < boxes; si++) {
                const bx = startBX + si * (boxSize + gap);
                this.ctx.fillStyle = si < filled ? "#00ff44" : "#1a2a1a";
                this.ctx.fillRect(bx, bY, boxSize, boxSize);
                if (si < boxes - 1) {
                  this.ctx.fillStyle = "#0b0b0b";
                  this.ctx.fillRect(bx + boxSize, bY, 1, boxSize);
                }
              }
            }
          });

          this.ctx.lineWidth = 2;
          this.ctx.setLineDash([6, 4]);
          this.units.forEach((u) => {
            // Helikopter zeigen Ziellinie NUR im 1s-Fenster nach einer abgefeuerten Rakete (sonst nie)
            if (u.type === "aircraft" && u.currentTarget && !u.isDead && !u.currentTarget.isDead && u.currentTarget.bruchfest > 0) {
              const timeSinceShot = Date.now() - (u.lastMissileShotTime || 0);
              if (timeSinceShot < 1000) {
                this.ctx.strokeStyle = u.playerColor || "#ff3333";
                this.ctx.beginPath();
                this.ctx.moveTo(u.x, u.y);
                this.ctx.lineTo(u.currentTarget.x, u.currentTarget.y);
                this.ctx.stroke();
              }
            }
            // Andere Einheiten
            else if (u.currentTarget && !u.isDead && u.targetX === null && u.targetY === null && !u.isDocked && !u.currentTarget.isDead && u.currentTarget.bruchfest > 0 && Math.hypot(u.x - u.currentTarget.x, u.y - u.currentTarget.y) <= u.weite * TILE_SIZE) {
              this.ctx.strokeStyle = u.playerColor || "#ff3333";
              this.ctx.beginPath();
              this.ctx.moveTo(u.x, u.y);
              this.ctx.lineTo(u.currentTarget.x, u.currentTarget.y);
              this.ctx.stroke();
            }
          });
          this.buildings.forEach((b) => {
            if (b.currentTarget && !b.isDead && b.bruchfest > 0) {
              this.ctx.strokeStyle = b.color || "#ff3333";
              const center = getBuildingCenter(b);
              const targetCenter = b.currentTarget.x !== undefined ? { x: b.currentTarget.x, y: b.currentTarget.y } : getBuildingCenter(b.currentTarget);
              this.ctx.beginPath();
              this.ctx.moveTo(center.x, center.y);
              this.ctx.lineTo(targetCenter.x, targetCenter.y);
              this.ctx.stroke();
            }
          });

          // SAM-Raketen: gestrichelte Linie von der SAM zur Raketenposition (sichtbar während des 2s-Flugs)
          for (let i = this.samMissiles.length - 1; i >= 0; i--) {
            const m = this.samMissiles[i];
            if (!m || !m.sourceBuilding || !isFinite(m.x) || !isFinite(m.y)) continue;
            const center = getBuildingCenter(m.sourceBuilding);
            if (!center || !isFinite(center.x) || !isFinite(center.y)) continue;
            this.ctx.strokeStyle = m.sourceBuilding.color || "#ff3333";
            this.ctx.beginPath();
            this.ctx.moveTo(center.x, center.y);
            this.ctx.lineTo(m.x, m.y);
            this.ctx.stroke();
          }

          this.ctx.setLineDash([]);

          this.computeInfantryDisplayPositions();
          // Helikopter zuletzt zeichnen (fliegen über alles)
          // Sortierung: parking Helis zuerst, dann taking_off, dann cruising, dann landing
          const phaseOrder = { parking: 0, taking_off: 1, cruising: 2, landing: 3 };
          const sortedUnits = [...this.units].sort((a, b) => {
            if (a.type === "aircraft" && b.type === "aircraft") {
              return (phaseOrder[a.flightPhase] ?? 0) - (phaseOrder[b.flightPhase] ?? 0);
            }
            if (a.type === "aircraft") return 1;
            if (b.type === "aircraft") return -1;
            return 0;
          });
          sortedUnits.forEach((u) => u.draw(this.ctx));

          // Selection Box
          const box = this.input.getSelectionBox();
          if (box) {
            this.ctx.strokeStyle = "#00ff00";
            this.ctx.lineWidth = 1;
            this.ctx.strokeRect(box.x, box.y, box.w, box.h);
            this.ctx.fillStyle = "rgba(0, 255, 0, 0.1)";
            this.ctx.fillRect(box.x, box.y, box.w, box.h);
          }

          // Placement Ghost
          if (this.placementMode && this.buildingToPlace) {
            const mx = this.input.mouseX;
            const my = this.input.mouseY;
            const placement = this.getPlacementAt(mx, my, this.buildingToPlace);
            const placementFree = this.isPlacementFree(placement, { buildingType: this.buildingToPlace, ownerIndex: 0 }).free;

            for (let ty = 0; ty < placement.heightTiles; ty++) {
              for (let tx = 0; tx < placement.widthTiles; tx++) {
                const px = (placement.tileX + tx) * TILE_SIZE;
                const py = (placement.tileY + ty) * TILE_SIZE;
                this.ctx.strokeStyle = placementFree ? "#00ff00" : "#ff3333";
                this.ctx.lineWidth = 2 * WORLD_SCALE;
                this.ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                this.ctx.fillStyle = placementFree ? "rgba(0, 255, 0, 0.14)" : "rgba(255, 0, 0, 0.14)";
                this.ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
              }
            }
          }
        }
      }

      // --- INPUT MANAGER ---
      class InputManager {
        constructor(canvas) {
          this.canvas = canvas;
          this.mouseX = 0;
          this.mouseY = 0;
          this.isLeftMouseDown = false;

          this.selectionStart = { x: 0, y: 0 };
          this.currentSelectionEnd = { x: 0, y: 0 };
          this.isDraggingBox = false;

          this.setupListeners();
        }

        setupListeners() {
          window.addEventListener("resize", () => game.resize());

          this.canvas.addEventListener("mousemove", (e) => {
            const rect = this.canvas.getBoundingClientRect();
            this.mouseX = e.clientX - rect.left;
            this.mouseY = e.clientY - rect.top;

            if (this.isDraggingBox) {
              this.currentSelectionEnd = { x: this.mouseX, y: this.mouseY };
            }

            // Update Angriffscursor bei jeder Maus-Bewegung
            if (game && typeof game.updateAttackCursor === "function") {
              game.updateAttackCursor();
            }
          });

          this.canvas.addEventListener("mousedown", (e) => {
            if (e.button === 0) {
              // Linksklick
              if (game.placementMode) {
                // In placement mode we wait for mouseup to decide place/cancel
                return;
              }

              if (game.sellMode) {
                // sell is handled on mouseup / handleLeftClickUp
              }

              this.isLeftMouseDown = true;
              this.selectionStart = { x: this.mouseX, y: this.mouseY };
              this.currentSelectionEnd = { x: this.mouseX, y: this.mouseY };
              this.isDraggingBox = true;
            } else if (e.button === 2) {
              // Rechtsklick
              e.preventDefault();
              game.handleRightClick(this.mouseX, this.mouseY);
            }
          });

          this.canvas.addEventListener("mouseup", (e) => {
            if (e.button === 0) {
              this.isLeftMouseDown = false;

              if (game.placementMode && game.buildingToPlace) {
                const placement = game.getPlacementAt(this.mouseX, this.mouseY, game.buildingToPlace);
                const canBuild = game.isPlacementFree(placement, { buildingType: game.buildingToPlace, ownerIndex: 0 });
                const state = game.getBuildingProductionState(game.buildingToPlace.id);
                const isWall = game.buildingToPlace && getBaseTypeId(game.buildingToPlace.id) === "wall";

                if (canBuild.free && state.status === "ready") {
                  if (isWall) {
                    if (game.canAfford(game.buildingToPlace.cost)) {
                      game.spendCredits(game.buildingToPlace.cost);
                      game.buildStructure(placement);
                      game.updateUI("Mauer platziert. Nächstes Stück bereit.");
                      return;
                    } else {
                      game.updateUI("Nicht genug Credits für weitere Mauern.");
                      game.cancelPlacement(false);
                    }
                  } else {
                    game.buildStructure(placement);
                    game.consumeReadyBuilding(game.buildingToPlace.id);
                    game.cancelPlacement(false);
                    game.initSidebar();
                  }
                } else {
                  // <-- jetzt korrekt eingerückt
                  if (canBuild.reason === "distance_too_far") {
                    game.updateUI("Zu weit vom nächsten Gebäude entfernt.");
                  } else {
                    game.updateUI(canBuild.free ? "Nicht bereit." : "Baufeld blockiert.");
                  }
                  game.cancelPlacement(false);
                }
                return;
              }

              if (this.isDraggingBox) {
                const dist = Math.hypot(this.mouseX - this.selectionStart.x, this.mouseY - this.selectionStart.y);
                if (dist < 5 * WORLD_SCALE) {
                  game.handleLeftClickUp(this.mouseX, this.mouseY);
                } else {
                  game.handleBoxSelection(this.selectionStart, this.currentSelectionEnd);
                }
              }
              this.isDraggingBox = false;
            }
          });

          this.canvas.addEventListener("contextmenu", (e) => e.preventDefault());

          // ESC zum Pause-Menü
          window.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && game) {
              if (game.paused) {
                game.togglePause();
              } else if (!document.getElementById("config-overlay").classList.contains("hidden")) {
                // Config-Modal ist offen, nichts tun
              } else {
                game.togglePause();
              }
            }
          });

          // --- TOUCH SUPPORT ---
          const getTouchPos = (touch) => {
            const rect = this.canvas.getBoundingClientRect();
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
          };

          const handleLeftUp = (x, y) => {
            this.isLeftMouseDown = false;
            if (game.placementMode && game.buildingToPlace) {
              const placement = game.getPlacementAt(x, y, game.buildingToPlace);
              const canBuild = game.isPlacementFree(placement, { buildingType: game.buildingToPlace, ownerIndex: 0 });
              const state = game.getBuildingProductionState(game.buildingToPlace.id);
              if (canBuild.free && state.status === "ready") {
                game.buildStructure(placement);
                game.consumeReadyBuilding(game.buildingToPlace.id);
                game.cancelPlacement(false);
                game.initSidebar();
              } else {
                game.updateUI(canBuild.reason === "distance_too_far" ? "Zu weit vom nächsten Gebäude entfernt." : canBuild.free ? "Nicht bereit." : "Baufeld blockiert.");
                game.cancelPlacement(true);
              }
              return;
            }
            if (this.isDraggingBox) {
              const dist = Math.hypot(x - this.selectionStart.x, y - this.selectionStart.y);
              if (dist < 5 * WORLD_SCALE) {
                game.handleLeftClickUp(x, y);
              } else {
                game.handleBoxSelection(this.selectionStart, { x, y });
              }
            }
            this.isDraggingBox = false;
          };

          this.canvas.addEventListener(
            "touchstart",
            (e) => {
              e.preventDefault();
              const pos = getTouchPos(e.touches[0]);
              this.mouseX = pos.x;
              this.mouseY = pos.y;
              if (game.placementMode) return; // Wait for touchend
              this.isLeftMouseDown = true;
              this.selectionStart = { x: pos.x, y: pos.y };
              this.currentSelectionEnd = { x: pos.x, y: pos.y };
              this.isDraggingBox = true;
            },
            { passive: false },
          );

          this.canvas.addEventListener(
            "touchmove",
            (e) => {
              e.preventDefault();
              const pos = getTouchPos(e.touches[0]);
              this.mouseX = pos.x;
              this.mouseY = pos.y;
              if (this.isDraggingBox) this.currentSelectionEnd = { x: pos.x, y: pos.y };
            },
            { passive: false },
          );

          this.canvas.addEventListener(
            "touchend",
            (e) => {
              e.preventDefault();
              const pos = getTouchPos(e.changedTouches[0]);
              this.mouseX = pos.x;
              this.mouseY = pos.y;
              handleLeftUp(pos.x, pos.y);
            },
            { passive: false },
          );
        }

        getSelectionBox() {
          if (!this.isDraggingBox) return null;
          const x = Math.min(this.selectionStart.x, this.currentSelectionEnd.x);
          const y = Math.min(this.selectionStart.y, this.currentSelectionEnd.y);
          const w = Math.abs(this.currentSelectionEnd.x - this.selectionStart.x);
          const h = Math.abs(this.currentSelectionEnd.y - this.selectionStart.y);
          return { x, y, w, h };
        }
      }

      // Start
      // === CONFIG SYSTEM ===
      // Zentrale Konstante für AI-Gebäudeverkauf
      const AI_SELL_ORDER = ["silo", "helipad", "radar", "pillbox", "barracks", "warfactory", "powerplant", "refinery"];

      // Debug-Flags (zukunftssicher erweiterbar)
      const db = {

      };

      // Configuration data
      let gameConfig = {
        players: [
          { name: "Commander", color: "green", spawn: "A", type: "human", fraction: 0, team: "-" },
          { name: "AI 1", color: "red", spawn: "C", type: "Naval-AI", fraction: 0, team: "-" },

      // Color mapping for game rendering

      let game = null; // Game object initialized after config

      // Helper: Get all used colors
      function getUsedColors() {
        return gameConfig.players.map((p) => p.color);
      }

      // Helper: Get all used spawns
      function getUsedSpawns() {
        return gameConfig.players.map((p) => p.spawn);
      }

      // Helper: Get all available colors
      function getAvailableColors() {
        const allColors = ["red", "blue", "yellow", "green", "orange", "brown", "magenta", "black"];
        const used = getUsedColors();
        return allColors.filter((c) => !used.includes(c));
      }

      // Helper: Get all available spawns
      function getAvailableSpawns() {
        const allSpawns = ["A", "B", "C", "D"];
        const used = getUsedSpawns();
        return allSpawns.filter((s) => !used.includes(s));
      }

      // Get random element from array
      const FRACTION_LABELS = {
        1: "Ukraine",
        2: "Russia",
        3: "US",
        4: "Iran",
      }; // Fraction codes: 1=Ukraine, 2=Russia, 3=US, 4=Iran

      function getRandomElement(arr) {
        if (!arr || arr.length === 0) return null;
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function getRandomFraction() {
        return getRandomElement([1, 2, 3, 4]);
      }

      function getFractionLabel(id) {
        return FRACTION_LABELS[id] || "Random";
      }

      function getBaseTypeId(typeId) {
        if (!typeId || typeof typeId !== "string") return typeId;
        const parts = typeId.split("_");
        const last = parts[parts.length - 1];
        if (/^[1-4]$/.test(last) && parts.length > 1) {
          return parts.slice(0, -1).join("_");
        }
        return typeId;
      }

        elems.ai3Spawn.value = gameConfig.players[3].spawn;
        elems.ai3Fraction.value = gameConfig.players[3].fraction || 0;
        document.getElementById("config-ai3-team").value = gameConfig.players[3].team || "-";
        elems.shortGame.checked = gameConfig.shortGame;
        elems.limitedBuild.checked = gameConfig.limitedBuild;
        elems.startingCash.value = gameConfig.startingCash;
        elems.gameSpeed.value = gameConfig.gameSpeed;

        // Color change handler with conflict resolution
        function onColorChange(playerIdx, newColor) {
          gameConfig.players[playerIdx].color = newColor;

          // Check if another player has same color
          for (let i = 0; i < gameConfig.players.length; i++) {
            if (i !== playerIdx && gameConfig.players[i].color === newColor) {
              const available = getAvailableColors();
              if (available.length > 0) {
                gameConfig.players[i].color = getRandomElement(available);
                updateColorDropdown(i);
              } else {
                // If no colors available, revert change
                gameConfig.players[playerIdx].color = gameConfig.players[i].color;
                updateColorDropdown(playerIdx);
              }
            }
          }
        }

        // Spawn change handler with conflict resolution
        function onSpawnChange(playerIdx, newSpawn) {
          gameConfig.players[playerIdx].spawn = newSpawn;

          // Check if another player has same spawn
          for (let i = 0; i < gameConfig.players.length; i++) {
            if (i !== playerIdx && gameConfig.players[i].spawn === newSpawn) {
              const available = getAvailableSpawns();
              if (available.length > 0) {
                gameConfig.players[i].spawn = getRandomElement(available);
                updateSpawnDropdown(i);
              } else {
                gameConfig.players[playerIdx].spawn = gameConfig.players[i].spawn;
                updateSpawnDropdown(playerIdx);
              }
            }
          }
        }

        // Update UI dropdowns from config
        function updateColorDropdown(playerIdx) {
          const dropId = playerIdx === 0 ? "config-human-color" : `config-ai${playerIdx}-color`;
          document.getElementById(dropId).value = gameConfig.players[playerIdx].color;
        }

        function updateSpawnDropdown(playerIdx) {
          const dropId = playerIdx === 0 ? "config-human-spawn" : `config-ai${playerIdx}-spawn`;
          document.getElementById(dropId).value = gameConfig.players[playerIdx].spawn;
        }

        // Human player name change
        elems.humanName.addEventListener("change", (e) => {
          gameConfig.players[0].name = e.target.value || "Commander";
        });

        // Human player color change
        elems.humanColor.addEventListener("change", (e) => {
          onColorChange(0, e.target.value);
        });

        // Human player spawn change
        elems.humanSpawn.addEventListener("change", (e) => {
          onSpawnChange(0, e.target.value);
        });

        elems.humanFraction.addEventListener("change", (e) => {
          gameConfig.players[0].fraction = parseInt(e.target.value, 10) || 0;
        });

        // Team-Listener für alle Spieler
        ["human", "ai1", "ai2", "ai3"].forEach((key, idx) => {
          document.getElementById(`config-${key}-team`).addEventListener("change", (e) => {
            gameConfig.players[idx].team = e.target.value;
          });
        });

        // AI 1 type change
        elems.ai1Type.addEventListener("change", (e) => {
          gameConfig.players[1].type = e.target.value;
        });

        // AI 1 color change
        elems.ai1Color.addEventListener("change", (e) => {
          onColorChange(1, e.target.value);
        });

        // AI 1 spawn change
        elems.ai1Spawn.addEventListener("change", (e) => {
          onSpawnChange(1, e.target.value);
        });

        elems.ai1Fraction.addEventListener("change", (e) => {
          gameConfig.players[1].fraction = parseInt(e.target.value, 10) || 0;
        });

        // AI 2 type change
        elems.ai2Type.addEventListener("change", (e) => {
          gameConfig.players[2].type = e.target.value;
        });

        // AI 2 color change
        elems.ai2Color.addEventListener("change", (e) => {
          onColorChange(2, e.target.value);
        });

        // AI 2 spawn change
        elems.ai2Spawn.addEventListener("change", (e) => {
          onSpawnChange(2, e.target.value);
        });

        elems.ai2Fraction.addEventListener("change", (e) => {
          gameConfig.players[2].fraction = parseInt(e.target.value, 10) || 0;
        });

        // AI 3 type change
        elems.ai3Type.addEventListener("change", (e) => {
          gameConfig.players[3].type = e.target.value;
        });

        // AI 3 color change
        elems.ai3Color.addEventListener("change", (e) => {
          onColorChange(3, e.target.value);
        });

        // AI 3 spawn change
        elems.ai3Spawn.addEventListener("change", (e) => {
          onSpawnChange(3, e.target.value);
        });

        elems.ai3Fraction.addEventListener("change", (e) => {
          gameConfig.players[3].fraction = parseInt(e.target.value, 10) || 0;
        });

        // Checkbox changes
        elems.shortGame.addEventListener("change", (e) => {
          gameConfig.shortGame = e.target.checked;
        });

        elems.limitedBuild.addEventListener("change", (e) => {
          gameConfig.limitedBuild = e.target.checked;
        });

        // Cash change
        elems.startingCash.addEventListener("change", (e) => {
          gameConfig.startingCash = parseInt(e.target.value) || 5000;
        });

        // Speed change
        elems.gameSpeed.addEventListener("change", (e) => {
          gameConfig.gameSpeed = parseFloat(e.target.value) || 1;
        });

        // Start button
        elems.startBtn.addEventListener("click", () => {
          startGame();
        });
      }

      // Start game after config
      function startGame() {
        // Resolve random fractions before game start
        const wasRandom = gameConfig.players.map((p) => p.fraction === 0 || p.fraction === "0");
        gameConfig.players.forEach((player) => {
          if (!player.fraction || !FRACTION_LABELS[player.fraction]) {
            player.fraction = getRandomFraction();
          }
        });

        // Initialize team IDs (default to 9+index wenn nicht gewählt, um Kollisionen mit 1-4 zu vermeiden)
        gameConfig.players.forEach((player, index) => {
          let rawTeam = player.team ? parseInt(player.team, 10) : NaN;
          player.team_id = rawTeam >= 1 && rawTeam <= 4 ? rawTeam : 9 + index;
        });

        // Calculate per-player speed/production factors based on config selections
        const aiSpeedMap = { Open: 1, "Rush-AI": 3, "Normal-AI": 2, "Turtle-AI": 1.5, "Naval-AI": 1 };
        gameConfig.players.forEach((player, index) => {
          let rawValue;
          if (index === 0) {
            rawValue = parseFloat(gameConfig.gameSpeed);
          } else {
            const dropdownId = `config-ai${index}-type`;
            const textVal = document.getElementById(dropdownId)?.value || "Open";
            rawValue = aiSpeedMap[textVal] ?? 1;
          }
          player.gameSpeedFactor = isNaN(rawValue) ? 1 : rawValue;
          player.productionFactor = 4 / player.gameSpeedFactor; // Inverse für Produktionsdauer
        });

        // Hide config modal
        document.getElementById("config-overlay").classList.add("hidden");

        // Create game instance with config
        game = new Game();

        // Show resolved random fraction in UI
        if (wasRandom[0]) {
          const fractionName = FRACTION_LABELS[gameConfig.players[0].fraction] || "Unknown";
          game.updateUI(`${gameConfig.players[0].name} is ${fractionName}`);
        }

        // Apply config values
        game.playerColors = gameConfig.players.map((p) => colorMap[p.color] || "#9e3a3a");
        game.units[0].playerColor = game.playerColors[0]; // MCV
      }

      // Initialize config modal on page load
      window.addEventListener("DOMContentLoaded", () => {
        initConfigModal();
      });
    </script>
  </body>
</html>
