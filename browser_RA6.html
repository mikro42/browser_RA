                this._lastDistToTarget = null; // Reset beim State-Wechsel
              }
            }
          }

          if (this.harvesterState === "manual" && this.targetX === null) {
            this.speed = this.harvesterNormalSpeed;
          }
        }

        // Setze Flug-Ziel für Helikopter (direkte Bewegung, kein A*)
        setFlightTarget(x, y) {
          // Neues Flugziel außerhalb eines Heliport-Docks: Docking-Status aufheben
          this.helipadDocked = false;
          this.targetHelipad = null;
          this.targetRepairBay = null;
          this.isDocked = false;
          this._beginFlightTo(x, y, false);
        }

        // Setze Flugziel auf das Dock eines Heliports (1 Heli pro Dock).
        // Das Dock liegt exakt in der Mitte des "H" und ist NICHT am Spielfeldraster orientiert.
        setHelipadDockTarget(helipad) {
          const dock = game.getHelipadDockPoint(helipad);
          this.targetHelipad = helipad;
          this.helipadDocked = false; // wird erst bei erfolgreicher Landung gesetzt
          this._beginFlightTo(dock.x, dock.y, true);
        }

        // Setze Flugziel auf das Dock einer RepairBay (Heli andockt und wird repariert)
        setRepairBayDockTarget(repairBay) {
          const dock = game.getRepairBayDockPoint(repairBay);
          this.targetRepairBay = repairBay;
          this.helipadDocked = false;
          this.targetHelipad = null;
          this._beginFlightTo(dock.x, dock.y, true);
        }

        // Gemeinsame Flugziel-Logik für Helikopter (normale Ziele & Heliport-Docks)
        _beginFlightTo(x, y, isHelipadDock = false) {
          this.targetX = x;
          this.targetY = y;
          this.parking = false;
          this.path = [];
          this.currentPathIndex = 0;
          // Normaler Bewegungsbefehl: Vergiss altes Angriffsziel komplett (inkl. Ziellinie)
          this.attackTarget = null;
          this.isAttackMove = false;
          this.currentTarget = null;
          this.lastMissileShotTime = 0;

          if (!isHelipadDock) {
            // Immer alternativen Landeplatz suchen (vermeidet Stapelung bei Gruppen)
            const altSpot = game.findHelicopterLandingSpot(x, y, this.radius * 2, game.units, game.buildings, this);
            this.assignedLandingSpot = altSpot || { x, y };
          } else {
            // Heliport-Dock: exakte Pixelposition (nicht am Spielfeldraster)
            this.assignedLandingSpot = { x, y };
          }

          // Kreuzflug-Ziel: 1 Kachel nördlich des Landeplatzes
          const landingGrid = Pathfinder.getGridPos(this.assignedLandingSpot.x, this.assignedLandingSpot.y);
          this.cruiseTargetX = landingGrid.x * TILE_SIZE + TILE_SIZE / 2;
          this.cruiseTargetY = (landingGrid.y - 1) * TILE_SIZE + TILE_SIZE / 2;

          // Situation berücksichtigen:
          // - Gelandet (parking): erst Höhe gewinnen (taking_off), dann ausrichten, dann fliegen
          // - Bereits in der Luft: direkt Richtung neues Ziel einschwenken (kein erneuter Abflug)
          if (this.flightPhase === "parking") {
            this.flightPhase = "taking_off";
            this.takeoffStartY = this.y; // Startposition für Abflug speichern
            this.helicopterHeading = 0; // Ostausrichtung für Abflug
          } else {
            this.alignTargetAngle = Math.atan2(this.cruiseTargetY - this.y, this.cruiseTargetX - this.x);
            this.alignForLanding = false;
            this.flightPhase = "aligning";
          }
        }

        // Heliport-Dock: fehlende Raketen nachladen (1 alle 8s, ohne Kosten) + aufsteigender "+1"-Effekt
        updateHelipadDockRefuel() {
          if (!this.isAtHelipadDock) return;

          // Heliport nicht mehr vorhanden (zerstört/verkauft)? → Docking aufheben
          if (!game.buildings.includes(this.targetHelipad)) {
            this.helipadDocked = false;
            this.targetHelipad = null;
            return;
          }

          if (this.missiles >= this.maxMissiles) return;

          const now = Date.now();
          const intervalMs = 8000 / (this.ownerData?.gameSpeedFactor || 1);
          if (!this.lastRefuelTime || now - this.lastRefuelTime >= intervalMs) {
            this.lastRefuelTime = now;
            this.missiles++;
            // Aufsteigender "+1"-Effekt wie bei der Reparatur in der RepairBay
            game.repairEffects.push({ x: this.x, y: this.y - 20, life: 60, text: "+1" });
          }
        }

        combatUpdate(units, buildings) {
          const now = Date.now();
          const rangePx = this.weite * TILE_SIZE;

          // Projektile immer zuerst verarbeiten (auch bei Attack-Move!)
          for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            if (now - proj.firedAt >= proj.travelTime) {
              this.applyDamage(proj.target, proj.damage, proj.spread, units, buildings);
              this.projectiles.splice(i, 1);
            }
          }

          // Attack-Move: Priorisiere spezifisches Angriffsziel (absolute Priorität!)
          if (this.isAttackMove && this.attackTarget) {
            if (this.attackTarget.isDead || this.attackTarget.bruchfest <= 0) {
              // Ziel vernichtet - vergiss es (goto 1 "Wache stehen")
              this.attackTarget = null;
              this.isAttackMove = false;
              // Fällt durch zur normalen Ziel-Suche
            } else {
              const dist = Math.hypot(this.x - this.attackTarget.x, this.y - this.attackTarget.y);
              if (dist <= rangePx) {
                this.currentTarget = this.attackTarget;
                if (now - this.lastShotTime >= this.schussfrequenz * 1000) {
                  this.lastShotTime = now;
                  this.projectiles.push({
                    target: this.currentTarget,
                    damage: this.schaden,
                    spread: this.streuung,
                    travelTime: 600,
                    firedAt: now,
                  });
                }
              }
              // WICHTIG: Immer return bei Attack-Move - KEINE andere Ziel-Suche!
              // Selbst wenn Ziel nicht in Reichweite: Bewegungslogik kümmert sich darum
              return;
            }
          }

          if (!this.currentTarget || this.currentTarget.isDead || this.currentTarget.bruchfest <= 0) {
            this.currentTarget = null;
            for (const other of units) {
              if (other === this || other.isDead || other.bruchfest <= 0) continue;
              if (other.ownerIndex === this.ownerIndex) continue;
              if (this.ownerData?.team_id && other.ownerData?.team_id && this.ownerData.team_id === other.ownerData.team_id) continue;
              const dist = Math.hypot(this.x - other.x, this.y - other.y);
              if (dist <= rangePx && this.canTarget(other)) {
                this.currentTarget = other;
                break;
              }
            }
            if (!this.currentTarget) {
              for (const b of buildings) {
                if (b.ownerIndex === this.ownerIndex) continue;
                if (this.ownerData?.team_id && b.ownerData?.team_id && this.ownerData.team_id === b.ownerData.team_id) continue;
                const center = getBuildingCenter(b);
                const dist = Math.hypot(this.x - center.x, this.y - center.y);
                if (dist <= rangePx && this.canTargetBuilding(b)) {
                  this.currentTarget = b;
                  break;
                }
              }
            }
          }

          if (this.currentTarget) {
            const dist = Math.hypot(this.x - this.currentTarget.x, this.y - this.currentTarget.y);
            if (dist > rangePx) {
              this.currentTarget = null;
              return;
            }
            if (now - this.lastShotTime >= this.schussfrequenz * 1000) {
              this.lastShotTime = now;
              this.projectiles.push({
                target: this.currentTarget,
                damage: this.schaden,
                spread: this.streuung,
                travelTime: 600,
                firedAt: now,
              });
            }
          }

          for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            if (now - proj.firedAt >= proj.travelTime) {
              this.applyDamage(proj.target, proj.damage, proj.spread, units, buildings);
              this.projectiles.splice(i, 1);
            }
          }
        }

        canTarget(unit) {
          if (!this.ziele) return true;
          if (unit.type === "infantry" || unit.type === "vehicle") return (this.ziele & 2) !== 0;
          if (unit.type === "aircraft") return (this.ziele & 8) !== 0;
          return true;
        }

        canTargetBuilding(building) {
          if (!this.ziele) return true;
          return (this.ziele & 4) !== 0;
        }

        applyDamage(target, damage, spread, units, buildings) {
          if (!target) return;
          if (target.bruchfest !== undefined) target.bruchfest -= damage;
          const spreadPx = spread * TILE_SIZE;
          const all = [...units, ...buildings];
          for (const ent of all) {
            if (ent === target || ent === this || ent.isDead) continue;
            if (ent.ownerIndex === this.ownerIndex) continue;
            const dist = Math.hypot(target.x - ent.x, target.y - ent.y);
            if (dist <= spreadPx && ent.bruchfest !== undefined) {
              ent.bruchfest -= Math.floor(damage * 0.5);
            }
          }
        }

        drawWreck(ctx) {
          const px = WORLD_SCALE;
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.globalAlpha = 0.7;
          if (this.type === "infantry") {
            ctx.fillStyle = "#555";
            ctx.fillRect(-3 * px, -8 * px, 6 * px, 10 * px);
            ctx.fillRect(-5 * px, -10 * px, 10 * px, 4 * px);
            ctx.fillStyle = "#fff";
            ctx.font = "8px Arial";
            ctx.textAlign = "center";
            ctx.fillText("RIP", 0, -12 * px);
          } else if (this.type === "vehicle" || this.type === "harvester") {
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.arc(0, 0, 10 * px, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#552200";
            ctx.fillRect(-8 * px, -6 * px, 16 * px, 12 * px);
            ctx.fillStyle = "#ff4400";
            ctx.beginPath();
            ctx.arc(0, -2 * px, 4 * px, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.type === "aircraft") {
            ctx.fillStyle = "#444";
            ctx.beginPath();
            ctx.ellipse(0, 0, 8 * px, 12 * px, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#222";
            ctx.lineWidth = 2;
            ctx.stroke();
          }
          ctx.restore();
        }

        draw(ctx) {
          if (this.isDead) {
            this.drawWreck(ctx);
            return;
          }
          const px = WORLD_SCALE;
          ctx.save();
          ctx.translate(this.type === "infantry" ? this._dispX : this.x, this.type === "infantry" ? this._dispY : this.y);

          // Health-Uhr: Zeigen wenn markiert ODER während Reparatur in RepairBay (im Heliport-Dock nicht)
          if ((this.selected || this.isRepairing) && !this.isAtHelipadDock) {
            const healthRatio = Math.max(0, this.bruchfest / this.maxBruchfest);
            const clockRadius = this.radius + 6 * px;

            ctx.strokeStyle = this.playerColor || "#00ff00";
            ctx.lineWidth = 2 * px;
            ctx.globalAlpha = 1.0; // Keine Farbänderung/Verblassen bei Einheiten

            ctx.beginPath();
            ctx.arc(0, 0, clockRadius, -Math.PI / 2, -Math.PI / 2 + healthRatio * 2 * Math.PI);
            ctx.stroke();

            // Blinken am oberen Ende der Health-Uhr während Reparatur (wie bei Gebäude-Reparatur)
            if (this.isRepairing) {
              const blinkState = this.repairBlinkState || 0;
              const showBlink = blinkState === 0 || blinkState === 2 || blinkState === 4;
              if (showBlink) {
                const healthStep = Math.ceil(this.maxBruchfest * 0.05);
                const stepAngle = (healthStep / this.maxBruchfest) * 2 * Math.PI;

                const startAngle = -Math.PI / 2 + healthRatio * 2 * Math.PI;
                const endAngle = startAngle + stepAngle;

                ctx.strokeStyle = this.playerColor || "#00ff00";
                ctx.lineWidth = 3 * px;
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.arc(0, 0, clockRadius, startAngle, endAngle);
                ctx.stroke();
                ctx.globalAlpha = 1.0;
              }
            }
          }

          // Raketen-Anzeige für Helikopter: Punkte in Spielerfarbe unterhalb des Helis (wenn markiert ODER im Heliport-Dock)
          if (this.type === "aircraft" && (this.selected || this.isAtHelipadDock)) {
            const boxes = this.maxMissiles;
            const boxSize = 2;
            const gap = 1;
            const totalWidth = boxes * boxSize + (boxes - 1) * gap;
            const startX = -totalWidth / 2;
            const y = 20 * px;
            for (let i = 0; i < boxes; i++) {
              const bx = startX + i * (boxSize + gap);
              ctx.fillStyle = i < this.missiles ? this.playerColor || "#00ff44" : "#1a2a1a";
              ctx.fillRect(bx, y, boxSize, boxSize);
            }
          }

          const color = this.playerColor || (this.ownerIndex === 0 ? "#4da6ff" : "#ff3333");

          if (this.type === "infantry") {
            const isCivilian = this.typeKey === "civilian1" || this.typeKey === "civilian2";
            const torsoColor = this.typeKey === "civilian1" ? "#cf5c78" : this.typeKey === "civilian2" ? "#4a9f78" : this.playerColor || color;
            const legColor = this.typeKey === "civilian1" ? "#3757a6" : this.typeKey === "civilian2" ? "#8a6a2c" : this.playerColor || color;
            const skinColor = "#f2c9a0";

            ctx.lineWidth = 2 * px;

            // Kopf
            ctx.fillStyle = skinColor;
            ctx.beginPath();
            ctx.arc(0, -6 * px, 4 * px, 0, Math.PI * 2);
            ctx.fill();

            if (isCivilian) {
              ctx.fillStyle = torsoColor;
              ctx.fillRect(-3 * px, -2 * px, 6 * px, 8 * px);

              ctx.strokeStyle = skinColor;
              ctx.beginPath();
              ctx.moveTo(-2 * px, -1 * px);
              ctx.lineTo(-5 * px, 3 * px);
              ctx.moveTo(2 * px, -1 * px);
              ctx.lineTo(5 * px, 3 * px);
              ctx.stroke();

              ctx.strokeStyle = legColor;
              ctx.beginPath();
              ctx.moveTo(-1 * px, 6 * px);
              ctx.lineTo(-3 * px, 11 * px);
              ctx.moveTo(1 * px, 6 * px);
              ctx.lineTo(3 * px, 11 * px);
              ctx.stroke();
            } else {
              // --- STRICHMÄNNCHEN ---
              ctx.strokeStyle = color;

              // Körper
              ctx.beginPath();
              ctx.moveTo(0, -2 * px);
              ctx.lineTo(0, 5 * px);
              ctx.stroke();

              // Arme (Waffe halten)
              ctx.beginPath();
              ctx.moveTo(-3 * px, 0);
              ctx.lineTo(3 * px, 2 * px);
              ctx.lineTo(6 * px, -1 * px);
              ctx.stroke();

              // Beine
              ctx.beginPath();
              ctx.moveTo(0, 5 * px);
              ctx.lineTo(-3 * px, 10 * px);
              ctx.moveTo(0, 5 * px);
              ctx.lineTo(3 * px, 9 * px);
              ctx.stroke();
            }
          } else if (getBaseTypeId(this.typeKey) === "harvester") {
            // --- HARVESTER ---
            // Dreht sich in Bewegungsrichtung
            let angle = 0;
            if (this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);

            ctx.rotate(angle + Math.PI / 2);

            // Chassis (Gelb)
            ctx.fillStyle = this.playerColor || "#cc9900";
            ctx.fillRect(-12 * px, -14 * px, 24 * px, 28 * px);

            // Rad hinten
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.arc(0, 10 * px, 6 * px, 0, Math.PI * 2);
            ctx.fill();

            // Kabine vorne
            ctx.fillStyle = "#663300"; // Braun
            ctx.fillRect(-8 * px, -14 * px, 16 * px, 12 * px);

            // Lader / Mulde (Grafik)
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1 * px;
            ctx.strokeRect(-10 * px, -6 * px, 20 * px, 14 * px);

            // Füllstand Anzeige
            const fillPct = Math.min(1, this.harvestedDistance / this.maxHarvestDist);
            if (fillPct > 0.01) {
              ctx.fillStyle = `rgba(255, 215, 0, ${fillPct})`;
              ctx.fillRect(-9 * px, -5 * px, 18 * fillPct * px, 12 * px);
            }

            if (this.selected) {
              const boxes = 5;
              const boxSize = 2;
              const gap = 1;
              const totalWidth = boxes * boxSize + (boxes - 1) * gap;
              const startX = -totalWidth / 2;
              const y = 12 * px;
              const filled = Math.min(boxes, Math.floor((this.harvestedDistance / this.maxHarvestDist) * boxes + 0.0001));

              for (let i = 0; i < boxes; i++) {
                const bx = startX + i * (boxSize + gap);
                ctx.fillStyle = i < filled ? "#00ff44" : "#1a2a1a";
                ctx.fillRect(bx, y, boxSize, boxSize);

                if (i < boxes - 1) {
                  ctx.fillStyle = "#0b0b0b";
                  ctx.fillRect(bx + boxSize, y, 1, boxSize);
                }
              }
            }
          } else if (this.typeKey === "mcv") {
            let angle = 0;
            if (this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);

            ctx.rotate(angle + Math.PI / 2);

            const c = this.playerColor || "#8a7d60";
            const d = "#4a4535";
            const w = "#1a1a1a";
            const g = "#999";

            // Trailer (leicht abgetrennt)
            ctx.fillStyle = c;
            ctx.fillRect(-8 * px, 6 * px, 16 * px, 14 * px);
            ctx.strokeStyle = d;
            ctx.lineWidth = 1.5 * px;
            ctx.strokeRect(-6 * px, 7 * px, 12 * px, 10 * px);

            // Kupplung/Verbindungslinie
            ctx.fillStyle = g;
            ctx.fillRect(-2 * px, 2 * px, 4 * px, 3 * px);

            // Chassis & Kabine
            ctx.fillStyle = c;
            ctx.fillRect(-8 * px, -6 * px, 16 * px, 8 * px);
            ctx.fillStyle = "#7a7060";
            ctx.fillRect(-6 * px, -5 * px, 12 * px, 4 * px);

            // Motorhaube (schmal zulaufend)
            ctx.beginPath();
            ctx.moveTo(-5 * px, -14 * px);
            ctx.lineTo(5 * px, -14 * px);
            ctx.lineTo(7 * px, -6 * px);
            ctx.lineTo(-7 * px, -6 * px);
            ctx.closePath();
            ctx.fillStyle = c;
            ctx.fill();
            ctx.strokeStyle = d;
            ctx.lineWidth = 1.5 * px;
            ctx.stroke();

            // Windschutzscheibe & Frontgitter
            ctx.fillStyle = g;
            ctx.fillRect(-4 * px, -8 * px, 8 * px, 2 * px);

            // Chassis-Rahmen (vereinfacht)
            ctx.strokeStyle = d;
            ctx.lineWidth = 2 * px;
            ctx.beginPath();
            ctx.moveTo(-8 * px, -6 * px);
            ctx.lineTo(8 * px, -6 * px);
            ctx.stroke();
          } else if (getBaseTypeId(this.typeKey) === "mobile_flak") {
            // --- Radpanzer mit Turm und Kanone ---
            let angle = 0;
            if (this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);

            ctx.rotate(angle); // Fahrzeug zeigt nach Osten (x-Achse)

            // Rahmen: länglich, 10% breiter (Nord-Süd)
            ctx.fillStyle = this.playerColor || "#c0c000";
            ctx.fillRect(-15 * px, -9 * px, 30 * px, 18 * px);

            // Räder: Durchmesser +50%, Breite reduziert (wie Breitreifen, halb im Rahmen)
            ctx.fillStyle = "#222"; // dunkleres Gummi
            // vorne links
            ctx.fillRect(-13 * px, -11 * px, 7 * px, 6 * px);
            // vorne rechts
            ctx.fillRect(-13 * px, 3, 7 * px, 6 * px);
            // hinten links
            ctx.fillRect(6 * px, -11 * px, 7 * px, 6 * px);
            // hinten rechts
            ctx.fillRect(6 * px, 3, 7 * px, 6 * px);

            // Turm: dunkleres Grau, leicht nach hinten versetzt
            ctx.fillStyle = "#606060";
            ctx.beginPath();
            ctx.arc(-3 * px, 0, 6 * px, 0, Math.PI * 2);
            ctx.fill();

            // Kanone: heller Grau (#a0a0a0), unterscheidbar vom Turm
            // Beginn bei 1/3 Turmdurchmesser von außen
            ctx.strokeStyle = "#a0a0a0";
            ctx.lineWidth = 3 * px;
            ctx.beginPath();
            ctx.moveTo(0 * px, 0); // Startpunkt
            ctx.lineTo(10 * px, 0); // Laenge
            ctx.stroke();
          } else if (getBaseTypeId(this.typeKey) === "helicopter") {
            // --- Helicopter ---
            // helicopterHeading wird in updateHelicopterFlight() in allen Phasen korrekt gepflegt:
            // - parking: 0 (Osten)
            // - taking_off: 0 (Osten, senkrechter Abflug)
            // - aligning: wird schrittweise zum Zielwinkel gedreht
            // - cruising: wird auf Flugrichtung (gerundet) gesetzt
            // - landing: 0 (Osten, senkrechte Landung)
            let angle = this.helicopterHeading || 0;

            ctx.rotate(angle + Math.PI / 2);

            // Rumpf (schlankes Oval)
            ctx.fillStyle = this.playerColor || color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 8 * px, 14 * px, 0, 0, Math.PI * 2);
            ctx.fill();

            // Heckausleger (breit beginnend, spitz zulaufend)
            ctx.fillStyle = this.playerColor || color;
            ctx.strokeStyle = "#147f98";
            ctx.lineWidth = 2 * px;
            ctx.beginPath();
            ctx.moveTo(-3 * px, 14 * px);
            ctx.lineTo(3 * px, 14 * px);
            ctx.lineTo(0, 28 * px);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Querflügel kurz vor Ende des Hecks
            ctx.fillStyle = this.playerColor || color;
            ctx.beginPath();
            ctx.rect(-6 * px, 24 * px, 12 * px, 2 * px);
            ctx.fill();

            // Heckrotor (kleiner Kreis am Ende)
            ctx.fillStyle = "#147f98";
            ctx.beginPath();
            ctx.arc(0, 28 * px, 2.5 * px, 0, Math.PI * 2);
            ctx.fill();

            // Hauptrotor (größer, dickere Linien, Rahmenfarbe)
            if (this.flightPhase === "parking") {
              // Geparkt: X-Form Rotor (Darstellung 1)
              ctx.strokeStyle = "#147f98";
              ctx.lineWidth = 3 * px;
              ctx.beginPath();
              ctx.moveTo(-15 * px, -15 * px);
              ctx.lineTo(15 * px, 15 * px);
              ctx.moveTo(15 * px, -15 * px);
              ctx.lineTo(-15 * px, 15 * px);
              ctx.stroke();
            } else {
              // In Bewegung: Rotor-Animation (3 Bilder: 0°, 30°, 60° ccw), mittig über dem Rumpf –
              // gleiche Optik wie der geparkte X-Rotor, nur rotierend statt starr
              const rotorAngle = this.rotorFrame * (Math.PI / 6); // 30° pro Frame
              ctx.strokeStyle = "#147f98";
              ctx.lineWidth = 3 * px;
              const bladeLen = 16 * px;
              for (let i = 0; i < 4; i++) {
                const bladeAngle = rotorAngle + i * (Math.PI / 2);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(bladeAngle) * bladeLen, Math.sin(bladeAngle) * bladeLen);
                ctx.stroke();
              }
            }
          } else {
            // --- TANK (Standard) ---
            let angle = 0;
            if (this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);

            ctx.rotate(angle + Math.PI / 2);

            // Ketten
            ctx.fillStyle = "#222";
            ctx.fillRect(-12 * px, -14 * px, 6 * px, 28 * px); // Links
            ctx.fillRect(6 * px, -14 * px, 6 * px, 28 * px); // Rechts

            // Körper
            ctx.fillStyle = this.playerColor || color;
            ctx.fillRect(-10 * px, -12 * px, 20 * px, 24 * px);

            // Turm
            ctx.fillStyle = "#003366"; // Dunkelblau für Alliiert
            ctx.beginPath();
            ctx.arc(0, -2 * px, 8 * px, 0, Math.PI * 2);
            ctx.fill();

            // Kanone
            ctx.strokeStyle = "#888";
            ctx.lineWidth = 3 * px;
            ctx.beginPath();
            ctx.moveTo(0, -5 * px);
            ctx.lineTo(0, -20 * px);
            ctx.stroke();
          }

          ctx.restore();
        }
      }

      // --- TROOP SYSTEM ---
      class Troop {
        constructor(id, aiIndex, type) {
          this.id = id;
          this.aiIndex = aiIndex;
          this.type = type; // "defense" (0,1) oder "offense" (2-5)
          this.units = [];
          this.maxSize = 8;
          this.positionX = null;
          this.positionY = null;
          this.lastPositionChange = 0;
          this.positionChangeInterval = 8000 + Math.random() * 8000; // 8-16s
          this.targetEnemy = null;
          this.isAttacking = false;
          this.isDefending = false;

          // Defense-Trupps (0 & 1): Patrouillieren VOR der Basis, nie darin.
          // Trupp 0 patrouilliert horizontal (X), Trupp 1 vertikal (Y).
          if (type === "defense") {
            this.patrolAxis = id === 0 ? "x" : "y";
            this.gatherIndex = 0; // aktueller Sammelpunkt: 0=Zentrum-Richtung, 1=Mittelpunkt, 2=Spielfeldrand
            this.patrolDir = 1; // Zyklusrichtung für 1 → 2 → 3 → 2 → 1 …
            this.patrolPoints = null; // [Sammelpunkt1, Sammelpunkt2 (Mitte), Sammelpunkt3] in Pixeln
            this.needsPatrolOrder = true; // Units zur Patrouillenlinie schicken (ab der ersten Unit)
            this.positionChangeInterval = 10000; // fester 10s-Zielwechsel
          }
        }

        get isFull() {
          return this.units.length >= this.maxSize;
        }

        get aliveUnits() {
          return this.units.filter((u) => !u.isDead && u.bruchfest > 0);
        }

        get isAlive() {
          return this.aliveUnits.length > 0;
        }

        addUnit(unit) {
          if (this.units.length < this.maxSize && !this.units.includes(unit)) {
            this.units.push(unit);
            unit.troopId = this.id;
            unit.troopType = this.type;
            // Defense-Trupps: Später gelieferte Units reihen sich sofort in die Patrouille ein
            if (this.type === "defense") {
              if (this.patrolPoints && game) {
                this.orderUnitToPatrol(game, unit);
              } else {
                this.needsPatrolOrder = true;
              }
            }
            return true;
          }
          return false;
        }

        removeDeadUnits() {
          this.units = this.units.filter((u) => !u.isDead);
        }

        getCenter() {
          if (this.aliveUnits.length === 0) return null;
          const alive = this.aliveUnits;
          return {
            x: alive.reduce((sum, u) => sum + u.x, 0) / alive.length,
            y: alive.reduce((sum, u) => sum + u.y, 0) / alive.length,
          };
        }

        distanceTo(tx, ty) {
          const center = this.getCenter();
          if (!center) return Infinity;
          return Math.hypot(center.x - tx, center.y - ty);
        }

        update(game, now) {
          this.removeDeadUnits();

          if (this.type === "defense") {
            this.updateDefense(game, now);
          } else {
            this.updateOffense(game, now);
          }
        }

        updateDefense(game, now) {
          if (!this.isAlive) return;

          // Defense-Trupps patrouillieren VOR der Basis – nie darin (blockiert sonst die Wege).
          // Gilt ab der ersten zugewiesenen Unit; später gelieferte Units reihen sich fließend ein.

          // Erstausrichtung: Sammelpunkte berechnen und alle zu Sammelpunkt 1 schicken
          if (!this.patrolPoints) {
            this.patrolPoints = game.computeDefensePatrolPoints(this.aiIndex, this.patrolAxis);
            if (this.patrolPoints) {
              this.orderPatrolMove(game);
              this.lastPositionChange = now; // 10s-Timer starten
            }
            return; // noch keine eigenen Gebäude – nächsten Tick erneut versuchen
          }

          // Alle 10s: Ziel-Sammelpunkt wechseln (1 → 2 → 3 → 2 → 1 …), unabhängig davon,
          // ob jede Unit die letzte Position erreicht hat.
          if (now - this.lastPositionChange >= this.positionChangeInterval) {
            let next = this.gatherIndex + this.patrolDir;
            if (next > 2) {
              next = 1;
              this.patrolDir = -1;
            } else if (next < 0) {
              next = 1;
              this.patrolDir = 1;
            }
            this.gatherIndex = next;

            // Inzwischen können neue Gebäude platziert worden sein – gegenüberliegenden
            // Sammelpunkt + Zwischenposition einmalig vor dem Abmarsch neu berechnen.
            const pts = game.computeDefensePatrolPoints(this.aiIndex, this.patrolAxis);
            if (pts) {
              this.patrolPoints = pts;
              this.orderPatrolMove(game);
            }
            this.lastPositionChange = now;
          }

          // Neue Units / beendete Verteidigungs-Engagement: Patrouillenlinie wieder aufsuchen
          if (this.needsPatrolOrder) {
            this.orderPatrolMove(game);
            this.needsPatrolOrder = false;
          }

          // Verteidigung: Wenn eigene Einheit angegriffen wird, greife Angreifer an
          // (danach kehren die Units zur Patrouille zurück)
          if (this.isDefending && this.targetEnemy) {
            if (this.targetEnemy.isDead || this.targetEnemy.bruchfest <= 0) {
              this.isDefending = false;
              this.targetEnemy = null;
              this.needsPatrolOrder = true;
            } else {
              this.engageTarget(game, this.targetEnemy);
            }
          }
        }

        // Schickt alle lebenden Trupp-Mitglieder zum aktuellen Sammelpunkt (mit Spread entlang der Patrol-Achse)
        orderPatrolMove(game) {
          if (!this.patrolPoints || !this.patrolPoints[this.gatherIndex]) return;
          for (const unit of this.aliveUnits) {
            this.orderUnitToPatrol(game, unit);
          }
        }

        // Schickt eine einzelne Einheit zum aktuellen Sammelpunkt – Spread entlang der Patrol-Achse,
        // damit die Units eine Linie bilden statt auf einer Kachel zu stapeln.
        orderUnitToPatrol(game, unit) {
          if (!unit || unit.isDead || !this.patrolPoints || !this.patrolPoints[this.gatherIndex]) return;
          const point = this.patrolPoints[this.gatherIndex];

          let tx = point.x;
          let ty = point.y;
          const spreadPx = TILE_SIZE * Math.min(10, Math.max(2, this.aliveUnits.length));
          if (this.patrolAxis === "x") {
            tx += (Math.random() - 0.5) * spreadPx;
          } else {
            ty += (Math.random() - 0.5) * spreadPx;
          }

          const commandTarget = game.getValidatedMoveTarget(unit, tx, ty);
          unit.setMoveTarget(commandTarget.x, commandTarget.y, commandTarget.allowEndInBlocked, commandTarget.dockGrid || null);
          unit.attackTarget = null;
          unit.isAttackMove = false;
        }

        updateOffense(game, now) {
          // Angriff: Wenn Ziel tot, suche neues
          if (this.isAttacking && this.targetEnemy) {
            if (this.targetEnemy.isDead || this.targetEnemy.bruchfest <= 0) {
              this.isAttacking = false;
              this.targetEnemy = null;
              // Suche nächstes Ziel
              const nextTarget = game.findNearestEnemyForAI(this.aiIndex);
              if (nextTarget) {
                this.targetEnemy = nextTarget;
                this.isAttacking = true;
                this.engageTarget(game, nextTarget);
              }
            } else {
              this.engageTarget(game, this.targetEnemy);
            }
          }
        }

        engageTarget(game, target) {
          const targetX = target.x;
          const targetY = target.y;

          this.aliveUnits.forEach((unit) => {
            if (unit.type === "aircraft") {
              unit.setFlightTarget(targetX, targetY);
            } else {
              const spreadX = targetX + (Math.random() - 0.5) * 40;
              const spreadY = targetY + (Math.random() - 0.5) * 40;
              const commandTarget = game.getValidatedMoveTarget(unit, spreadX, spreadY);
              unit.setMoveTarget(commandTarget.x, commandTarget.y, commandTarget.allowEndInBlocked, commandTarget.dockGrid || null);
            }

            // Setze Angriffsziel
            unit.attackTarget = target;
            unit.isAttackMove = true;
            unit.currentTarget = target;
          });
        }
      }

        updateGameDisplay() {

        // --- RADAR / MINIMAP ---
        // Zeigt das Spielfeld in Miniatur an, sobald der Human-Player ein Radar gebaut hat.
        // Zellgröße = größter ganzzahliger Faktor, der in Breite UND Höhe der Box passt (z.B. 210/40=5 → 5x5px),
        // Restpixel werden als schwarze Streifen mittig ausgeglichen (Letterboxing), Scan-Zyklus 4s.
        // Der Schirm ist ein Speicher: nur die Zeilen direkt hinter der grünen Linie werden aktualisiert,
        // der Rest bleibt bis zum nächsten Durchlauf erhalten (Info max. 4s alt).
        updateRadar() {
          const active = this.hasBuildingType("radar");

          if (active !== this.radarActive) {
            this.radarActive = active;
            this.radarStartTime = Date.now();
            this.radarLastScanRow = -1;
            this.radarLastLineY = null;
            // CSS-Scan-Linie nur ohne aktives Radar anzeigen (Original-Animation);
            // bei aktivem Radar zeichnet das JS die synchrone Linie selbst auf dem Canvas.
            if (this.radarScanLine) this.radarScanLine.style.display = active ? "none" : "";
            // Schriftzug: bei aktivem Radar entfernen, damit das Bild den vollen Box-Bereich nutzt;
            // ohne Radar steht "SECTOR SCAN INACTIVE" und die CSS-Scan-Linie läuft weiter.
            if (this.radarText) {
              this.radarText.textContent = active ? "" : "SECTOR SCAN INACTIVE";
              this.radarText.style.display = active ? "none" : "";
            }
            if (this.radarCanvas) {
              this.radarCanvas.style.display = active ? "block" : "none";
              // Bei Aktivierung Schirm leer initialisieren, damit kein altes Bild vom
              // vorherigen Radar vor dem ersten Scandurchlauf sichtbar ist.
              if (active && this.radarCtx) {
                this.radarCtx.fillStyle = "#000";
                this.radarCtx.fillRect(0, 0, this.radarCanvas.width, this.radarCanvas.height);
              }
            }
          }

          if (!active || !this.radarCtx || !this.radarBox) return;

          // Feldgröße live aus dem Canvas (reagiert auf Fenster-Resize)
          const cols = Math.ceil(this.canvas.width / TILE_SIZE);
          const rows = Math.ceil(this.canvas.height / TILE_SIZE);

          // Größter ganzzahliger Zellfaktor, der in beide Richtungen der Box passt.
          // Auf der Achse mit Restpixeln wird das Bild mittig platziert (Letterboxing).
          const availW = Math.max(1, this.radarBox.clientWidth);
          const availH = Math.max(1, this.radarBox.clientHeight);
          const scale = Math.max(1, Math.floor(Math.min(availW / cols, availH / rows)));

          const w = cols * scale;
          const h = rows * scale;
          const offX = Math.floor((availW - w) / 2);
          const offY = Math.floor((availH - h) / 2);

          if (scale !== this.radarScale || w !== this.radarW || h !== this.radarH || offX !== this.radarOffX || offY !== this.radarOffY) {
            this.radarScale = scale;
            this.radarW = w;
            this.radarH = h;
            this.radarOffX = offX;
            this.radarOffY = offY;
            this.radarCanvas.width = w; // setzt den Schirm auf schwarz zurück
            this.radarCanvas.height = h;
            this.radarCanvas.style.left = offX + "px";
            this.radarCanvas.style.top = offY + "px";
            this.radarLastScanRow = -1;
            this.radarStartTime = Date.now();
            this.radarLastLineY = null;
          }

          // --- Scan-Zyklus (4s): Linie läuft von oben nach unten über den Schirm ---
          const ctx = this.radarCtx;
          const progress = ((Date.now() - this.radarStartTime) % 4000) / 4000;
          const frontY = progress * h; // kontinuierliche Position der Scan-Front (0..h)

          let maxRow = Math.min(rows - 1, Math.floor(frontY / scale));
          if (maxRow < this.radarLastScanRow) {
            this.radarLastScanRow = -1; // Zyklus neu gestartet (Wrap-around) – Schirm bleibt als Speicher erhalten
          }

          // Nur die direkt hinter der Linie liegenden neuen Zeilen aktualisieren (max. ~rows/4 pro Sekunde).
          // Der Rest des Schirms wird NICHT gelöscht, sondern erst beim nächsten Durchlauf überschrieben.
          for (let row = this.radarLastScanRow + 1; row <= maxRow; row++) {
            this.renderRadarRow(row);
          }
          this.radarLastScanRow = maxRow;

          // Grüne Scan-Linie: vorherige Position entfernen, indem die betroffenen Zeilen mit dem
          // aktuellen Zustand neu gerendert werden – sonst bleiben Linien-Reste im Speicher-Schirm
          // stehen und es entsteht ein "Barcode"-Effekt.
          if (this.radarLastLineY !== null) {
            const firstRow = Math.max(0, Math.floor(this.radarLastLineY / scale));
            const lastRow = Math.min(rows - 1, Math.floor((this.radarLastLineY + 2) / scale));
            for (let row = firstRow; row <= lastRow; row++) {
              this.renderRadarRow(row);
            }
          }

          // Neue Scan-Linie an der aktuellen Front-Position zeichnen (schmal, dunkelgrün)
          const lineY = Math.min(h - 2, Math.floor(frontY));
          ctx.fillStyle = "rgba(0, 255, 0, 0.3)";
          ctx.fillRect(0, lineY, w, 2);
          this.radarLastLineY = lineY;
        }

        // Rendert eine einzelne Zeile des Radarschirms mit dem aktuellen Zustand:
        // Hintergrund → Gebäude → Einheiten (Vorrang). Wird sowohl für den Scan als auch
        // zum Entfernen der alten Scan-Linie wiederverwendet.
        renderRadarRow(row) {
          const ctx = this.radarCtx;
          if (!ctx || !this.radarW) return;
          const scale = this.radarScale;
          const w = this.radarW;
          const cols = Math.ceil(this.canvas.width / TILE_SIZE);
          const y0 = row * scale;

          ctx.fillStyle = "#000";
          ctx.fillRect(0, y0, w, scale);

          for (const b of this.buildings) {
            if (b.isDead || b.bruchfest <= 0) continue;
            const g = getBuildingGridRect(b);
            if (row < g.tileY || row >= g.tileY + g.heightTiles) continue;
            const x = Math.max(0, g.tileX * scale);
            const rw = Math.min(w - x, g.widthTiles * scale);
            if (rw > 0) {
              ctx.fillStyle = b.color || "#9e3a3a";
              ctx.fillRect(x, y0, rw, scale);
            }
          }

          // Mobile Units haben Vorrang vor darunterliegenden Gebäuden anderer Spieler
          for (const u of this.units) {
            if (u.isDead) continue;
            const tx = Math.floor(u.x / TILE_SIZE);
            const ty = Math.floor(u.y / TILE_SIZE);
            if (ty !== row || tx < 0 || tx >= cols) continue;
            ctx.fillStyle = u.playerColor || "#9e3a3a";
            ctx.fillRect(tx * scale, y0, scale, scale);
          }
        }

        recalculateCredits(account = this.getAccount(0)) {
          account.base = Math.max(0, Math.floor(account.base));
          account.harvest = Math.max(0, Math.floor(account.harvest));
          account.harvestLimit = Math.max(0, Math.floor(account.harvestLimit));
          account.credits = account.base + account.harvest;
        }

        canAfford(amount, account = this.getAccount(0)) {
          return account.credits >= amount;
        }

        spendCredits(amount, account = this.getAccount(0)) {
          if (!this.canAfford(amount, account)) return false;

          let remaining = amount;
          if (account.harvest >= remaining) {
            account.harvest -= remaining;
            remaining = 0;
          } else {
            remaining -= account.harvest;
            account.harvest = 0;
          }

          if (remaining > 0) {
            account.base = Math.max(0, account.base - remaining);
          }

          this.recalculateCredits(account);
          return true;
        }

        refundCredits(amount, account = this.getAccount(0)) {
          // Standard: alles zurück ins Harvest-Wallet, solange Limit nicht überschritten
          if (account.harvest + amount <= account.harvestLimit) {
            account.harvest += amount;
          } else {
            // Überschuss ins Start-Wallet
            const overflow = account.harvest + amount - account.harvestLimit;
            account.harvest = account.harvestLimit;
            account.base += overflow;
          }
          this.recalculateCredits(account);
        }

        addBaseCredits(amount, account = this.getAccount(0)) {
          account.base += amount;
          this.recalculateCredits(account);
          return amount;
        }

        addHarvestCredits(amount, account = this.getAccount(0)) {
          const before = account.harvest;
          const after = Math.min(account.harvestLimit, before + amount);
          const added = after - before;
          const lost = amount - added;

          account.harvest = after;
          this.recalculateCredits(account);
          if (this.playerStats[account.ownerIndex]) {
            this.playerStats[account.ownerIndex].current.harvested_credits += added;
          }

          return { added, lost };
        }

        addSaleCredits(amount, account = this.getAccount(0)) {
          const freeHarvestStorage = Math.max(0, account.harvestLimit - account.harvest);
          const harvestGain = Math.min(amount, freeHarvestStorage);
          const baseGain = Math.max(0, amount - harvestGain);

          account.harvest += harvestGain;
          account.base += baseGain;
          this.recalculateCredits(account);

          return { harvestGain, baseGain };
        }

        getStorageBonusForBuilding(typeId) {
          const baseId = getBaseTypeId(typeId);
          if (baseId === "refinery") return 2000;
          if (baseId === "silo") return 3000;
          return 0;
        }

        hasBuildingType(typeId) {
          const normalizedId = getBaseTypeId(typeId);
          // Nur Gebäude des menschlichen Spielers zählen für Prerequisites/UI-Updates
          return this.buildings.some((b) => {
            if (!b || !b.name) return false;
            if (b.ownerIndex !== 0) return false;
            return b.name === typeId || getBaseTypeId(b.name) === normalizedId;
          });
        }

        hasReqs(typeData) {
          return !typeData.req || typeData.req.every((req) => this.hasBuildingType(req));
        }

        isTypeAvailableForPlayer(typeData) {
          if (!typeData || !typeData.fraction) return true;
          // Fraktion 5: Harvester - universal verfügbar
          if (typeData.fraction === 5) return true;
          // Fraktion 6: Civilians - nur beim Gebäudeverkauf verfügbar, nicht im Menü
          if (typeData.fraction === 6) return false;
          // Fraktionen 1-4: nur wenn im playerFractions Set
          return this.playerFractions.has(typeData.fraction);
        }

        addPlayerFraction(fraction) {
          if (fraction && FRACTION_LABELS[fraction]) {
            this.playerFractions.add(fraction);
          }
        }

        recalculateBaseEconomy() {
          // 1. Energie & Lagerlimits für alle Spieler zurücksetzen
          for (const acc of this.accounts) {
            acc.energyBalance = 0;
            acc.harvestLimit = 0;
          }

          // 2. Gebäude durchgehen und Werte dem richtigen Eigentümer-Konto zuordnen (index-basiert)
          for (const building of this.buildings) {
            const typeData = this.getBuildingTypeById(building.name);
            if (!typeData) continue;

            // Konto über ownerIndex finden (robust gegen doppelte AI-Typen)
            const acc = building.ownerIndex !== undefined && building.ownerIndex >= 0 && building.ownerIndex < this.accounts.length ? this.accounts[building.ownerIndex] : this.accounts.find((a) => a.type === building.owner);
            if (!acc) continue;

            acc.energyBalance += typeData.energy || 0;
            acc.harvestLimit += this.getStorageBonusForBuilding(building.name);
          }

          // 3. Harvest clampen & Überschuss ins Base-Konto transferieren & Credits für alle Spieler aktualisieren
          for (const acc of this.accounts) {
            const overflow = Math.max(0, acc.harvest - acc.harvestLimit);
            acc.harvest = Math.min(acc.harvest, acc.harvestLimit);
            acc.base += overflow;
            this.recalculateCredits(acc);
          }

          this.buildingsUnlocked = this.hasBuildingType("constructionyard");
          this.updateGameDisplay(); // UI zeigt weiterhin Human (Index 0) an
        }

        updateCursorState() {
          const sellBtn = document.getElementById("action-sell");
          const repairBtn = document.getElementById("action-repair");
          if (sellBtn) sellBtn.classList.toggle("active", this.sellMode);
          if (repairBtn) repairBtn.classList.toggle("active", this.repairMode);

          if (this.placementMode) {
            if (this.isHoveringBuildMenu) {
              document.body.style.cursor = "default";
            } else {
              document.body.style.cursor = "none";
            }
            this.canvas.style.cursor = "none";
            return;
          }

          document.body.style.cursor = "default";
          if (this.repairMode) {
            this.canvas.style.cursor = this.repairCursor;
          } else if (this.sellMode) {
            this.canvas.style.cursor = this.sellCursor;
          } else {
            // Angriffscursor wird dynamisch in updateAttackCursor() gesetzt
            // Hier nur Default setzen, wenn kein Angriffscursor aktiv
            if (!this._attackCursorActive) {
              this.canvas.style.cursor = "crosshair";
            }
          }
        }

        setSellMode(active) {
          this.sellMode = !!active;
          if (this.sellMode && this.placementMode) {
            this.cancelPlacement(true);
          }
          if (this.sellMode && this.repairMode) {
            this.setRepairMode(false);
          }
          this.updateCursorState();
        }

        setRepairMode(active) {
          this.repairMode = !!active;
          if (this.repairMode && this.placementMode) {
            this.cancelPlacement(true);
          }
          if (this.repairMode && this.sellMode) {
            this.setSellMode(false);
          }
          this.updateCursorState();
        }

        findBuildingAt(x, y) {
          for (let i = this.buildings.length - 1; i >= 0; i--) {
            const building = this.buildings[i];
            const rect = getBuildingPixelRect(building);
            if (x >= rect.x && x <= rect.x + rect.width && y >= rect.y && y <= rect.y + rect.height) {
              return building;
            }
          }
          return null;
        }

        findBuildingBodyAt(x, y) {
          for (let i = this.buildings.length - 1; i >= 0; i--) {
            const building = this.buildings[i];
            const body = getBuildingBodyPixelRect(building);
            if (body.height <= 0) continue;
            if (x >= body.x && x <= body.x + body.width && y >= body.y && y <= body.y + body.height) {
              return building;
            }
          }
          return null;
        }

        getProductionTabForBuilding(building) {
          if (!building) return null;
          const baseId = getBaseTypeId(building.name);
          if (baseId === "constructionyard") return "buildings";
          if (baseId === "barracks") return "infantry";
          if (baseId === "warfactory") return "vehicles";
          if (baseId === "helipad") return "aircraft";
          return null;
        }

        spawnUnitsOnSoldBuilding(building, buildingCost) {
          const rect = getBuildingPixelRect(building);
          const trials = Math.floor((buildingCost || 0) / 300);
          const candidates = ["rifleman", "civilian1", "civilian2"];

          let spawnCount = 0;
          for (let i = 0; i < trials; i++) {
            if (Math.random() < 0.5) {
              const unitId = candidates[Math.floor(Math.random() * candidates.length)];
              const col = spawnCount % 3;
              const row = Math.floor(spawnCount / 3);
              const x = rect.x + rect.width * (0.25 + col * 0.25) + (Math.random() - 0.5) * 8 * WORLD_SCALE;
              const y = rect.y + rect.height * (0.35 + row * 0.2) + (Math.random() - 0.5) * 8 * WORLD_SCALE;
              this.units.push(new Entity(x, y, gameConfig.players[0], unitId));
              spawnCount++;
            }
          }
        }

        sellBuildingAt(x, y) {
          const building = this.findBuildingAt(x, y);
          if (!building || building.ownerIndex !== 0) return false;

          const typeData = this.getBuildingTypeById(building.name);
          if (!typeData) return false;
          if (this.playerStats[0]) this.playerStats[0].current.building_lost++;

          if (building.name === "constructionyard" || getBaseTypeId(building.name) === "constructionyard") {
            const center = getBuildingCenter(building);
            this.buildings = this.buildings.filter((b) => b !== building);
            this.units.push(new Entity(center.x, center.y, gameConfig.players[0], "mcv"));
            this.recalculateBaseEconomy();
            this.initSidebar();
            this.updateUI("Construction Yard eingerollt. MCV bereit.");
            return true;
          }

          if (getBaseTypeId(building.name) === "repair_bay") {
            const dockedUnit = this.units.find((u) => ((u.type === "vehicle" || getBaseTypeId(u.typeKey) === "harvester") || u.type === "aircraft") && u.targetRepairBay === building && u.isDocked);
            if (dockedUnit) {
              const unitTypeData = UNIT_TYPES[dockedUnit.typeKey] || {};
              const vehicleSaleValue = Math.floor((unitTypeData.cost || 0) / 2);
              this.addSaleCredits(vehicleSaleValue);
              dockedUnit.isDead = true;
              dockedUnit.deathTime = Date.now();
              dockedUnit.isDocked = false;
              dockedUnit.targetRepairBay = null;
              this.updateUI(`Verkauft: ${unitTypeData.name || "Vehicle"} +$${vehicleSaleValue}`);
              return true;
            }
          }

          const saleValue = Math.floor((typeData.cost || 0) / 2);
          const buildingCost = typeData.cost || 0;

          this.buildings = this.buildings.filter((b) => b !== building);

          const baseId = getBaseTypeId(building.name);
          const hasRemaining = this.buildings.some((b) => getBaseTypeId(b.name) === baseId && b.ownerIndex === 0);
          if (!hasRemaining) {
            if (baseId === "barracks") this.cancelAllProductionForCategory("infantry");
            else if (baseId === "warfactory") this.cancelAllProductionForCategory("vehicle");
            else if (baseId === "helipad") this.cancelAllProductionForCategory("aircraft");
          }

          this.recalculateBaseEconomy();
          this.addSaleCredits(saleValue);
          this.spawnUnitsOnSoldBuilding(building, buildingCost);
          this.initSidebar();
          this.updateUI(`Verkauft: ${typeData.name} +$${saleValue}`);
          return true;
        }

        getRefineryUnloadPoint(refinery) {
          const dockGrid = getDockGridPos(refinery);
          return {
            x: dockGrid.x * TILE_SIZE + TILE_SIZE / 2,
            y: dockGrid.y * TILE_SIZE + TILE_SIZE / 2,
          };
        }

        getRepairBayDockPoint(repairBay) {
          const dockGrid = getDockGridPos(repairBay);
          return {
            x: dockGrid.x * TILE_SIZE + TILE_SIZE / 2,
            y: dockGrid.y * TILE_SIZE + TILE_SIZE / 2,
          };
        }

        // Heliport-Dock-Punkt: exakt in der Mitte des "H" (nicht am Spielfeldraster orientiert)
        getHelipadDockPoint(helipad) {
          const body = getBuildingBodyPixelRect(helipad);
          return { x: body.x + body.width / 2, y: body.y + body.height / 2 };
        }

        // Prüft ob das Dock eines Heliports von einem anderen (geparkten) Helikopter belegt ist.
        // Nur tatsächlich geparkte Helis blockieren: Sobald ein Heli das Dock verlässt
        // (Angriff, Flugziel etc.) wechselt flightPhase weg von "parking" → Dock sofort frei.
        isHelipadDockOccupied(helipad, ignoreUnit = null) {
          return this.units.some((u) => {
            if (u === ignoreUnit || u.isDead) return false;
            if (getBaseTypeId(u.typeKey) !== "helicopter") return false;
            return u.targetHelipad === helipad && u.isAtHelipadDock;
          });
        }

        // Prüft ob eine Spielfeldzelle von einem anderen Helikopter belegt ist (für die Angriffs-Schwebephase).
        // Blockiert werden: schwebende/angreifende Helis (aktuelle Position) und reservierte Schwebepositionen.
        // Bodeneinheiten zählen NICHT – der Heli fliegt tatsächlich in der Ebene darüber.
        isHelicopterTileOccupied(px, py, ignoreUnit = null) {
          const g = Pathfinder.getGridPos(px, py);
          return this.units.some((u) => {
            if (u === ignoreUnit || u.isDead) return false;
            if (getBaseTypeId(u.typeKey) !== "helicopter") return false;
            // Nur schwebende/angreifende Helis blockieren – im Flug ist Überlappung akzeptabel
            if (u.flightPhase === "attacking") {
              const uGrid = Pathfinder.getGridPos(u.x, u.y);
              if (uGrid.x === g.x && uGrid.y === g.y) return true;
            }
            // Reservierte Schwebepositionen blockieren immer (verhindert dass zwei Helis dieselbe Ausweichzelle wählen)
            if (u.attackHoverX !== null && u.attackHoverY !== null) {
              const hGrid = Pathfinder.getGridPos(u.attackHoverX, u.attackHoverY);
              if (hGrid.x === g.x && hGrid.y === g.y) return true;
            }
            return false;
          });
        }

        // Finde die nächstgelegene von Helis freie Spielfeldzelle um (x,y) für die Angriffs-Schwebephase.
        // Nur Helikopter blockieren (aktuelle Position + reservierte Schwebepositionen), Bodeneinheiten nicht.
        findFreeHelicopterHoverSpot(x, y, ignoreUnit = null) {
          const centerGrid = Pathfinder.getGridPos(x, y);
          const cols = Math.floor(this.canvas.width / TILE_SIZE);
          const rows = Math.floor(this.canvas.height / TILE_SIZE);

          // Schritt 1: Exakte Position prüfen
          if (!this.isHelicopterTileOccupied(x, y, ignoreUnit)) {
            return { x, y };
          }

          // Schritt 2: Erweitere Radius schrittweise (nur äußerer Ring pro Radius)
          for (let radius = 1; radius <= 8; radius++) {
            const candidates = [];
            for (let dy = -radius; dy <= radius; dy++) {
              for (let dx = -radius; dx <= radius; dx++) {
                if (Math.max(Math.abs(dx), Math.abs(dy)) !== radius) continue; // nur äußerer Ring
                const tx = centerGrid.x + dx;
                const ty = centerGrid.y + dy;
                if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) continue;
                const cx = tx * TILE_SIZE + TILE_SIZE / 2;
                const cy = ty * TILE_SIZE + TILE_SIZE / 2;
                if (this.isHelicopterTileOccupied(cx, cy, ignoreUnit)) continue;
                candidates.push({ x: cx, y: cy, dist: Math.hypot(dx, dy) });
              }
            }

            if (candidates.length > 0) {
              // Nächstgelegene freie Zelle (bei Gleichstand zufällig aus den ersten für breitere Aufstellung)
              candidates.sort((a, b) => a.dist - b.dist);
              const pick = candidates[Math.floor(Math.random() * Math.min(3, candidates.length))];
              return pick;
            }
          }

          return null;
        }

        // Prüft ob die Position auf dem Körper eines eigenen Heliports liegt (für Dock-Befehle per Linksklick)
        getClickedOwnHelipad(x, y) {
          const building = this.findBuildingBodyAt(x, y);
          if (!building) return null;
          if (getBaseTypeId(building.name) !== "helipad") return null;
          if (building.ownerIndex !== 0) return null;
          return building;
        }

        // Prüft ob die Position auf dem Körper einer eigenen RepairBay liegt (für Dock-Befehle per Linksklick)
        getClickedOwnRepairBay(x, y) {
          const building = this.findBuildingBodyAt(x, y);
          if (!building) return null;
          if (getBaseTypeId(building.name) !== "repair_bay") return null;
          if (building.ownerIndex !== 0) return null;
          return building;
        }

        processRepairBays() {
          const now = Date.now();
          for (const building of this.buildings) {
            if (getBaseTypeId(building.name) !== "repair_bay") continue;

            // Finde alle angedockten Einheiten dieser RepairBay (Fahrzeuge, Harvester & Helikopter)
            const dockedUnits = this.units.filter((u) => ((u.type === "vehicle" || getBaseTypeId(u.typeKey) === "harvester") || u.type === "aircraft") && u.targetRepairBay === building && u.isDocked);

            for (const unit of dockedUnits) {
              // Reparatur nur wenn Gesundheit nicht voll
              if (unit.bruchfest >= unit.maxBruchfest) {
                unit.isRepairing = false;
                unit.repairElapsed = 0;
                continue;
              }

              unit.isRepairing = true;

              // Reparatur-Initialisierung
              if (!unit.repairElapsed) unit.repairElapsed = 0;
              if (!unit.repairLastTick) unit.repairLastTick = now;

              const dt = now - unit.repairLastTick;
              unit.repairLastTick = now;
              unit.repairElapsed += dt;

              // Kosten und Gesundheit pro Schritt (wie bei Gebäude-Reparatur: 5% pro Schritt)
              const unitTypeData = UNIT_TYPES[unit.typeKey] || {};
              const unitCost = unitTypeData.cost || 500;
              const healthStep = Math.ceil(unit.maxBruchfest * 0.05);
              const costStep = Math.ceil(unitCost * 0.05);
              const stepDuration = 5000; // 5 Sekunden pro Schritt

              if (unit.repairElapsed >= stepDuration) {
                // Kosten vom Besitzer abziehen
                const account = this.getAccount(unit.ownerIndex);
                if (this.canAfford(costStep, account)) {
                  this.spendCredits(costStep, account);
                  unit.bruchfest = Math.min(unit.maxBruchfest, unit.bruchfest + healthStep);
                  unit.repairElapsed = 0;

                  // Visueller Effekt
                  this.repairEffects.push({ x: unit.x, y: unit.y - 20, life: 60, text: `+${healthStep}` });

                  // Reparatur abgeschlossen?
                  if (unit.bruchfest >= unit.maxBruchfest) {
                    unit.isRepairing = false;
                    unit.repairElapsed = 0;
                    if (unit.ownerIndex === 0) this.updateUI(`${unitTypeData.name || "Vehicle"} vollständig repariert.`);
                  }
                } else {
                  // Nicht genug Credits - Reparatur stoppen
                  unit.isRepairing = false;
                  unit.repairElapsed = 0;
                  if (unit.ownerIndex === 0) this.updateUI(`Reparatur von ${unitTypeData.name || "Vehicle"} gestoppt (Credits).`);
                }
              }

              // Blink-State für Health-Uhr (wie bei Gebäude-Reparatur)
              const currentBlinkSec = Math.floor(unit.repairElapsed / 1000);
              unit.repairBlinkState = currentBlinkSec % 5;
            }
          }

          // Cleanup repair effects
          for (let i = this.repairEffects.length - 1; i >= 0; i--) {
            this.repairEffects[i].life--;
            if (this.repairEffects[i].life <= 0) this.repairEffects.splice(i, 1);
          }
        }

        isTileBlockedByBuildingBody(tileX, tileY) {
          for (const building of this.buildings) {
            const body = getBuildingBlockedGridRect(building);
            if (tileX >= body.tileX && tileX < body.tileX + body.widthTiles && tileY >= body.tileY && tileY < body.tileY + body.heightTiles) {
              return true;
            }
          }
          return false;
        }

        getValidatedMoveTarget(unit, targetX, targetY, options = {}) {
          const allowRefineryDock = options.allowRefineryDock !== false;
          unit.targetRepairBay = null; // Reset vor jeder neuen Bewegungsberechnung

          // Ausnahme: Repair Bay Docking für Fahrzeuge
          if (unit.type === "vehicle" || getBaseTypeId(unit.typeKey) === "harvester") {
            const unitOwnerIndex = unit.ownerIndex !== undefined ? unit.ownerIndex : gameConfig.players.indexOf(unit.ownerData);
            const clickedRepairBay = this.buildings.find((b) => {
              if (getBaseTypeId(b.name) !== "repair_bay") return false;
              if (b.ownerIndex !== unitOwnerIndex) return false;
              const rect = getBuildingPixelRect(b);
              return distancePointToRect(targetX, targetY, rect) <= TILE_SIZE * 1.5;
            });

            if (clickedRepairBay) {
              unit.targetRepairBay = clickedRepairBay;
              const dock = this.getRepairBayDockPoint(clickedRepairBay);
              const dockGrid = getDockGridPos(clickedRepairBay);
              const dockedUnit = this.units.find((u) => (u.type === "vehicle" || getBaseTypeId(u.typeKey) === "harvester") && u.targetRepairBay === clickedRepairBay && u.isDocked);
              if (dockedUnit && dockedUnit !== unit) {
                dockedUnit.isDocked = false;
                dockedUnit.targetRepairBay = null;

                // Finde freie Zelle auf der Betonplatte (BIB) oder außerhalb
                const full = getBuildingGridRect(clickedRepairBay);
                const candidates = [];
                const pushCandidate = (tx, ty) => {
                  if (tx < 0 || ty < 0 || tx >= this.cols || ty >= this.rows) return;
                  if (this.isTileBlockedByBuildingBody(tx, ty)) return;
                  candidates.push({ x: tx * TILE_SIZE + TILE_SIZE / 2, y: ty * TILE_SIZE + TILE_SIZE / 2 });
                };
                // BIB-Reihe (unterste Reihe)
                const bibY = full.tileY + full.heightTiles - 1;
                for (let tx = full.tileX; tx < full.tileX + full.widthTiles; tx++) pushCandidate(tx, bibY);
                // Außenring
                for (let tx = full.tileX - 1; tx <= full.tileX + full.widthTiles; tx++) {
                  for (let ty = full.tileY - 1; ty <= full.tileY + full.heightTiles; ty++) {
                    if (tx < full.tileX || tx >= full.tileX + full.widthTiles || ty < full.tileY || ty >= full.tileY + full.heightTiles) {
                      pushCandidate(tx, ty);
                    }
                  }
                }

                let exitTarget = { x: dockedUnit.x, y: dockedUnit.y };
                if (candidates.length > 0) {
                  candidates.sort((a, b) => Math.hypot(a.x - dockedUnit.x, a.y - dockedUnit.y) - Math.hypot(b.x - dockedUnit.x, b.y - dockedUnit.y));
                  exitTarget = candidates[0];
                }
                dockedUnit.setMoveTarget(exitTarget.x, exitTarget.y, false);
              }
              return { x: dock.x, y: dock.y, allowEndInBlocked: true, repairBay: clickedRepairBay, dockGrid };
            }
          }

          // Ausnahme: Harvester-Dock in Raffinerie (Zeile 2 von unten, Mitte)
          if (getBaseTypeId(unit.typeKey) === "harvester" && allowRefineryDock) {
            // Try to match a refinery more leniently (clicking near or inside the building)
            const unitOwnerIndex = unit.ownerIndex !== undefined ? unit.ownerIndex : gameConfig.players.indexOf(unit.ownerData);
            const clickedRefinery = this.buildings.find((b) => {
              if (getBaseTypeId(b.name) !== "refinery") return false;
              if (b.ownerIndex !== unitOwnerIndex) return false; // Nur eigene Raffinerien erlauben Docking/Auftrag (index-basiert)
              const rect = getBuildingPixelRect(b);
              return distancePointToRect(targetX, targetY, rect) <= TILE_SIZE * 1.2;
            });

            if (clickedRefinery) {
              const dock = this.getRefineryUnloadPoint(clickedRefinery);
              const dockGrid = getDockGridPos(clickedRefinery);
              return { x: dock.x, y: dock.y, allowEndInBlocked: true, refinery: clickedRefinery, dockGrid };
            }
          }

          const targetTile = Pathfinder.getGridPos(targetX, targetY);
          const cols = Math.floor(this.canvas.width / TILE_SIZE);
          const rows = Math.floor(this.canvas.height / TILE_SIZE);

          const hitBuilding = this.buildings.find((b) => {
            const blocked = getBuildingBlockedGridRect(b);
            return targetTile.x >= blocked.tileX && targetTile.x < blocked.tileX + blocked.widthTiles && targetTile.y >= blocked.tileY && targetTile.y < blocked.tileY + blocked.heightTiles;
          });

          if (!hitBuilding) {
            return { x: targetX, y: targetY, allowEndInBlocked: false, refinery: null };
          }

          // If the hit building is a refinery, return the dock position ONLY for harvesters (nicht für andere Fahrzeuge!)
          const unitOwnerIdx = unit.ownerIndex !== undefined ? unit.ownerIndex : gameConfig.players.indexOf(unit.ownerData);
          if (getBaseTypeId(hitBuilding.name) === "refinery" && hitBuilding.ownerIndex === unitOwnerIdx && getBaseTypeId(unit.typeKey) === "harvester") {
            const dock = this.getRefineryUnloadPoint(hitBuilding);
            const dockGrid = getDockGridPos(hitBuilding);
            return { x: dock.x, y: dock.y, allowEndInBlocked: true, refinery: hitBuilding, dockGrid };
          }

          const full = getBuildingGridRect(hitBuilding);
          const candidates = [];

          const pushCandidate = (tx, ty) => {
            if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;
            if (this.isTileBlockedByBuildingBody(tx, ty)) return;
            candidates.push({
              tx,
              ty,
              x: tx * TILE_SIZE + TILE_SIZE / 2,
              y: ty * TILE_SIZE + TILE_SIZE / 2,
            });
          };

          // Bib-Reihe (unterste Reihe des Footprints)
          const bibY = full.tileY + full.heightTiles - 1;
          for (let tx = full.tileX; tx < full.tileX + full.widthTiles; tx++) {
            pushCandidate(tx, bibY);
          }

          // Außenring um den Footprint
          for (let tx = full.tileX - 1; tx <= full.tileX + full.widthTiles; tx++) {
            for (let ty = full.tileY - 1; ty <= full.tileY + full.heightTiles; ty++) {
              const outside = tx < full.tileX || tx >= full.tileX + full.widthTiles || ty < full.tileY || ty >= full.tileY + full.heightTiles;
              if (outside) pushCandidate(tx, ty);
            }
          }

          if (candidates.length === 0) {
            return { x: targetX, y: targetY, allowEndInBlocked: false, refinery: null };
          }

          candidates.sort((a, b) => Math.hypot(a.x - targetX, a.y - targetY) - Math.hypot(b.x - targetX, b.y - targetY));
          const best = candidates[0];
          return { x: best.x, y: best.y, allowEndInBlocked: false, refinery: null };
        }

        getPlacementAt(mouseX, mouseY, buildingType) {
          const widthTiles = buildingType.widthTiles || 1;
          const heightTiles = buildingType.heightTiles || 1;

          const cols = Math.floor(this.canvas.width / TILE_SIZE);
          const rows = Math.floor(this.canvas.height / TILE_SIZE);

          let tileX = Math.floor(mouseX / TILE_SIZE) - Math.floor(widthTiles / 2);
          let tileY = Math.floor(mouseY / TILE_SIZE) - Math.floor(heightTiles / 2);

          tileX = Math.max(0, Math.min(cols - widthTiles, tileX));
          tileY = Math.max(0, Math.min(rows - heightTiles, tileY));

          return { tileX, tileY, widthTiles, heightTiles };
        }

        isPlacementFree(placement, options = {}) {
          const ignoreUnits = options.ignoreUnits || [];
          const buildingType = options.buildingType || null;
          const placingOwnerIndex = options.ownerIndex !== undefined ? options.ownerIndex : null;

          // Check for overlap with existing buildings
          for (const building of this.buildings) {
            const existing = getBuildingGridRect(building);
            const overlapX = placement.tileX < existing.tileX + existing.widthTiles && placement.tileX + placement.widthTiles > existing.tileX;
            const overlapY = placement.tileY < existing.tileY + existing.heightTiles && placement.tileY + placement.heightTiles > existing.tileY;
            if (overlapX && overlapY) return { free: false, reason: "building" };
          }

          // Check distance constraint for Buildings and Defense menu entries
          const buildingsMenuBaseIds = ["constructionyard", "powerplant", "barracks", "refinery", "warfactory", "radar", "helipad", "repair_bay"];
          const isDefenseType = !!(buildingType && DEFENSE_TYPES[buildingType.id]);
          if (buildingType && (buildingsMenuBaseIds.includes(getBaseTypeId(buildingType.id)) || buildingsMenuBaseIds.includes(buildingType.baseId) || isDefenseType)) {
            // Check distance to other Building menu buildings, gefiltert nach dem platzierenden Owner
            const currentTeamId = placingOwnerIndex !== null ? gameConfig.players[placingOwnerIndex].team_id : null;
            const otherBuildingsMenu = this.buildings.filter((b) => {
              const bBaseId = getBaseTypeId(b.name);
              if (!buildingsMenuBaseIds.includes(bBaseId)) return false;
              // Erlaube eigene Gebäude ODER Gebäude von Teammitgliedern
              if (placingOwnerIndex !== null && b.ownerIndex !== placingOwnerIndex) {
                if (!b.ownerData || b.ownerData.team_id !== currentTeamId) return false;
              }
              return true;
            });

            // Distanzprüfung NUR erzwingen, wenn bereits eigene Gebäude existieren.
            // Das erste Gebäude eines Spielers (z.B. Construction Yard) darf an einem freien Spawn-Punkt platziert werden.
            // Distanzprüfung NUR erzwingen, wenn bereits eigene Gebäude existieren.
            // Das erste Gebäude eines Spielers (z.B. Construction Yard) darf an einem freien Spawn-Punkt platziert werden.
            // Distanzprüfung NUR erzwingen, wenn bereits eigene Gebäude existieren.
            if (otherBuildingsMenu.length > 0) {
              let withinAllowedDistance = false;
              const isPlacingWall = buildingType && getBaseTypeId(buildingType.id) === "wall";

              // Mauern dürfen direkt an andere Mauern gebaut werden, unabhängig von der Distanz zu Hauptgebäuden
              if (isPlacingWall) {
                for (const b of this.buildings) {
                  if (getBaseTypeId(b.name) !== "wall") continue;
                  const bGrid = getBuildingGridRect(b);
                  const hGap = Math.max(0, bGrid.tileX - (placement.tileX + placement.widthTiles), placement.tileX - (bGrid.tileX + bGrid.widthTiles));
                  const vGap = Math.max(0, bGrid.tileY - (placement.tileY + placement.heightTiles), placement.tileY - (bGrid.tileY + bGrid.heightTiles));
                  if (Math.max(hGap, vGap) === 0) {
                    withinAllowedDistance = true;
                    break;
                  }
                }
              }

              if (!withinAllowedDistance) {
                for (const other of otherBuildingsMenu) {
                  const otherGrid = getBuildingGridRect(other);
                  const placementLeft = placement.tileX;
                  const placementRight = placement.tileX + placement.widthTiles - 1;
                  const placementTop = placement.tileY;
                  const placementBottom = placement.tileY + placement.heightTiles - 1;
                  const otherLeft = otherGrid.tileX;
                  const otherRight = otherGrid.tileX + otherGrid.widthTiles - 1;
                  const otherTop = otherGrid.tileY;
                  const otherBottom = otherGrid.tileY + otherGrid.heightTiles - 1;
                  let horizontalGap = Math.max(0, otherLeft - placementRight - 1, placementLeft - otherRight - 1);
                  let verticalGap = Math.max(0, otherTop - placementBottom - 1, placementTop - otherBottom - 1);
                  let minDistance = Math.max(horizontalGap, verticalGap);
                  if (minDistance <= 1) {
                    withinAllowedDistance = true;
                    break;
                  }
                }
              }

              if (!withinAllowedDistance) {
                return { free: false, reason: "distance_too_far" };
              }
            }
          }

          const placementRect = {
            x: placement.tileX * TILE_SIZE,
            y: placement.tileY * TILE_SIZE,
            width: placement.widthTiles * TILE_SIZE,
            height: placement.heightTiles * TILE_SIZE,
          };

          for (const unit of this.units) {
            if (ignoreUnits.includes(unit)) continue;
            if (distancePointToRect(unit.x, unit.y, placementRect) < unit.radius) {
              return { free: false, reason: "unit" };
            }
          }

          return { free: true, reason: null };
        }

        spawnSquad(owner, startX, startY, count) {
          for (let i = 0; i < count; i++) {
            const ox = (Math.random() - 0.5) * 50 * WORLD_SCALE;
            const oy = (Math.random() - 0.5) * 50 * WORLD_SCALE;
            this.units.push(new Entity(startX + ox, startY + oy, owner));
          }
        }

        getBuildingTypeById(id) {
          // Versuche exakte Übereinstimmung
          if (BUILDING_TYPES[id]) return BUILDING_TYPES[id];
          if (DEFENSE_TYPES[id]) return DEFENSE_TYPES[id];
          if (id === "constructionyard") return CONSTRUCTION_YARD_TYPE;

          // Versuche über baseId (für suffixed IDs wie 'powerplant_1')
          const baseId = getBaseTypeId(id);
          const foundBuilding = Object.values(BUILDING_TYPES).find((b) => b.baseId === baseId);
          if (foundBuilding) return foundBuilding;

          const foundDefense = Object.values(DEFENSE_TYPES).find((b) => b.baseId === baseId);
          if (foundDefense) return foundDefense;

          return null;
        }

        isReadyLockActive(containerId, exceptTypeId = null) {
          if (!containerId) return false;
          const container = document.getElementById(containerId);
          if (!container) return false;

          const buttons = container.querySelectorAll('.build-item[id^="btn-"]');
          for (const btn of buttons) {
            const id = btn.id.replace("btn-", "");
            const state = this.getBuildingProductionState(id);
            if (state.status === "ready" && id !== exceptTypeId) return true;
          }
          return false;
        }

        hasAnyReadyBuilding(exceptTypeId = null) {
          return Object.keys(this.buildingProductionStates).some((id) => {
            const state = this.buildingProductionStates[id];
            return state && state.status === "ready" && id !== exceptTypeId;
          });
        }

        getBuildingQueue(typeData) {
          return DEFENSE_TYPES[typeData.id] ? this.defenseProductionQueue : this.buildingProductionQueue;
        }

        getBuildingProductionCategory(typeData) {
          return DEFENSE_TYPES[typeData.id] ? "defense" : "building";
        }

        getBuildingQueueByCategory(category) {
          return category === "defense" ? this.defenseProductionQueue : this.buildingProductionQueue;
        }

        getCurrentBuildingProductionByCategory(category) {
          return category === "defense" ? this.currentDefenseProduction : this.currentBuildingProduction;
        }

        setCurrentBuildingProductionByCategory(category, production) {
          if (category === "defense") this.currentDefenseProduction = production;
          else this.currentBuildingProduction = production;
        }

        hasAnyReadyBuilding(category, exceptTypeId = null) {
          return Object.keys(this.buildingProductionStates).some((id) => {
            const typeData = this.getBuildingTypeById(id);
            if (!typeData) return false;
            if (this.getBuildingProductionCategory(typeData) !== category) return false;
            const state = this.buildingProductionStates[id];
            return state && state.status === "ready" && id !== exceptTypeId;
          });
        }

        getBuildingProductionState(id) {
          if (!this.buildingProductionStates[id]) {
            this.buildingProductionStates[id] = {
              status: "idle", // idle | building | ready
              startTime: 0,
              totalTime: this.buildingBuildTimeMs,
              progressMs: 0,
              lastTick: 0,
            };
          }
          return this.buildingProductionStates[id];
        }

        startBuildingProduction(typeData) {
          if (!this.isTypeAvailableForPlayer(typeData)) return;
          const hasReq = this.hasReqs(typeData);
          const playerAccount = this.getAccount(0);
          if (!this.buildingsUnlocked || !hasReq || !this.canAfford(typeData.cost, playerAccount)) return;

          const category = this.getBuildingProductionCategory(typeData);
          const queue = this.getBuildingQueue(typeData);

          let queueItem = queue.find((q) => q.type === typeData.id);
          if (queueItem) {
            queueItem.count++;
          } else {
            queueItem = { type: typeData.id, count: 1, cost: typeData.cost, name: typeData.name };
            queue.push(queueItem);
          }

          if (!this.spendCredits(typeData.cost, playerAccount)) {
            this.updateUI("Nicht genug Credits!");
            queueItem.count--;
            if (queueItem.count === 0) {
              const index = queue.indexOf(queueItem);
              if (index >= 0) queue.splice(index, 1);
            }
            return;
          }

          this.updateUI(`Bau angefragt: ${typeData.name}`);
          if (!this.getCurrentBuildingProductionByCategory(category) && !this.hasAnyReadyBuilding(category)) {
