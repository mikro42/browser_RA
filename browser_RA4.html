            const typeData = this.getBuildingTypeById(building.name);
            if (!typeData) continue;

            // Konto über ownerIndex finden (robust gegen doppelte AI-Typen)
            const acc = building.ownerIndex !== undefined && building.ownerIndex >= 0 && building.ownerIndex < this.accounts.length ? this.accounts[building.ownerIndex] : this.accounts.find((a) => a.type === building.owner);
            if (!acc) continue;

            acc.energyBalance += typeData.energy || 0;
            acc.harvestLimit += this.getStorageBonusForBuilding(building.name);
          }

          // 3. Harvest clampen & Credits für alle Spieler aktualisieren
          for (const acc of this.accounts) {
            acc.harvest = Math.min(acc.harvest, acc.harvestLimit);
            this.recalculateCredits(acc);
          }

          this.buildingsUnlocked = this.hasBuildingType("constructionyard");
          this.updateGameDisplay(); // UI zeigt weiterhin Human (Index 0) an
        }

        updateCursorState() {
          const sellBtn = document.getElementById("action-sell");
          if (sellBtn) {
            sellBtn.classList.toggle("active", this.sellMode);
          }

          if (this.placementMode) {
            if (this.isHoveringBuildMenu) {
              document.body.style.cursor = "default";
            } else {
              document.body.style.cursor = "none";
            }
            this.canvas.style.cursor = "none";
            return;
          }

          document.body.style.cursor = "default";
          this.canvas.style.cursor = this.sellMode ? this.sellCursor : "crosshair";
        }

        setSellMode(active) {
          this.sellMode = !!active;
          if (this.sellMode && this.placementMode) {
            this.cancelPlacement(true);
          }
          this.updateCursorState();
        }

        findBuildingAt(x, y) {
          for (let i = this.buildings.length - 1; i >= 0; i--) {
            const building = this.buildings[i];
            const rect = getBuildingPixelRect(building);
            if (x >= rect.x && x <= rect.x + rect.width && y >= rect.y && y <= rect.y + rect.height) {
              return building;
            }
          }
          return null;
        }

        findBuildingBodyAt(x, y) {
          for (let i = this.buildings.length - 1; i >= 0; i--) {
            const building = this.buildings[i];
            const body = getBuildingBodyPixelRect(building);
            if (body.height <= 0) continue;
            if (x >= body.x && x <= body.x + body.width && y >= body.y && y <= body.y + body.height) {
              return building;
            }
          }
          return null;
        }

        getProductionTabForBuilding(building) {
          if (!building) return null;
          const baseId = getBaseTypeId(building.name);
          if (baseId === "constructionyard") return "buildings";
          if (baseId === "barracks") return "infantry";
          if (baseId === "warfactory") return "vehicles";
          if (baseId === "helipad") return "aircraft";
          return null;
        }

        spawnUnitsOnSoldBuilding(building, buildingCost) {
          const rect = getBuildingPixelRect(building);
          const trials = Math.floor((buildingCost || 0) / 300);
          const candidates = ["rifleman", "civilian1", "civilian2"];

          let spawnCount = 0;
          for (let i = 0; i < trials; i++) {
            if (Math.random() < 0.5) {
              const unitId = candidates[Math.floor(Math.random() * candidates.length)];
              const col = spawnCount % 3;
              const row = Math.floor(spawnCount / 3);
              const x = rect.x + rect.width * (0.25 + col * 0.25) + (Math.random() - 0.5) * 8 * WORLD_SCALE;
              const y = rect.y + rect.height * (0.35 + row * 0.2) + (Math.random() - 0.5) * 8 * WORLD_SCALE;
              this.units.push(new Entity(x, y, gameConfig.players[0], unitId));
              spawnCount++;
            }
          }
        }

        sellBuildingAt(x, y) {
          const building = this.findBuildingAt(x, y);
          if (!building || building.ownerIndex !== 0) return false;

          const typeData = this.getBuildingTypeById(building.name);
          if (!typeData) return false;

          if (building.name === "constructionyard" || getBaseTypeId(building.name) === "constructionyard") {
            const center = getBuildingCenter(building);
            this.buildings = this.buildings.filter((b) => b !== building);
            this.units.push(new Entity(center.x, center.y, gameConfig.players[0], "mcv"));
            this.recalculateBaseEconomy();
            this.initSidebar();
            this.updateUI("Construction Yard eingerollt. MCV bereit.");
            return true;
          }

          if (getBaseTypeId(building.name) === "repair_bay") {
            const dockedUnit = this.units.find((u) => (u.type === "vehicle" || u.type === "harvester") && u.targetRepairBay === building && u.isDocked);
            if (dockedUnit) {
              const unitTypeData = UNIT_TYPES[dockedUnit.typeKey] || {};
              const vehicleSaleValue = Math.floor((unitTypeData.cost || 0) / 2);
              this.addSaleCredits(vehicleSaleValue);
              dockedUnit.isDead = true;
              dockedUnit.deathTime = Date.now();
              dockedUnit.isDocked = false;
              dockedUnit.targetRepairBay = null;
              this.updateUI(`Verkauft: ${unitTypeData.name || "Vehicle"} +$${vehicleSaleValue}`);
              return true;
            }
          }

          const saleValue = Math.floor((typeData.cost || 0) / 2);
          const buildingCost = typeData.cost || 0;

          this.buildings = this.buildings.filter((b) => b !== building);

          const baseId = getBaseTypeId(building.name);
          const hasRemaining = this.buildings.some((b) => getBaseTypeId(b.name) === baseId && b.ownerIndex === 0);
          if (!hasRemaining) {
            if (baseId === "barracks") this.cancelAllProductionForCategory("infantry");
            else if (baseId === "warfactory") this.cancelAllProductionForCategory("vehicle");
            else if (baseId === "helipad") this.cancelAllProductionForCategory("aircraft");
          }

          this.recalculateBaseEconomy();
          this.addSaleCredits(saleValue);
          this.spawnUnitsOnSoldBuilding(building, buildingCost);
          this.initSidebar();
          this.updateUI(`Verkauft: ${typeData.name} +$${saleValue}`);
          return true;
        }

        getRefineryUnloadPoint(refinery) {
          const grid = getBuildingGridRect(refinery);
          const tileX = grid.tileX + Math.floor(grid.widthTiles / 2); // Mitte (Spalte 2 bei 3)
          const tileY = grid.tileY + grid.heightTiles - 2; // Zeile 2 von unten
          return {
            x: tileX * TILE_SIZE + TILE_SIZE / 2,
            y: tileY * TILE_SIZE + TILE_SIZE / 2,
          };
        }

        getRepairBayDockPoint(repairBay) {
          const grid = getBuildingGridRect(repairBay);
          const tileX = grid.tileX + Math.floor(grid.widthTiles / 2);
          const tileY = grid.tileY + grid.heightTiles - 2;
          return {
            x: tileX * TILE_SIZE + TILE_SIZE / 2,
            y: tileY * TILE_SIZE + TILE_SIZE / 2,
          };
        }

        processRepairBays() {
          const now = Date.now();
          for (const building of this.buildings) {
            if (getBaseTypeId(building.name) !== "repair_bay") continue;
            const dockedUnit = this.units.find((u) => (u.type === "vehicle" || u.type === "harvester") && u.targetRepairBay === building && u.isDocked);
            if (dockedUnit) {
              const dt = (now - (dockedUnit.lastRepairTick || now)) / 1000;
              if (dt >= 1) {
                dockedUnit.bruchfest = Math.min(dockedUnit.maxBruchfest, dockedUnit.bruchfest + 5);
                dockedUnit.lastRepairTick = now;
                // OPTISCHER REPARATUR-EFFEKT (1x pro Sekunde) - Leicht änderbar
                this.repairEffects.push({ x: dockedUnit.x, y: dockedUnit.y - 20, life: 60, text: "+5" });
              }
            }
          }
          for (let i = this.repairEffects.length - 1; i >= 0; i--) {
            this.repairEffects[i].life--;
            if (this.repairEffects[i].life <= 0) this.repairEffects.splice(i, 1);
          }
        }

        isTileBlockedByBuildingBody(tileX, tileY) {
          for (const building of this.buildings) {
            const body = getBuildingBlockedGridRect(building);
            if (tileX >= body.tileX && tileX < body.tileX + body.widthTiles && tileY >= body.tileY && tileY < body.tileY + body.heightTiles) {
              return true;
            }
          }
          return false;
        }

        getValidatedMoveTarget(unit, targetX, targetY, options = {}) {
          const allowRefineryDock = options.allowRefineryDock !== false;

          // Ausnahme: Repair Bay Docking für Fahrzeuge
          if (unit.type === "vehicle" || unit.type === "harvester") {
            const unitOwnerIndex = unit.ownerIndex !== undefined ? unit.ownerIndex : gameConfig.players.indexOf(unit.ownerData);
            const clickedRepairBay = this.buildings.find((b) => {
              if (getBaseTypeId(b.name) !== "repair_bay") return false;
              if (b.ownerIndex !== unitOwnerIndex) return false;
              const rect = getBuildingPixelRect(b);
              return distancePointToRect(targetX, targetY, rect) <= TILE_SIZE * 1.5;
            });

            if (clickedRepairBay) {
              unit.targetRepairBay = clickedRepairBay;
              const dock = this.getRepairBayDockPoint(clickedRepairBay);
              const dockedUnit = this.units.find((u) => u.type === "vehicle" && u.targetRepairBay === clickedRepairBay && u.isDocked);
              if (dockedUnit && dockedUnit !== unit) {
                dockedUnit.isDocked = false;
                dockedUnit.targetRepairBay = null;

                // Finde freie Zelle auf der Betonplatte (BIB) oder außerhalb
                const full = getBuildingGridRect(clickedRepairBay);
                const candidates = [];
                const pushCandidate = (tx, ty) => {
                  if (tx < 0 || ty < 0 || tx >= this.cols || ty >= this.rows) return;
                  if (this.isTileBlockedByBuildingBody(tx, ty)) return;
                  candidates.push({ x: tx * TILE_SIZE + TILE_SIZE / 2, y: ty * TILE_SIZE + TILE_SIZE / 2 });
                };
                // BIB-Reihe (unterste Reihe)
                const bibY = full.tileY + full.heightTiles - 1;
                for (let tx = full.tileX; tx < full.tileX + full.widthTiles; tx++) pushCandidate(tx, bibY);
                // Außenring
                for (let tx = full.tileX - 1; tx <= full.tileX + full.widthTiles; tx++) {
                  for (let ty = full.tileY - 1; ty <= full.tileY + full.heightTiles; ty++) {
                    if (tx < full.tileX || tx >= full.tileX + full.widthTiles || ty < full.tileY || ty >= full.tileY + full.heightTiles) {
                      pushCandidate(tx, ty);
                    }
                  }
                }

                let exitTarget = { x: dockedUnit.x, y: dockedUnit.y };
                if (candidates.length > 0) {
                  candidates.sort((a, b) => Math.hypot(a.x - dockedUnit.x, a.y - dockedUnit.y) - Math.hypot(b.x - dockedUnit.x, b.y - dockedUnit.y));
                  exitTarget = candidates[0];
                }
                dockedUnit.setMoveTarget(exitTarget.x, exitTarget.y, false);
              }
              return { x: dock.x, y: dock.y, allowEndInBlocked: true, repairBay: clickedRepairBay };
            }
          }

          // Ausnahme: Harvester-Dock in Raffinerie (Zeile 2 von unten, Mitte)
          if (unit.type === "harvester" && allowRefineryDock) {
            // Try to match a refinery more leniently (clicking near or inside the building)
            const unitOwnerIndex = unit.ownerIndex !== undefined ? unit.ownerIndex : gameConfig.players.indexOf(unit.ownerData);
            const clickedRefinery = this.buildings.find((b) => {
              if (getBaseTypeId(b.name) !== "refinery") return false;
              if (b.ownerIndex !== unitOwnerIndex) return false; // Nur eigene Raffinerien erlauben Docking/Auftrag (index-basiert)
              const rect = getBuildingPixelRect(b);
              return distancePointToRect(targetX, targetY, rect) <= TILE_SIZE * 1.2;
            });

            if (clickedRefinery) {
              const dock = this.getRefineryUnloadPoint(clickedRefinery);
              return { x: dock.x, y: dock.y, allowEndInBlocked: true, refinery: clickedRefinery };
            }
          }

          const targetTile = Pathfinder.getGridPos(targetX, targetY);
          const cols = Math.floor(this.canvas.width / TILE_SIZE);
          const rows = Math.floor(this.canvas.height / TILE_SIZE);

          const hitBuilding = this.buildings.find((b) => {
            const blocked = getBuildingBlockedGridRect(b);
            return targetTile.x >= blocked.tileX && targetTile.x < blocked.tileX + blocked.widthTiles && targetTile.y >= blocked.tileY && targetTile.y < blocked.tileY + blocked.heightTiles;
          });

          if (!hitBuilding) {
            return { x: targetX, y: targetY, allowEndInBlocked: false, refinery: null };
          }

          // If the hit building is a refinery, return the dock position so harvesters get proper behaviour (nur wenn eigene Raffinerie)
          const unitOwnerIdx = unit.ownerIndex !== undefined ? unit.ownerIndex : gameConfig.players.indexOf(unit.ownerData);
          if (getBaseTypeId(hitBuilding.name) === "refinery" && hitBuilding.ownerIndex === unitOwnerIdx) {
            const dock = this.getRefineryUnloadPoint(hitBuilding);
            return { x: dock.x, y: dock.y, allowEndInBlocked: true, refinery: hitBuilding };
          }

          const full = getBuildingGridRect(hitBuilding);
          const candidates = [];

          const pushCandidate = (tx, ty) => {
            if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;
            if (this.isTileBlockedByBuildingBody(tx, ty)) return;
            candidates.push({
              tx,
              ty,
              x: tx * TILE_SIZE + TILE_SIZE / 2,
              y: ty * TILE_SIZE + TILE_SIZE / 2,
            });
          };

          // Bib-Reihe (unterste Reihe des Footprints)
          const bibY = full.tileY + full.heightTiles - 1;
          for (let tx = full.tileX; tx < full.tileX + full.widthTiles; tx++) {
            pushCandidate(tx, bibY);
          }

          // Außenring um den Footprint
          for (let tx = full.tileX - 1; tx <= full.tileX + full.widthTiles; tx++) {
            for (let ty = full.tileY - 1; ty <= full.tileY + full.heightTiles; ty++) {
              const outside = tx < full.tileX || tx >= full.tileX + full.widthTiles || ty < full.tileY || ty >= full.tileY + full.heightTiles;
              if (outside) pushCandidate(tx, ty);
            }
          }

          if (candidates.length === 0) {
            return { x: targetX, y: targetY, allowEndInBlocked: false, refinery: null };
          }

          candidates.sort((a, b) => Math.hypot(a.x - targetX, a.y - targetY) - Math.hypot(b.x - targetX, b.y - targetY));
          const best = candidates[0];
          return { x: best.x, y: best.y, allowEndInBlocked: false, refinery: null };
        }

        getPlacementAt(mouseX, mouseY, buildingType) {
          const widthTiles = buildingType.widthTiles || 1;
          const heightTiles = buildingType.heightTiles || 1;

          const cols = Math.floor(this.canvas.width / TILE_SIZE);
          const rows = Math.floor(this.canvas.height / TILE_SIZE);

          let tileX = Math.floor(mouseX / TILE_SIZE) - Math.floor(widthTiles / 2);
          let tileY = Math.floor(mouseY / TILE_SIZE) - Math.floor(heightTiles / 2);

          tileX = Math.max(0, Math.min(cols - widthTiles, tileX));
          tileY = Math.max(0, Math.min(rows - heightTiles, tileY));

          return { tileX, tileY, widthTiles, heightTiles };
        }

        isPlacementFree(placement, options = {}) {
          const ignoreUnits = options.ignoreUnits || [];
          const buildingType = options.buildingType || null;
          const placingOwnerIndex = options.ownerIndex !== undefined ? options.ownerIndex : null;

          // Check for overlap with existing buildings
          for (const building of this.buildings) {
            const existing = getBuildingGridRect(building);
            const overlapX = placement.tileX < existing.tileX + existing.widthTiles && placement.tileX + placement.widthTiles > existing.tileX;
            const overlapY = placement.tileY < existing.tileY + existing.heightTiles && placement.tileY + placement.heightTiles > existing.tileY;
            if (overlapX && overlapY) return { free: false, reason: "building" };
          }

          // Check distance constraint for Buildings and Defense menu entries
          const buildingsMenuBaseIds = ["constructionyard", "powerplant", "barracks", "refinery", "warfactory", "radar", "helipad", "repair_bay"];
          const isDefenseType = !!(buildingType && DEFENSE_TYPES[buildingType.id]);
          if (buildingType && (buildingsMenuBaseIds.includes(getBaseTypeId(buildingType.id)) || buildingsMenuBaseIds.includes(buildingType.baseId) || isDefenseType)) {
            // Check distance to other Building menu buildings, gefiltert nach dem platzierenden Owner
            const currentTeamId = placingOwnerIndex !== null ? gameConfig.players[placingOwnerIndex].team_id : null;
            const otherBuildingsMenu = this.buildings.filter((b) => {
              const bBaseId = getBaseTypeId(b.name);
              if (!buildingsMenuBaseIds.includes(bBaseId)) return false;
              // Erlaube eigene Gebäude ODER Gebäude von Teammitgliedern
              if (placingOwnerIndex !== null && b.ownerIndex !== placingOwnerIndex) {
                if (!b.ownerData || b.ownerData.team_id !== currentTeamId) return false;
              }
              return true;
            });

            // Distanzprüfung NUR erzwingen, wenn bereits eigene Gebäude existieren.
            // Das erste Gebäude eines Spielers (z.B. Construction Yard) darf an einem freien Spawn-Punkt platziert werden.
            // Distanzprüfung NUR erzwingen, wenn bereits eigene Gebäude existieren.
            // Das erste Gebäude eines Spielers (z.B. Construction Yard) darf an einem freien Spawn-Punkt platziert werden.
            // Distanzprüfung NUR erzwingen, wenn bereits eigene Gebäude existieren.
            if (otherBuildingsMenu.length > 0) {
              let withinAllowedDistance = false;
              const isPlacingWall = buildingType && getBaseTypeId(buildingType.id) === "wall";

              // Mauern dürfen direkt an andere Mauern gebaut werden, unabhängig von der Distanz zu Hauptgebäuden
              if (isPlacingWall) {
                for (const b of this.buildings) {
                  if (getBaseTypeId(b.name) !== "wall") continue;
                  const bGrid = getBuildingGridRect(b);
                  const hGap = Math.max(0, bGrid.tileX - (placement.tileX + placement.widthTiles), placement.tileX - (bGrid.tileX + bGrid.widthTiles));
                  const vGap = Math.max(0, bGrid.tileY - (placement.tileY + placement.heightTiles), placement.tileY - (bGrid.tileY + bGrid.heightTiles));
                  if (Math.max(hGap, vGap) === 0) {
                    withinAllowedDistance = true;
                    break;
                  }
                }
              }

              if (!withinAllowedDistance) {
                for (const other of otherBuildingsMenu) {
                  const otherGrid = getBuildingGridRect(other);
                  const placementLeft = placement.tileX;
                  const placementRight = placement.tileX + placement.widthTiles - 1;
                  const placementTop = placement.tileY;
                  const placementBottom = placement.tileY + placement.heightTiles - 1;
                  const otherLeft = otherGrid.tileX;
                  const otherRight = otherGrid.tileX + otherGrid.widthTiles - 1;
                  const otherTop = otherGrid.tileY;
                  const otherBottom = otherGrid.tileY + otherGrid.heightTiles - 1;
                  let horizontalGap = Math.max(0, otherLeft - placementRight - 1, placementLeft - otherRight - 1);
                  let verticalGap = Math.max(0, otherTop - placementBottom - 1, placementTop - otherBottom - 1);
                  let minDistance = Math.max(horizontalGap, verticalGap);
                  if (minDistance <= 1) {
                    withinAllowedDistance = true;
                    break;
                  }
                }
              }

              if (!withinAllowedDistance) {
                return { free: false, reason: "distance_too_far" };
              }
            }
          }

          const placementRect = {
            x: placement.tileX * TILE_SIZE,
            y: placement.tileY * TILE_SIZE,
            width: placement.widthTiles * TILE_SIZE,
            height: placement.heightTiles * TILE_SIZE,
          };

          for (const unit of this.units) {
            if (ignoreUnits.includes(unit)) continue;
            if (distancePointToRect(unit.x, unit.y, placementRect) < unit.radius) {
              return { free: false, reason: "unit" };
            }
          }

          return { free: true, reason: null };
        }

        spawnSquad(owner, startX, startY, count) {
          for (let i = 0; i < count; i++) {
            const ox = (Math.random() - 0.5) * 50 * WORLD_SCALE;
            const oy = (Math.random() - 0.5) * 50 * WORLD_SCALE;
            this.units.push(new Entity(startX + ox, startY + oy, owner));
          }
        }

        getBuildingTypeById(id) {
          // Versuche exakte Übereinstimmung
          if (BUILDING_TYPES[id]) return BUILDING_TYPES[id];
          if (DEFENSE_TYPES[id]) return DEFENSE_TYPES[id];
          if (id === "constructionyard") return CONSTRUCTION_YARD_TYPE;

          // Versuche über baseId (für suffixed IDs wie 'powerplant_1')
          const baseId = getBaseTypeId(id);
          const foundBuilding = Object.values(BUILDING_TYPES).find((b) => b.baseId === baseId);
          if (foundBuilding) return foundBuilding;

          const foundDefense = Object.values(DEFENSE_TYPES).find((b) => b.baseId === baseId);
          if (foundDefense) return foundDefense;

          return null;
        }

        isReadyLockActive(containerId, exceptTypeId = null) {
          if (!containerId) return false;
          const container = document.getElementById(containerId);
          if (!container) return false;

          const buttons = container.querySelectorAll('.build-item[id^="btn-"]');
          for (const btn of buttons) {
            const id = btn.id.replace("btn-", "");
            const state = this.getBuildingProductionState(id);
            if (state.status === "ready" && id !== exceptTypeId) return true;
          }
          return false;
        }

        hasAnyReadyBuilding(exceptTypeId = null) {
          return Object.keys(this.buildingProductionStates).some((id) => {
            const state = this.buildingProductionStates[id];
            return state && state.status === "ready" && id !== exceptTypeId;
          });
        }

        getBuildingQueue(typeData) {
          return DEFENSE_TYPES[typeData.id] ? this.defenseProductionQueue : this.buildingProductionQueue;
        }

        getBuildingProductionCategory(typeData) {
          return DEFENSE_TYPES[typeData.id] ? "defense" : "building";
        }

        getBuildingQueueByCategory(category) {
          return category === "defense" ? this.defenseProductionQueue : this.buildingProductionQueue;
        }

        getCurrentBuildingProductionByCategory(category) {
          return category === "defense" ? this.currentDefenseProduction : this.currentBuildingProduction;
        }

        setCurrentBuildingProductionByCategory(category, production) {
          if (category === "defense") this.currentDefenseProduction = production;
          else this.currentBuildingProduction = production;
        }

        hasAnyReadyBuilding(category, exceptTypeId = null) {
          return Object.keys(this.buildingProductionStates).some((id) => {
            const typeData = this.getBuildingTypeById(id);
            if (!typeData) return false;
            if (this.getBuildingProductionCategory(typeData) !== category) return false;
            const state = this.buildingProductionStates[id];
            return state && state.status === "ready" && id !== exceptTypeId;
          });
        }

        getBuildingProductionState(id) {
          if (!this.buildingProductionStates[id]) {
            this.buildingProductionStates[id] = {
              status: "idle", // idle | building | ready
              startTime: 0,
              totalTime: this.buildingBuildTimeMs,
              progressMs: 0,
              lastTick: 0,
            };
          }
          return this.buildingProductionStates[id];
        }

        startBuildingProduction(typeData) {
          if (!this.isTypeAvailableForPlayer(typeData)) return;
          const hasReq = this.hasReqs(typeData);
          const playerAccount = this.getAccount(0);
          if (!this.buildingsUnlocked || !hasReq || !this.canAfford(typeData.cost, playerAccount)) return;

          const category = this.getBuildingProductionCategory(typeData);
          const queue = this.getBuildingQueue(typeData);

          let queueItem = queue.find((q) => q.type === typeData.id);
          if (queueItem) {
            queueItem.count++;
          } else {
            queueItem = { type: typeData.id, count: 1, cost: typeData.cost, name: typeData.name };
            queue.push(queueItem);
          }

          if (!this.spendCredits(typeData.cost, playerAccount)) {
            this.updateUI("Nicht genug Credits!");
            queueItem.count--;
            if (queueItem.count === 0) {
              const index = queue.indexOf(queueItem);
              if (index >= 0) queue.splice(index, 1);
            }
            return;
          }

          this.updateUI(`Bau angefragt: ${typeData.name}`);
          if (!this.getCurrentBuildingProductionByCategory(category) && !this.hasAnyReadyBuilding(category)) {
            this.startNextBuildingProduction(category);
          }
          this.refreshBuildingButtons();
        }

        startNextBuildingProduction(category) {
          if (this.getCurrentBuildingProductionByCategory(category)) return;
          if (this.hasAnyReadyBuilding(category)) return;

          const queue = this.getBuildingQueueByCategory(category);
          if (queue.length === 0) return;

          const job = queue[0];
          if (!job || job.count <= 0) return;

          const typeData = this.getBuildingTypeById(job.type);
          if (!typeData) return;

          const state = this.getBuildingProductionState(typeData.id);
          state.status = "building";
          state.startTime = Date.now();
          state.totalTime = typeData.time || this.buildingBuildTimeMs;
          state.progressMs = 0;
          state.lastTick = state.startTime;

          this.setCurrentBuildingProductionByCategory(category, typeData.id);
          this.updateUI(`Bau gestartet: ${typeData.name}`);
          this.refreshBuildingButtons();
        }

        cancelBuildingProduction(typeData) {
          const state = this.getBuildingProductionState(typeData.id);
          const queue = this.getBuildingQueue(typeData);
          const queueItem = queue.find((q) => q.type === typeData.id);
          const category = this.getBuildingProductionCategory(typeData);

          // Fall 1: Gebäude im Bau abbrechen
          if (state.status === "building") {
            state.status = "idle";
            state.startTime = 0;
            state.progressMs = 0;
            state.lastTick = 0;
            this.setCurrentBuildingProductionByCategory(category, null);

            if (queueItem) {
              queueItem.count--;
              if (queueItem.count <= 0) {
                const index = queue.indexOf(queueItem);
                if (index >= 0) queue.splice(index, 1);
              }
            }

            const playerAccount = this.getAccount(0);
            this.refundCredits(typeData.cost, playerAccount);
            this.updateUI(`Bau abgebrochen: ${typeData.name}`);
            if (!this.hasAnyReadyBuilding(category)) this.startNextBuildingProduction(category);
            this.refreshBuildingButtons();
            return;
          }

          // Fall 2: Gebäude fertig, aber noch nicht platziert abbrechen
          if (state.status === "ready") {
            state.status = "idle";
            state.startTime = 0;
            state.progressMs = 0;
            state.lastTick = 0;

            if (queueItem) {
              queueItem.count--;
              if (queueItem.count <= 0) {
                const index = queue.indexOf(queueItem);
                if (index >= 0) queue.splice(index, 1);
              }
            }

            const playerAccount = this.getAccount(0);
            this.refundCredits(typeData.cost, playerAccount);
            if (this.placementMode && this.buildingToPlace && this.buildingToPlace.id === typeData.id) {
              this.cancelPlacement(false);
            }
            this.setCurrentBuildingProductionByCategory(category, null);
            if (!this.hasAnyReadyBuilding(category)) this.startNextBuildingProduction(category);
            this.refreshBuildingButtons();
            return;
          }

          // Fall 3: anderes Gebäude aus der Queue abbrechen
          if (queueItem) {
            queueItem.count--;
            if (queueItem.count <= 0) {
              const index = queue.indexOf(queueItem);
              if (index >= 0) queue.splice(index, 1);
            }
            const playerAccount = this.getAccount(0);
            this.refundCredits(typeData.cost, playerAccount);
            this.updateUI(`Bau abgebrochen: ${typeData.name}`);
            this.refreshBuildingButtons();
          }
        }

        consumeReadyBuilding(typeId) {
          const state = this.getBuildingProductionState(typeId);
          if (state.status !== "ready") return;

          state.status = "idle";
          state.startTime = 0;
          state.progressMs = 0;
          state.lastTick = 0;

          const typeData = this.getBuildingTypeById(typeId);
          const category = this.getBuildingProductionCategory(typeData);
          const queue = this.getBuildingQueueByCategory(category);
          const queueItem = queue[0];
          if (queueItem && queueItem.type === typeId && queueItem.count === 0) {
            queue.shift();
          }

          this.setCurrentBuildingProductionByCategory(category, null);
          if (!this.hasAnyReadyBuilding(category)) this.startNextBuildingProduction(category);
          this.refreshBuildingButtons();
        }

        processBuildingProduction() {
          this.processBuildingProductionCategory("building");
          this.processBuildingProductionCategory("defense");
        }

        processBuildingProductionCategory(category) {
          const current = this.getCurrentBuildingProductionByCategory(category);
          if (!current) return;

          const now = Date.now();
          const state = this.getBuildingProductionState(current);
          if (state.status !== "building") return;

          const btn = this.buildingButtons[current];
          const elapsed = this.advanceProgressTimer(state, now);
          const progress = Math.min(100, (elapsed / state.totalTime) * 100);

          if (btn) {
            const bar = btn.querySelector(".progress-overlay");
            const timer = btn.querySelector(".timer-text");
            if (bar) {
              bar.style.height = `${progress}%`;
              bar.style.backgroundColor = progress < 100 ? "#ffff00" : "#00ff00";
            }
            if (timer) {
              const remainingWork = Math.max(0, state.totalTime - elapsed);
              const speedMult = this.getProductionSpeedFactor(0); // Human-Player Index 0
              const remainingSec = Math.ceil(remainingWork / speedMult / 1000);
              timer.innerText = remainingSec > 0 ? `${remainingSec}s` : "READY";
            }
          }

          if (progress >= 100) {
            state.status = "ready";
            state.startTime = 0;
            state.progressMs = state.totalTime;
            state.lastTick = 0;
            const queue = this.getBuildingQueueByCategory(category);
            const queueItem = queue[0];
            if (queueItem && queueItem.type === current) {
              queueItem.count--;
            }
            const typeData = this.getBuildingTypeById(current);
            this.updateUI(`Bau bereit: ${typeData ? typeData.name : current}`);
            this.refreshBuildingButtons();
            this.updateProductionTabs();
          }
        }

        getProductionSpeedFactor(playerIndex = 0) {
          const acc = this.accounts[playerIndex];
          // Energie-Defizit verlangsamt Produktion um Faktor 3 (1/3 Geschwindigkeit)
          const energyFactor = acc && acc.energyBalance < 0 ? 1 / 3 : 1;
          return energyFactor / gameConfig.players[playerIndex].productionFactor;
        }

        advanceProgressTimer(state, now) {
          if (!state.lastTick) state.lastTick = now;
          const delta = Math.max(0, now - state.lastTick);
          state.lastTick = now;
          state.progressMs = Math.min(state.totalTime, state.progressMs + delta * this.getProductionSpeedFactor());
          return state.progressMs;
        }

        updateBuildingButtonVisual(typeData, btn) {
          if (!btn || !typeData) return;
          const available = this.isTypeAvailableForPlayer(typeData);
          btn.style.display = available ? "" : "none";
          if (!available) return;

          const state = this.getBuildingProductionState(typeData.id);
          const hasReq = this.hasReqs(typeData);
          const bar = btn.querySelector(".progress-overlay");
          const timer = btn.querySelector(".timer-text");
          const containerId = btn.parentElement ? btn.parentElement.id : null;
          const readyLock = this.isReadyLockActive(containerId, typeData.id);

          btn.classList.remove("disabled");
          btn.classList.remove("ready");

          if (!this.buildingsUnlocked || !hasReq) {
            btn.classList.add("disabled");
          }

          const queue = this.getBuildingQueue(typeData);
          const queueItem = queue.find((q) => q.type === typeData.id);
          const count = queueItem ? queueItem.count : state.status === "ready" ? 0 : null;
          const countEl = btn.querySelector(".count-text");
          if (countEl) {
            if (count === null) {
              countEl.style.display = "none";
            } else {
              countEl.style.display = "";
              countEl.innerText = String(count);
            }
          }

          if (state.status === "idle") {
            if (bar) bar.style.height = "0%";
            if (timer) timer.innerText = "";
            if (!this.canAfford(typeData.cost) || !this.buildingsUnlocked || !hasReq) btn.classList.add("disabled");
          } else if (state.status === "building") {
            btn.classList.remove("disabled");
          } else if (state.status === "ready") {
            btn.classList.add("ready");
            if (bar) {
              bar.style.height = "0%";
            }
            if (timer) timer.innerText = "";
          }
        }

        refreshBuildingButtons() {
          Object.entries(this.buildingButtons).forEach(([id, btn]) => {
            const typeData = this.getBuildingTypeById(id);
            if (typeData) this.updateBuildingButtonVisual(typeData, btn);
          });
        }

        getUnitProductionQueue(typeData) {
          if (typeData.type === "infantry") return this.productionQueueInfantry;
          if (typeData.type === "aircraft") return this.productionQueueAircraft;
          return this.productionQueueVehicle;
        }

        getCurrentUnitProduction(typeData) {
          if (typeData.type === "infantry") return this.currentProductionInfantry;
          if (typeData.type === "aircraft") return this.currentProductionAircraft;
          return this.currentProductionVehicle;
        }

        setCurrentUnitProduction(typeData, production) {
          if (typeData.type === "infantry") {
            this.currentProductionInfantry = production;
          } else if (typeData.type === "aircraft") {
            this.currentProductionAircraft = production;
          } else {
            this.currentProductionVehicle = production;
          }
        }

        getProductionQueueByCategory(category) {
          if (category === "infantry") return this.productionQueueInfantry;
          if (category === "aircraft") return this.productionQueueAircraft;
          return this.productionQueueVehicle;
        }

        getCurrentProductionByCategory(category) {
          if (category === "infantry") return this.currentProductionInfantry;
          if (category === "aircraft") return this.currentProductionAircraft;
          return this.currentProductionVehicle;
        }

        setCurrentProductionByCategory(category, production) {
          if (category === "infantry") this.currentProductionInfantry = production;
          else if (category === "aircraft") this.currentProductionAircraft = production;
          else this.currentProductionVehicle = production;
        }

        getUnitQueue(typeData) {
          if (typeData.type === "infantry") return this.productionQueueInfantry;
          if (typeData.type === "aircraft") return this.productionQueueAircraft;
          return this.productionQueueVehicle;
        }

        getCurrentUnitProductionCategory(typeData) {
          if (typeData.type === "infantry") return "infantry";
          if (typeData.type === "aircraft") return "aircraft";
          return "vehicle";
        }

        refreshUnitButtons() {
          Object.entries(this.unitButtons).forEach(([id, btn]) => {
            const typeData = UNIT_TYPES[id];
            if (!typeData || !btn) return;

            const available = this.isTypeAvailableForPlayer(typeData);
            btn.style.display = available ? "" : "none";
            if (!available) return;

            const queueItem = this.getUnitProductionQueue(typeData).find((q) => q.type === id);
            const count = queueItem ? queueItem.count : 0;

            const iconBox = btn.querySelector(".icon-box");
            let countEl = iconBox ? iconBox.querySelector(".count-text") : null;
            if (!countEl && iconBox) {
              countEl = document.createElement("div");
              countEl.className = "count-text";
              iconBox.appendChild(countEl);
            }
            if (countEl) {
              if (count > 0) {
                countEl.style.display = "";
                countEl.innerText = String(count);
              } else {
                countEl.style.display = "none";
              }
            }

            btn.classList.remove("disabled");
            if (!this.canAfford(typeData.cost)) {
              btn.classList.add("disabled");
            }
          });
        }

        cancelUnitProduction(unitType) {
          const playerAccount = this.getAccount(0);
          const queue = this.getUnitQueue(unitType);
          const queueItem = queue.find((q) => q.type === unitType.id);
          if (!queueItem || queueItem.count === 0) return;

          queueItem.count--;
          this.refundCredits(unitType.cost, playerAccount);
          const creditsInfo = document.getElementById("credits-info");
          if (creditsInfo) creditsInfo.innerText = this.getAccount(0).credits;

          const category = this.getCurrentUnitProductionCategory(unitType);
          const currentProduction = this.getCurrentProductionByCategory(category);
          if (queueItem.count === 0) {
            const index = queue.indexOf(queueItem);
            if (index >= 0) queue.splice(index, 1);

            if (currentProduction && currentProduction.type === unitType.id) {
              this.setCurrentProductionByCategory(category, null);
              const btn = this.unitButtons[unitType.id];
              if (btn) {
                const bar = btn.querySelector(".progress-overlay");
                const timer = btn.querySelector(".timer-text");
                if (bar) bar.style.height = "0%";
                if (timer) timer.innerText = "";
              }
              if (queue.length > 0) {
                this.startNextProduction(category);
              }
            }
          }

          this.updateUI(`Produktion abgebrochen: ${unitType.name}`);
          this.refreshBuildingButtons();
          this.refreshUnitButtons();
        }

        startProduction(unitType, btn) {
          if (!this.isTypeAvailableForPlayer(unitType)) {
            this.updateUI("Einheit nicht verfügbar.");
            return;
          }

          const playerAccount = this.getAccount(0);
          const queue = this.getUnitQueue(unitType);
          let queueItem = queue.find((q) => q.type === unitType.id);
          if (queueItem) {
            queueItem.count++;
          } else {
            queueItem = { type: unitType.id, count: 1, cost: unitType.cost, name: unitType.name };
            queue.push(queueItem);
          }

          if (!this.spendCredits(unitType.cost, playerAccount)) {
            this.updateUI("Nicht genug Credits!");
            queueItem.count--;
            if (queueItem.count === 0) {
              const index = queue.indexOf(queueItem);
              if (index >= 0) queue.splice(index, 1);
            }
            return;
          }

          const creditsInfo = document.getElementById("credits-info");
          if (creditsInfo) creditsInfo.innerText = this.getAccount(0).credits;

          const category = this.getCurrentUnitProductionCategory(unitType);
          if (!this.getCurrentProductionByCategory(category)) {
            this.startNextProduction(category);
          }

          this.refreshUnitButtons();
        }

        startNextProduction(category) {
          const queue = this.getProductionQueueByCategory(category);
          if (queue.length === 0) {
            this.setCurrentProductionByCategory(category, null);
            return;
          }

          const job = queue[0];
          const baseTime = UNIT_TYPES[job.type].time || 5000;
          const buildingCount = this.getBuildingCountForProductionCategory(category);
          const speedUp = this.getProductionSpeedUpByBuildingCount(buildingCount);
          const adjustedTime = Math.max(1, Math.floor(baseTime / speedUp));

          this.setCurrentProductionByCategory(category, {
            type: job.type,
            progressMs: 0,
            totalTime: adjustedTime,
            lastTick: Date.now(),
            _productionSpeedUp: speedUp,
            _productionBuildingCount: buildingCount,
          });

          const btn = this.unitButtons[job.type];
          if (btn) {
            const bar = btn.querySelector(".progress-overlay");
            const timer = btn.querySelector(".timer-text");
            if (bar) bar.style.height = "0%";
            if (timer) timer.innerText = "";
          }
        }

        processProduction() {
          this.processUnitProduction("infantry");
          this.processUnitProduction("vehicle");
          this.processUnitProduction("aircraft");
        }

        processUnitProduction(category) {
          const prod = this.getCurrentProductionByCategory(category);
          if (!prod) return;

          const now = Date.now();
          if (!prod.lastTick) prod.lastTick = now;
          const delta = Math.max(0, now - prod.lastTick);
          prod.lastTick = now;
          const speedMult = this.getProductionSpeedFactor(0); // Human-Player Index 0
          prod.progressMs = Math.min(prod.totalTime, prod.progressMs + delta * speedMult);
          const elapsed = prod.progressMs;
          const progress = Math.min(100, (elapsed / prod.totalTime) * 100);

          Object.entries(this.unitButtons).forEach(([id, btn]) => {
            if (id === prod.type) {
              const bar = btn.querySelector(".progress-overlay");
              const timer = btn.querySelector(".timer-text");
              if (bar) {
                bar.style.height = `${progress}%`;
                bar.style.backgroundColor = progress < 100 ? "#ffff00" : "#00ff00";
              }
              if (timer) {
                const remainingWork = Math.max(0, prod.totalTime - elapsed);
                const speedMult = this.getProductionSpeedFactor(0); // Human-Player Index 0
                const remainingSec = Math.ceil(remainingWork / speedMult / 1000);
                timer.innerText = remainingSec > 0 ? remainingSec + "s" : "";
              }
            }
          });

          if (progress >= 100) {
            this.completeProduction(category);
          }
        }

        // Anzahl relevanter Produktionsgebäude für eine Kategorie zählen
        getBuildingCountForProductionCategory(category) {
          let baseId = null;
          if (category === "infantry") baseId = "barracks";
          else if (category === "vehicle") baseId = "warfactory";
          else if (category === "aircraft") baseId = "helipad";
          if (!baseId) return 0;

          return this.buildings.filter((b) => getBaseTypeId(b.name) === baseId && b.ownerIndex === 0).length;
        }

        // Lookup-Tabelle für Speed-Up basierend auf Gebäudeanzahl
        getProductionSpeedUpByBuildingCount(count) {
          if (!count || count < 1) return 1;
          const table = [1, 1, 1.33, 1.58, 1.78, 1.95, 2.09]; // index = count (clamped at 6)
          const idx = Math.min(count, 6);
          return table[idx] || 1;
        }

        completeProduction(category) {
          const prod = this.getCurrentProductionByCategory(category);
          if (!prod) return;

          this.spawnUnit(0, prod.type);

          const queue = this.getProductionQueueByCategory(category);
          const queueItem = queue[0];
          if (!queueItem) return;

          queueItem.count--;
          const btn = this.unitButtons[prod.type];
          if (btn) {
            const bar = btn.querySelector(".progress-overlay");
            const timer = btn.querySelector(".timer-text");
            if (bar) {
              bar.style.height = "0%";
              bar.style.backgroundColor = "#666";
            }
            if (timer) timer.innerText = "";
          }

          if (queueItem.count === 0) {
            queue.shift();
            this.setCurrentProductionByCategory(category, null);
            if (queue.length > 0) {
              this.startNextProduction(category);
            }
          } else {
            this.startNextProduction(category);
          }

          this.updateUI(`Produktion abgeschlossen: ${UNIT_TYPES[prod.type].name}`);
          this.refreshBuildingButtons();
          this.refreshUnitButtons();
        }

        // --- SIDEBAR & PRODUCTION LOGIC ---

        initSidebar() {
          this.buildingButtons = {};
          this.unitButtons = {};

          // Buildings Grid
          const gridB = document.getElementById("grid-buildings");
          const gridDefense = document.getElementById("grid-defense");
          const gridInfantry = document.getElementById("grid-infantry");
          const gridVehicles = document.getElementById("grid-vehicles");
          const gridAircraft = document.getElementById("grid-aircraft");

          if (!this.buildMenuHoverListenersAttached) {
            const sidebar = document.getElementById("sidebar");
            if (sidebar) {
              sidebar.addEventListener("mouseenter", () => {
                this.isHoveringBuildMenu = true;
                this.updateCursorState();
              });
              sidebar.addEventListener("mouseleave", () => {
                this.isHoveringBuildMenu = false;
                this.updateCursorState();
              });
              this.buildMenuHoverListenersAttached = true;
            }
          }

          gridB.innerHTML = "";
          if (gridDefense) gridDefense.innerHTML = "";
          if (gridInfantry) gridInfantry.innerHTML = "";
          if (gridVehicles) gridVehicles.innerHTML = "";
          if (gridAircraft) gridAircraft.innerHTML = "";

          // Nur eigene Fraktions-Gebäude ins UI-Menü übernehmen
          for (const key in BUILDING_TYPES) {
            const typeData = BUILDING_TYPES[key];
            if (!this.isTypeAvailableForPlayer(typeData)) continue;
            this.createBuildButton(typeData, gridB, true);
          }

          // Verteidigungsgebäude nur anzeigen, wenn Construction Yard existiert
          if (gridDefense) {
            for (const key in DEFENSE_TYPES) {
              const typeData = DEFENSE_TYPES[key];
              if (!this.isTypeAvailableForPlayer(typeData)) continue;
              this.createBuildButton(typeData, gridDefense, true);
            }
          }

          // Infantry/Vehicles Grids basierend auf Status aktualisieren
          this.updateProductionTabs();
        }

        cancelAllProductionForCategory(category) {
          const queue = this.getProductionQueueByCategory(category);
          const playerAccount = this.getAccount(0);

          for (const item of queue) {
            const unitData = UNIT_TYPES[item.type];
            if (unitData) {
              this.refundCredits(unitData.cost * item.count, playerAccount);
            }
          }
          queue.length = 0;

          const currentProd = this.getCurrentProductionByCategory(category);
          if (currentProd) {
            const unitData = UNIT_TYPES[currentProd.type];
            if (unitData) {
              this.refundCredits(unitData.cost, playerAccount);
            }
            this.setCurrentProductionByCategory(category, null);
          }

          this.updateUI(`Produktion gestoppt: ${category}`);
          this.refreshUnitButtons();
        }

        updateProductionTabs() {
          const hasConstructionYard = this.hasBuildingType("constructionyard");
          this.buildingsUnlocked = hasConstructionYard;

          const btnBuildings = document.getElementById("btn-buildings");
          if (btnBuildings) {
            if (hasConstructionYard) btnBuildings.classList.remove("disabled");
            else btnBuildings.classList.add("disabled");
          }

          const hasBarracks = this.hasBuildingType("barracks");
          const hasWarFactory = this.hasBuildingType("warfactory");
          const hasHelipad = this.hasBuildingType("helipad");

          if (!hasBarracks && this.currentTab === "infantry") this.switchTab("buildings");
          if (!hasWarFactory && this.currentTab === "vehicles") this.switchTab("buildings");
          if (!hasHelipad && this.currentTab === "aircraft") this.switchTab("buildings");

          const btnDefense = document.getElementById("btn-defense");
          const msgDefense = document.getElementById("defense-msg");
          const gridDefense = document.getElementById("grid-defense");

          if (hasConstructionYard) {
            btnDefense.classList.remove("disabled");
            gridDefense.style.display = "grid";
            msgDefense.style.display = "none";

            if (gridDefense.children.length === 0) {
              for (const typeData of Object.values(DEFENSE_TYPES)) {
                this.createBuildButton(typeData, gridDefense, true);
              }
            }
          } else {
            btnDefense.classList.add("disabled");
            msgDefense.style.display = "none";
            gridDefense.style.display = "none";
          }

          const btnInfantry = document.getElementById("btn-infantry");
          const msgInfantry = document.getElementById("infantry-msg");
          const gridInfantry = document.getElementById("grid-infantry");

          if (hasBarracks) {
            btnInfantry.classList.remove("disabled");
            msgInfantry.style.display = "none";
            gridInfantry.style.display = "grid";
            if (gridInfantry.children.length === 0) {
              for (const typeData of Object.values(UNIT_TYPES)) {
                if (typeData.type === "infantry" && this.isTypeAvailableForPlayer(typeData)) {
                  this.createBuildButton(typeData, gridInfantry, false);
                }
              }
            }
          } else {
            btnInfantry.classList.add("disabled");
            msgInfantry.style.display = "block";
            gridInfantry.style.display = "none";
          }

          const btnVehicles = document.getElementById("btn-vehicles");
          const msgVehicle = document.getElementById("vehicle-msg");
          const gridVehicles = document.getElementById("grid-vehicles");
          const btnAircraft = document.getElementById("btn-aircraft");
          const msgAircraft = document.getElementById("aircraft-msg");
          const gridAircraft = document.getElementById("grid-aircraft");

          if (hasWarFactory) {
            btnVehicles.classList.remove("disabled");
            msgVehicle.style.display = "none";
            gridVehicles.style.display = "grid";
            if (gridVehicles.children.length === 0) {
              for (const typeData of Object.values(UNIT_TYPES)) {
                if ((typeData.type === "vehicle" || typeData.type === "harvester") && this.isTypeAvailableForPlayer(typeData)) {
                  this.createBuildButton(typeData, gridVehicles, false);
                }
              }
            }
          } else {
            btnVehicles.classList.add("disabled");
            msgVehicle.style.display = "block";
            gridVehicles.style.display = "none";
          }

          if (btnAircraft) {
            if (hasHelipad) {
              btnAircraft.classList.remove("disabled");
              if (msgAircraft) msgAircraft.style.display = "none";
              if (gridAircraft) gridAircraft.style.display = "grid";
              if (gridAircraft.children.length === 0) {
                for (const typeData of Object.values(UNIT_TYPES)) {
                  if (typeData.type === "aircraft" && this.isTypeAvailableForPlayer(typeData)) {
                    this.createBuildButton(typeData, gridAircraft, false);
                  }
                }
              }
            } else {
              btnAircraft.classList.add("disabled");
              if (msgAircraft) msgAircraft.style.display = "block";
              if (gridAircraft) gridAircraft.style.display = "none";
            }
          }
          if (hasHelipad) {
            if (msgAircraft) msgAircraft.style.display = "none";
            if (gridAircraft) gridAircraft.style.display = "grid";
          } else {
            if (msgAircraft) msgAircraft.style.display = "block";
            if (gridAircraft) gridAircraft.style.display = "none";
          }

          this.refreshBuildingButtons();
          this.refreshUnitButtons();
        }

        createBuildButton(typeData, container, isBuilding) {
          const btn = document.createElement("div");
          btn.className = "build-item";
          btn.id = `btn-${typeData.id}`;
          btn.title = typeData.name;

          // Icon Box
          const iconBox = document.createElement("div");
          iconBox.className = "icon-box unit-icon";
          if (isBuilding && typeData.color) {
            iconBox.style.backgroundColor = getBaseTypeId(typeData.id) === "powerplant" ? "#5f4f00" : typeData.color;
            iconBox.innerText = typeData.icon;
          } else {
            iconBox.innerText = typeData.icon || "?";
            // Standardfarbe für Einheiten
            iconBox.style.background = "#555";
            iconBox.style.color = "#fff";
          }

          const label = document.createElement("span");
          label.className = "cost-label";
          label.innerText = `$${typeData.cost}`;

          const countEl = document.createElement("div");
          countEl.className = "count-text";
          countEl.innerText = "";
          iconBox.appendChild(countEl);

          btn.appendChild(iconBox);
          btn.appendChild(label);

          const progBar = document.createElement("div");
          progBar.className = "progress-overlay";
          progBar.style.height = "0%";
          btn.appendChild(progBar);

          const timerTxt = document.createElement("div");
          timerTxt.className = "timer-text";
          timerTxt.innerText = "";
          btn.appendChild(timerTxt);

          // Klick Handler
          if (isBuilding) {
            this.getBuildingProductionState(typeData.id);
            this.buildingButtons[typeData.id] = btn;

            btn.onclick = (e) => {
              if (e.target.classList.contains("count-text") && e.target.innerText !== "") {
                this.cancelBuildingProduction(typeData);
                return;
              }

              const state = this.getBuildingProductionState(typeData.id);

              if (state.status === "ready") {
                this.startPlacement(typeData);
                return;
              }

              this.startBuildingProduction(typeData);
            };

            btn.oncontextmenu = (e) => {
              e.preventDefault();
              this.cancelBuildingProduction(typeData);
            };

            this.updateBuildingButtonVisual(typeData, btn);
          } else {
            // Einheit produzieren
            btn.onclick = (e) => {
              if (e.target.classList.contains("count-text") && e.target.innerText) {
                this.cancelUnitProduction(typeData);
              } else {
                this.startProduction(typeData, btn);
              }
            };
            this.unitButtons[typeData.id] = btn;
            this.refreshUnitButtons();
          }

          container.appendChild(btn);
        }

        cancelUnitProduction(unitType) {
          const queue = this.getUnitQueue(unitType);
          const queueItem = queue.find((q) => q.type === unitType.id);
          if (!queueItem || queueItem.count === 0) return;

          const playerAccount = this.getAccount(0);
          queueItem.count--;
          this.refundCredits(unitType.cost, playerAccount);
          const creditsInfo = document.getElementById("credits-info");
          if (creditsInfo) creditsInfo.innerText = this.getAccount(0).credits;

          const category = this.getCurrentUnitProductionCategory(unitType);
          const currentProduction = this.getCurrentProductionByCategory(category);

          if (queueItem.count === 0) {
            const index = queue.indexOf(queueItem);
            if (index >= 0) queue.splice(index, 1);

            if (currentProduction && currentProduction.type === unitType.id) {
              this.setCurrentProductionByCategory(category, null);
              const btn = this.unitButtons[unitType.id];
              if (btn) {
                const bar = btn.querySelector(".progress-overlay");
                const timer = btn.querySelector(".timer-text");
                if (bar) bar.style.height = "0%";
                if (timer) timer.innerText = "";
              }
              if (queue.length > 0) {
                this.startNextProduction(category);
              }
            }
          }

          this.updateUI(`Produktion abgebrochen: ${unitType.name}`);
          this.refreshBuildingButtons();
          this.refreshUnitButtons();
        }

        startProduction(unitType, btn) {
          if (!this.isTypeAvailableForPlayer(unitType)) {
            this.updateUI("Einheit nicht verfügbar.");
            return;
          }

          const playerAccount = this.getAccount(0);
          const queue = this.getUnitQueue(unitType);
          let queueItem = queue.find((q) => q.type === unitType.id);
          if (queueItem) {
            queueItem.count++;
          } else {
            queueItem = { type: unitType.id, count: 1, cost: unitType.cost, name: unitType.name };
            queue.push(queueItem);
          }

          if (!this.spendCredits(unitType.cost, playerAccount)) {
            this.updateUI("Nicht genug Credits!");
            queueItem.count--;
            if (queueItem.count === 0) {
              const index = queue.indexOf(queueItem);
              if (index >= 0) queue.splice(index, 1);
            }
            return;
          }

          const creditsInfo = document.getElementById("credits-info");
          if (creditsInfo) creditsInfo.innerText = this.getAccount(0).credits;

          const category = this.getCurrentUnitProductionCategory(unitType);
          if (!this.getCurrentProductionByCategory(category)) {
            this.startNextProduction(category);
          }

          this.refreshUnitButtons();
        }

        startNextProduction(category) {
          const queue = this.getProductionQueueByCategory(category);
          if (queue.length === 0) {
            this.setCurrentProductionByCategory(category, null);
            return;
          }

          const job = queue[0];
          const baseTime = UNIT_TYPES[job.type].time || 5000;
          const buildingCount = this.getBuildingCountForProductionCategory(category);
          const speedUp = this.getProductionSpeedUpByBuildingCount(buildingCount);
          const adjustedTime = Math.max(1, Math.floor(baseTime / speedUp));

          this.setCurrentProductionByCategory(category, {
            type: job.type,
            progressMs: 0,
            totalTime: adjustedTime,
            lastTick: Date.now(),
            _productionSpeedUp: speedUp,
            _productionBuildingCount: buildingCount,
          });

          const btn = this.unitButtons[job.type];
          if (btn) {
            const bar = btn.querySelector(".progress-overlay");
            const timer = btn.querySelector(".timer-text");
            if (bar) bar.style.height = "0%";
            if (timer) timer.innerText = "";
          }
        }

        processProduction() {
          this.processUnitProduction("infantry");
          this.processUnitProduction("vehicle");
          this.processUnitProduction("aircraft");
        }

        processUnitProduction(category) {
          const prod = this.getCurrentProductionByCategory(category);
          if (!prod) return;

          const now = Date.now();
          if (!prod.lastTick) prod.lastTick = now;
          const delta = Math.max(0, now - prod.lastTick);
          prod.lastTick = now;
          const speedMult = this.getProductionSpeedFactor(0); // Human-Player Index 0
          prod.progressMs = Math.min(prod.totalTime, prod.progressMs + delta * speedMult);
          const elapsed = prod.progressMs;
          const progress = Math.min(100, (elapsed / prod.totalTime) * 100);

          Object.entries(this.unitButtons).forEach(([id, btn]) => {
            if (id === prod.type) {
              const bar = btn.querySelector(".progress-overlay");
              const timer = btn.querySelector(".timer-text");
              if (bar) {
                bar.style.height = `${progress}%`;
                bar.style.backgroundColor = progress < 100 ? "#ffff00" : "#00ff00";
              }
              if (timer) {
                const remainingWork = Math.max(0, prod.totalTime - elapsed);
                const speedMult = this.getProductionSpeedFactor(0); // Human-Player Index 0
                const remainingSec = Math.ceil(remainingWork / speedMult / 1000);
                timer.innerText = remainingSec > 0 ? remainingSec + "s" : "";
              }
            }
          });

          if (progress >= 100) {
            this.completeProduction(category);
          }
        }

        spawnUnit(ownerIndex, unitId) {
          const baseId = getBaseTypeId(unitId);
          // Finde passendes Gebäude für Spawn-Punkt (index-basiert)
          let spawner = null;

          if (baseId === "rifleman") {
            // WICHTIG: Filtere index-basiert nach dem Eigentümer!
            spawner = this.buildings.find((b) => getBaseTypeId(b.name) === "barracks" && b.ownerIndex === ownerIndex);
          } else if (baseId === "tank" || baseId === "harvester" || baseId === "mobile_flak" || baseId === "mcv") {
            spawner = this.buildings.find((b) => getBaseTypeId(b.name) === "warfactory" && b.ownerIndex === ownerIndex);
          } else if (baseId === "helicopter") {
            spawner = this.buildings.find((b) => getBaseTypeId(b.name) === "helipad" && b.ownerIndex === ownerIndex);
          }

          let spawnX, spawnY;

          if (spawner) {
            const spawnerRect = getBuildingPixelRect(spawner);
            const bodyRect = getBuildingBodyPixelRect(spawner);
            const offset = (Math.random() - 0.5) * (spawnerRect.width * 0.45);
            spawnX = spawnerRect.x + spawnerRect.width / 2 + offset;

            if (baseId === "helicopter") {
              // Helicopter spawnt auf der Betonfläche VOR dem Helipad (westlich)
              spawnX = spawnerRect.x - spawnerRect.width / 2;
              spawnY = spawnerRect.y + spawnerRect.height / 2;
            } else if (bodyRect.bibHeight > 0) {
              spawnY = bodyRect.bibY + bodyRect.bibHeight / 2;
            } else {
              spawnY = spawnerRect.y + spawnerRect.height / 2;
            }
          } else {
            // Fallback sollte noch kein Gebäude da sein (sollte aber im Spielablauf nicht passieren)
            spawnX = 100;
            spawnY = window.innerHeight - 100;
          }

          if (baseId === "rifleman") {
            this.pushBarracksBlockingInfantry(spawnX, spawnY);

            const spawnTile = Pathfinder.getGridPos(spawnX, spawnY);
            const occupancy = this.getInfantryTileOccupancy();
            const slotTile = this.findNearestTileWithCapacity(spawnTile.x, spawnTile.y, 1, occupancy);
            if (slotTile) {
              const center = this.getTileCenter(slotTile.tx, slotTile.ty);
              spawnX = center.x;
              spawnY = center.y;
            }
          }

          // Verwende die volle unitId für Unit-Eigenschaften, damit typ korrekt gelesen werden kann
          const unit = new Entity(spawnX, spawnY, gameConfig.players[ownerIndex], unitId);

          // Einheiten kurzzeitig "bewegen" damit sie den Platz einnehmen
          unit.x += (Math.random() - 0.5) * 10 * WORLD_SCALE;

          this.units.push(unit);
        }

        switchTab(tabName) {
          // Alten Tab ausblenden
          document.querySelectorAll(".build-menu-container").forEach((el) => el.classList.remove("active"));
          document.querySelectorAll(".tab-icon").forEach((el) => el.classList.remove("active"));

          // Neuen Tab aktivieren
          const targetMenu = document.getElementById(`menu-${tabName}`);
          if (targetMenu) {
            targetMenu.classList.add("active");

            // Icon Highlighten
            const icons = document.querySelectorAll(".tab-icon");
            for (let icon of icons) {
              if (icon.title.toLowerCase() === tabName || (tabName === "buildings" && icon.innerText === "🏠")) {
                icon.classList.add("active");
              }
            }
          }

          this.currentTab = tabName;
        }

        // --- GEBÄUDE PLATZIERUNG ---

        startPlacement(buildingType) {
          if (this.sellMode) this.setSellMode(false);

          if (!this.buildingsUnlocked) {
            this.updateUI("Buildings gesperrt: MCV anklicken und auf Spielfeld aufbauen.");
            return;
          }

          if (!this.hasReqs(buildingType)) {
            this.updateUI(`Voraussetzung fehlt für ${buildingType.name}.`);
            return;
          }

          const state = this.getBuildingProductionState(buildingType.id);
          if (state.status !== "ready") {
            this.updateUI(`Nicht bereit: ${buildingType.name}`);
            return;
          }

          if (this.buildingToPlace && this.buildingToPlace.id === buildingType.id) {
            this.cancelPlacement();
            return;
          }

          this.placementMode = true;
          this.buildingToPlace = buildingType;

          document.querySelectorAll(".build-item").forEach((b) => b.classList.remove("placing"));
          // Wir müssen das Element finden, aber da es dynamisch ist, nutzen wir einfach den Cursor

          this.updateCursorState();
          this.updateUI(`Platziere: ${buildingType.name} (${buildingType.widthTiles}x${buildingType.heightTiles})`);
        }

        cancelPlacement(keepReady = true) {
          this.placementMode = false;
          const canceled = this.buildingToPlace;
          this.buildingToPlace = null;
          this.updateCursorState();
          document.querySelectorAll(".build-item").forEach((b) => b.classList.remove("placing"));
          if (keepReady && canceled) {
            const state = this.getBuildingProductionState(canceled.id);
            if (state.status === "ready") {
              this.updateUI(`Bereit bleibt: ${canceled.name}`);
              return;
            }
          }
          this.updateUI(null);
        }

        updateUI(data) {
          const logContainer = document.getElementById("debug-log-container");
          if (!logContainer) return;

          // Nur Text-Strings verarbeiten, null/undefined werden ignoriert (spart UI-Flackern)
          if (!data) return;

          const line = document.createElement("div");
          line.className = "debug-line";
          line.textContent = data;
          logContainer.appendChild(line);

          // Auf maximal 50 Einträge begrenzen (älteste werden entfernt)
          while (logContainer.children.length > 50) {
            logContainer.removeChild(logContainer.firstChild);
          }

          // Automatisch zum Ende scrollen, damit die neueste Nachricht sichtbar bleibt
          logContainer.scrollTop = logContainer.scrollHeight;

          // Credits Update
          const creditsInfo = document.getElementById("credits-info");
          if (creditsInfo) creditsInfo.innerText = this.getAccount(0).credits;
          this.refreshBuildingButtons();
          this.refreshUnitButtons();
        }

        // --- INTERAKTION ---

        handleRightClick(x, y) {
          if (this.placementMode && this.buildingToPlace) {
            const placement = this.getPlacementAt(x, y, this.buildingToPlace);
            const canBuild = this.isPlacementFree(placement, { buildingType: this.buildingToPlace, ownerIndex: 0 });
            const state = this.getBuildingProductionState(this.buildingToPlace.id);

            if (canBuild.free && state.status === "ready") {
              this.buildStructure(placement);
              this.consumeReadyBuilding(this.buildingToPlace.id);
              this.cancelPlacement(false);
              this.initSidebar();
            } else {
              if (canBuild.reason === "distance_too_far") {
                this.updateUI("Zu weit vom nächsten Gebäude entfernt.");
              } else {
                this.updateUI(canBuild.free ? "Nicht bereit." : "Baufeld blockiert.");
              }
            }
            return;
          }

          if (this.tryDeployMCV(x, y)) return;

          // Bewegungsbefehl für Einheiten
          if (this.selectedUnits.length === 0) return;

          // Infanterie in Formation, Fahrzeuge/Harvester individuell
          const infantry = this.selectedUnits.filter((u) => u.type === "infantry");
          const others = this.selectedUnits.filter((u) => u.type !== "infantry");

          if (infantry.length > 0) this.issueInfantryVirtualVehicleMove(infantry, x, y);

          others.forEach((unit) => {
            const spreadX = unit.type === "harvester" ? x : x + (Math.random() - 0.5) * 30 * WORLD_SCALE;
            const spreadY = unit.type === "harvester" ? y : y + (Math.random() - 0.5) * 30 * WORLD_SCALE;
            const commandTarget = this.getValidatedMoveTarget(unit, spreadX, spreadY);
            if (unit.type === "harvester" && commandTarget.refinery) {
              unit.orderHarvesterReturnToRefinery(commandTarget.refinery, commandTarget.x, commandTarget.y);
            } else {
              if (unit.type === "harvester") {
                unit.harvesterState = "manual";
                unit.targetRefinery = null;
              }
              unit.setMoveTarget(commandTarget.x, commandTarget.y, commandTarget.allowEndInBlocked);
            }
          });

          this.clickMarkers.push({ x, y, life: 15 });
        }

        tryDeployMCV(clickX, clickY) {
          if (this.selectedUnits.length !== 1) return false;

          const unit = this.selectedUnits[0];
          if (unit.typeKey !== "mcv") return false;

          const deployDistance = Math.hypot(unit.x - clickX, unit.y - clickY);
          if (deployDistance > unit.radius + 14 * WORLD_SCALE) return false;

          this.deployMCV(unit);
          return true;
        }

        deployMCV(unit) {
          if (!this.units.includes(unit)) return;

          const placement = this.getPlacementAt(unit.x, unit.y, CONSTRUCTION_YARD_TYPE);
          const free = this.isPlacementFree(placement, { ignoreUnits: [unit], ownerIndex: 0 });
          if (!free.free) {
            this.updateUI("Kein Platz zum Aufbau der Bauanlage.");
            return;
          }

          unit.selected = false;
          this.selectedUnits = this.selectedUnits.filter((u) => u !== unit);
          this.units = this.units.filter((u) => u !== unit);

          this.buildings.push(this.createBuildingEntity(CONSTRUCTION_YARD_TYPE, placement));
          this.recalculateBaseEconomy();

          //        if (!this.buildingsUnlocked) {
          this.buildingsUnlocked = true;
          this.initSidebar();
          this.switchTab("buildings");
          //        }
        }

        handleSingleClick(x, y) {
          if (this.sellMode) {
            let sold = this.sellBuildingAt(x, y);
            if (!sold) {
              let clickedUnit = null;
              for (let i = this.units.length - 1; i >= 0; i--) {
                const u = this.units[i];
                if (Math.hypot(u.x - x, u.y - y) < u.radius + 5 * WORLD_SCALE) {
                  clickedUnit = u;
                  break;
                }
              }
              if (clickedUnit && clickedUnit.ownerIndex === 0 && clickedUnit.isDocked && clickedUnit.targetRepairBay) {
                const unitTypeData = UNIT_TYPES[clickedUnit.typeKey] || {};
                const vehicleSaleValue = Math.floor((unitTypeData.cost || 0) / 2);
                this.addSaleCredits(vehicleSaleValue);
                clickedUnit.isDead = true;
                clickedUnit.deathTime = Date.now();
                clickedUnit.isDocked = false;
                clickedUnit.targetRepairBay = null;
                this.updateUI(`Verkauft: ${unitTypeData.name || "Vehicle"} +$${vehicleSaleValue}`);
                sold = true;
              }
            }
            if (!sold) {
              this.setSellMode(false);
              this.updateUI("Nichts verkauft.");
            }
            return;
          }

          let clickedUnit = null;

          // Einheiten Klick (Reihenfolge umdrehen damit obere zuerst getroffen werden)
          for (let i = this.units.length - 1; i >= 0; i--) {
            const u = this.units[i];
            if (Math.hypot(u.x - x, u.y - y) < u.radius + 5 * WORLD_SCALE) {
              clickedUnit = u;
              break;
            }
          }

          this.deselectAll();
          if (clickedUnit && clickedUnit.ownerIndex === 0) {
            clickedUnit.selected = true;
            this.selectedUnits.push(clickedUnit);

            // Info Text
            let info = `${UNIT_TYPES[clickedUnit.typeKey].name}`;
            if (clickedUnit.type === "harvester") {
              const load = Math.floor((clickedUnit.harvestedDistance / clickedUnit.maxHarvestDist) * 100);
              info += ` (Ladung: ${load}%)`;
            }
            this.updateUI(info);
          } else {
            this.updateUI(null);
          }
        }

        old_handleBoxSelection(start, end) {
          // todo loeschen wenn Drag-Select funktioniert
          this.deselectAll();
          const x1 = Math.min(start.x, end.x),
            y1 = Math.min(start.y, end.y);
          const x2 = Math.max(start.x, end.x),
            y2 = Math.max(start.y, end.y);

          let count = 0;
          this.units.forEach((u) => {
            if (u.ownerIndex === 0 && u.x >= x1 && u.x <= x2 && u.y >= y1 && u.y <= y2) {
              u.selected = true;
              this.selectedUnits.push(u);
              count++;
            }
          });
          if (count > 0) this.updateUI(`${count} Einheiten ausgewählt`);
        }

        handleBoxSelection(start, end) {
          this.deselectAll();

          const x1 = Math.min(start.x, end.x),
            y1 = Math.min(start.y, end.y);
          const x2 = Math.max(start.x, end.x),
            y2 = Math.max(start.y, end.y);

          // Sammle alle Einheiten im Rechteck (nach Select-Prio filtern)
          const unitsInBox = this.units.filter((u) => {
            return (
              u.ownerIndex === 0 && // Nur eigene Einheiten
              u.x >= x1 &&
              u.x <= x2 &&
              u.y >= y1 &&
              u.y <= y2
            ); // Im Auswahlrechteck
          });

          if (unitsInBox.length === 0) {
            this.updateUI("Keine Einheit im Auswahlbereich.");
            return;
          }

          // Prioritäten bestimmen (lese `selectPrio` aus UNIT_TYPES, mit Fallbacks)
          const unitsWithPrio = unitsInBox.map((u) => {
            const typeData = UNIT_TYPES[u.typeKey] || {};
            let prio;
            if (typeof typeData.selectPrio === "number") {
              prio = typeData.selectPrio;
            } else {
              // Fallbacks: harvester/mcv = 0, aircraft (non-helicopter) = 3, default = 2
              if (u.type === "harvester" || u.typeKey === "mcv") prio = 0;
              else if (u.type === "aircraft" && getBaseTypeId(u.typeKey) !== "helicopter") prio = 3;
              else prio = 2;
            }
            return { unit: u, prio };
          });

          // Die höchste Priorität finden
          const maxPrio = Math.max(...unitsWithPrio.map((u) => u.prio));

          // Nur Einheiten mit höchster Priorität auswählen
          unitsInBox.forEach((u) => {
            const hasMaxPrio = unitsWithPrio.some((up) => up.unit === u && up.prio === maxPrio);
            if (hasMaxPrio) {
              u.selected = true;
              this.selectedUnits.push(u);
            }
          });

          // Info-Text anzeigen
          const count = unitsInBox.length;
          let prioName;
          switch (maxPrio) {
            case 0:
              prioName = "unbewaffnet (Harvester/MCV)";
              break;
            case 1:
              prioName = "Navy";
              break;
            case 2:
              prioName = "Army";
              break;
            case 3:
              prioName = "Luftfahrzeuge";
              break;
            default:
              prioName = "";
          }
          this.updateUI(`Gewählt: ${count} Einheit${count !== 1 ? "en" : ""} (Prio: ${prioName})`);
        }
