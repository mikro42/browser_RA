            for (const member of group.members) {
                if (member === leader) continue;
                member.formationIsLeader = false;
                member.x = leader.x + member.formationOffsetX;
                member.y = leader.y + member.formationOffsetY;
                member.targetX = null;
                member.targetY = null;
                member.path = [];
                member.currentPathIndex = 0;
            }
        });
    }

    regroupIdleInfantryAtDestination() {
        const movingGroupIds = new Set();
        for (const unit of this.units) {
            if (unit.type !== 'infantry' || unit.formationGroupId === null) continue;
            if (unit.formationIsLeader && unit.targetX !== null && unit.targetY !== null) {
                movingGroupIds.add(unit.formationGroupId);
            }
        }

        const isUnitIdleForRegroup = (unit) => {
            if (unit.type !== 'infantry') return false;
            if (!unit.regroupOnArrival) return false;
            if (unit.targetX !== null || unit.targetY !== null) return false;
            if (unit.formationGroupId !== null && movingGroupIds.has(unit.formationGroupId)) return false;
            return true;
        };

        const pending = this.units.filter(isUnitIdleForRegroup);
        if (pending.length === 0) return;

        const unassigned = [...pending];
        const clusters = [];
        const gatherRadius = TILE_SIZE * 1.5;

        while (unassigned.length > 0) {
            const seed = unassigned.pop();
            const cluster = [seed];
            let changed = true;

            while (changed) {
                changed = false;
                for (let i = unassigned.length - 1; i >= 0; i--) {
                    const candidate = unassigned[i];
                    const nearAny = cluster.some(member => Math.hypot(member.x - candidate.x, member.y - candidate.y) <= gatherRadius);
                    if (nearAny) {
                        cluster.push(candidate);
                        unassigned.splice(i, 1);
                        changed = true;
                    }
                }
            }

            clusters.push(cluster);
        }

        for (const cluster of clusters) {
            const centerX = cluster.reduce((sum, unit) => sum + unit.x, 0) / cluster.length;
            const centerY = cluster.reduce((sum, unit) => sum + unit.y, 0) / cluster.length;
            const slots = this.generateInfantryFormationSlots(centerX, centerY, cluster.length);

            const remainingUnits = [...cluster];
            const assignments = [];

            for (const slot of slots) {
                if (remainingUnits.length === 0) break;
                const bestIdx = remainingUnits.reduce((bestI, unit, idx, arr) => {
                    if (bestI === -1) return idx;
                    const dBest = Math.hypot(arr[bestI].x - slot.x, arr[bestI].y - slot.y);
                    const dNow = Math.hypot(unit.x - slot.x, unit.y - slot.y);
                    return dNow < dBest ? idx : bestI;
                }, -1);
                const unit = remainingUnits.splice(bestIdx, 1)[0];
                assignments.push({ unit, slot });
            }

            if (assignments.length === 0) continue;

            const byTile = new Map();
            for (const assignment of assignments) {
                const tx = Math.floor(assignment.slot.x / TILE_SIZE);
                const ty = Math.floor(assignment.slot.y / TILE_SIZE);
                const key = `${tx},${ty}`;
                if (!byTile.has(key)) byTile.set(key, { tx, ty, units: [] });
                byTile.get(key).units.push(assignment.unit);
            }

            byTile.forEach(({ tx, ty, units }) => {
                this.setInfantryTileFormation(units, tx, ty);
                for (const unit of units) unit.regroupOnArrival = false;
            });
        }
    }

    pushBarracksBlockingInfantry(spawnX, spawnY) {
        const spawnTile = Pathfinder.getGridPos(spawnX, spawnY);
        const blockers = this.units.filter(unit =>
            unit.type === 'infantry' &&
            Math.floor(unit.x / TILE_SIZE) === spawnTile.x &&
            Math.floor(unit.y / TILE_SIZE) === spawnTile.y
        );

        if (blockers.length < 5) return;

        const moving = blockers.slice(0, 5);
        const occupancy = this.getInfantryTileOccupancy(new Set(moving));
        const freeTile = this.findNearestTileWithCapacity(spawnTile.x, spawnTile.y, moving.length, occupancy);
        if (!freeTile) return;

        this.setInfantryTileFormation(moving, freeTile.tx, freeTile.ty);
    }

    // --- NPC AI GEBÄUDEBAU ---

    updateNPCAIBuilding() {
        const now = Date.now();

        for (let aiIndex = 1; aiIndex < gameConfig.players.length; aiIndex++) {
            const aiState = this.npcAiState[aiIndex];
            if (!aiState || !aiState.buildQueue) continue;

            const aiPlayer = gameConfig.players[aiIndex];

            // AI nur ausführen, wenn sie im Startmenü aktiviert wurde (nicht 'Open')
            if (aiPlayer.type === 'Open') continue;
            const aiAccount = this.getAccount(aiIndex);

            // Wenn gerade ein Gebäude gebaut wird, überprüfe ob Bauzeit abgelaufen ist
            if (aiState.currentBuilding) {
                const elapsed = now - aiState.buildStartTime;
                const buildingType = this.getBuildingTypeById(aiState.currentBuilding.buildingTypeId);
                
                if (!buildingType) {
                    aiState.currentBuilding = null;
                } else {
                    const totalTime = (buildingType.time || 2500) / gameConfig.players[aiIndex].productionFactor;
                    
                    if (elapsed >= totalTime) {
                        // Platziere das fertige Gebäude auf der Karte
                        this.buildings.push(aiState.currentBuilding);
                        aiState.currentBuilding = null;
                        aiState.nextBuildingIndex++;
                    }
                }
            }

            // Wenn kein Gebäude im Bau, versuche das nächste zu bauen
            if (!aiState.currentBuilding && aiState.nextBuildingIndex < aiState.buildQueue.length) {
                const now = Date.now();
                // Verzögerung zwischen Gebäudebauten prüfen (asynchroner Aufbau)
                if (now < aiState.nextBuildDelayUntil) continue;

                const nextBuildingId = aiState.buildQueue[aiState.nextBuildingIndex];
                const buildingType = this.getBuildingTypeById(nextBuildingId);

                if (buildingType) {
                    const neededCredits = Math.ceil(buildingType.cost * 1.2); // +20%
                    
                    // Überprüfe ob genug Credits vorhanden sind
                    if (aiAccount.credits >= neededCredits) {
                        // Transferiere +20% der Credits von base zu unitBuild
                        const transferAmount = Math.ceil(buildingType.cost * 0.2);
                        aiAccount.credits -= buildingType.cost;
                        aiAccount.unitBuild += transferAmount;

                        // Finde Platzierungsposition für das Gebäude
                        const placement = this.findAIBuildingPlacement(buildingType, aiIndex);

                        if (placement) {
                            // Erstelle das Gebäude-Objekt (noch nicht auf der Karte)
                            const building = this.createBuildingEntity(buildingType, placement, aiPlayer);
                            building.buildingTypeId = nextBuildingId; // Speichere Typ-ID für späteren Zugriff
                            
                            aiState.currentBuilding = building;
                            aiState.buildStartTime = now;
                            
                            // Setze Verzögerung für das nächste Gebäude (4s bis 10s * SpeedFactor)
                            const delayMs = (Math.random() * 6000 + 4000) * aiPlayer.gameSpeedFactor;
                            aiState.nextBuildDelayUntil = now + delayMs;
                        } else {
                            // Platzierung fehlgeschlagen, Geld zurückgeben
                            aiAccount.credits += buildingType.cost;
                            aiAccount.unitBuild -= transferAmount;
                        }
                    }
                }
            }
        }
    }

    findAIBuildingPlacement(buildingType, aiIndex) {
        const aiPlayer = gameConfig.players[aiIndex];
        const mainBuildingBaseIds = ['constructionyard', 'powerplant', 'barracks', 'refinery', 'warfactory', 'radar', 'helipad'];
        const myMainBuildings = this.buildings.filter(b => {
            if (!b.ownerData || b.ownerData.spawn !== aiPlayer.spawn) return false;
            return mainBuildingBaseIds.includes(getBaseTypeId(b.name));
        });

        const isDefenseType = !!(buildingType && DEFENSE_TYPES[buildingType.id]);
        const bw = buildingType.widthTiles || 2;
        const bh = buildingType.heightTiles || 2;
        const mapCenterX = Math.floor(this.cols / 2);
        const mapCenterY = Math.floor(this.rows / 2);

        // Fallback wenn noch keine Hauptgebäude existieren (z.B. beim ersten CY)
        if (myMainBuildings.length === 0) {
            const spawnMap = {
                A: { x: 6.5 * TILE_SIZE, y: 6.5 * TILE_SIZE },
                B: { x: (this.cols - 6.5) * TILE_SIZE, y: 6.5 * TILE_SIZE },
                C: { x: (this.cols - 6.5) * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE },
                D: { x: 6.5 * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE }
            };
            const spawnPos = spawnMap[aiPlayer.spawn];
            if (!spawnPos) return null;
            
            const centerTX = Math.floor(spawnPos.x / TILE_SIZE);
            const centerTY = Math.floor(spawnPos.y / TILE_SIZE);
            return this._findPlacementAroundTile(centerTX, centerTY, buildingType, aiIndex, isDefenseType);
        }

        let anchors = [...myMainBuildings];

        if (!isDefenseType) {
            // 1. Nicht-Defense: Zufällige Auswahl von bis zu 3 verschiedenen Ankergebäuden
            for (let i = anchors.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [anchors[i], anchors[j]] = [anchors[j], anchors[i]];
            }
            anchors = anchors.slice(0, 3);

            const candidates = [];
            for (const anchor of anchors) {
                const placement = this._findPlacementAroundBuilding(anchor, buildingType, aiIndex, isDefenseType);
                if (placement) candidates.push(placement);
            }

            // Zufällige Auswahl aus den gefundenen gültigen Positionen
            if (candidates.length > 0) {
                return candidates[Math.floor(Math.random() * candidates.length)];
            }
        } else {
            // 2. Defense: Sortiere nach Abstand zur Spielfeldmitte (kleinster Abstand zuerst)
            anchors.sort((a, b) => {
                const ca = getBuildingCenter(a);
                const cb = getBuildingCenter(b);
                const distA = Math.abs(ca.x - mapCenterX * TILE_SIZE) + Math.abs(ca.y - mapCenterY * TILE_SIZE);
                const distB = Math.abs(cb.x - mapCenterX * TILE_SIZE) + Math.abs(cb.y - mapCenterY * TILE_SIZE);
                return distA - distB;
            });

            // Defense wird um das zur Mitte nächstgelegene Hauptgebäude platziert, 
            // was die Basis von der Ecke her nach außen verteidigt und Straßen freihält.
            for (const anchor of anchors) {
                const placement = this._findPlacementAroundBuilding(anchor, buildingType, aiIndex, isDefenseType);
                if (placement) return placement;
            }
        }

        // Fallback: Erweiterte Suche im Radius um das erste Gebäude/CY falls Anker-Suche scheitert
        const fallbackAnchor = myMainBuildings.find(b => getBaseTypeId(b.name) === 'constructionyard') || myMainBuildings[0];
        for (let radius = 4; radius <= 15; radius += 2) {
            const anchorGrid = getBuildingGridRect(fallbackAnchor);
            const centerTX = anchorGrid.tileX + Math.floor(anchorGrid.widthTiles / 2);
            const centerTY = anchorGrid.tileY + Math.floor(anchorGrid.heightTiles / 2);

            for (let dx = -radius; dx <= radius; dx++) {
                for (let dy = -radius; dy <= radius; dy++) {
                    if (Math.abs(dx) > radius || Math.abs(dy) > radius) continue;
                    const placement = { tileX: centerTX + dx - Math.floor(bw/2), tileY: centerTY + dy - Math.floor(bh/2), widthTiles: bw, heightTiles: bh };
                    if (this._isValidPlacement(placement, aiIndex, isDefenseType)) return placement;
                }
            }
        }

        console.log(`AI ${aiPlayer.name}: Kein Bauplatz für ${buildingType.name} gefunden.`);
        return null;
    }

    _findPlacementAroundBuilding(anchorBuilding, buildingType, aiIndex, isDefenseType) {
        const anchorGrid = getBuildingGridRect(anchorBuilding);
        const bw = buildingType.widthTiles || 2;
        const bh = buildingType.heightTiles || 2;

        // Richtungen: rechts, links, unten, oben + Diagonalen
        const directions = [
            { dx: anchorGrid.widthTiles, dy: 0 },
            { dx: -bw, dy: 0 },
            { dx: 0, dy: anchorGrid.heightTiles },
            { dx: 0, dy: -bh },
            { dx: anchorGrid.widthTiles, dy: 1 },
            { dx: -bw, dy: -1 },
            { dx: 1, dy: anchorGrid.heightTiles },
            { dx: -1, dy: -bh }
        ];

        for (const dir of directions) {
            const tileX = anchorGrid.tileX + dir.dx;
            const tileY = anchorGrid.tileY + dir.dy;
            const placement = { tileX, tileY, widthTiles: bw, heightTiles: bh };
            if (this._isValidPlacement(placement, aiIndex, isDefenseType)) return placement;
        }
        return null;
    }

    _isValidPlacement(placement, aiIndex, isDefenseType) {
        const aiPlayer = gameConfig.players[aiIndex];

        // Harte Randbedingung: Alle Teile müssen auf dem Spielfeld bleiben
        if (placement.tileX < 0 || placement.tileY < 0 ||
            placement.tileX + placement.widthTiles > this.cols ||
            placement.tileY + placement.heightTiles > this.rows) return false;

        // Harte Randbedingung: Keine Überschneidung zu Gebäuden anderer Spieler (und eigenen)
        const result = this.isPlacementFree(placement, { buildingType: null, owner: aiPlayer.type });
        if (!result.free) return false;

        // Weiche Bedingung (nur Nicht-Defense): Max. 1 Kachel Lücke zu eigenen Hauptgebäuden
        if (!isDefenseType) {
            const mainBuildingBaseIds = ['constructionyard', 'powerplant', 'barracks', 'refinery', 'warfactory', 'radar', 'helipad'];
            const myMainBuildings = this.buildings.filter(b => {
                if (!b.ownerData || b.ownerData.spawn !== aiPlayer.spawn) return false;
                return mainBuildingBaseIds.includes(getBaseTypeId(b.name));
            });

            if (myMainBuildings.length > 0) {
                let withinDistance = false;
                for (const other of myMainBuildings) {
                    const otherGrid = getBuildingGridRect(other);
                    
                    // Lücke berechnen (Chebyshev-Distanz der Ränder)
                    const hGap = Math.max(0, otherGrid.tileX - (placement.tileX + placement.widthTiles), placement.tileX - (otherGrid.tileX + otherGrid.widthTiles));
                    const vGap = Math.max(0, otherGrid.tileY - (placement.tileY + placement.heightTiles), placement.tileY - (otherGrid.tileY + otherGrid.heightTiles));
                    
                    if (Math.max(hGap, vGap) <= 1) { withinDistance = true; break; }
                }
                if (!withinDistance) return false;
            }
        }

        return true;
    }

    _findPlacementAroundTile(centerTX, centerTY, buildingType, aiIndex, isDefenseType) {
        const bw = buildingType.widthTiles || 2;
        const bh = buildingType.heightTiles || 2;
        for (let radius = 1; radius <= 6; radius++) {
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dy = -radius; dy <= radius; dy++) {
                    if (Math.abs(dx) !== radius && Math.abs(dy) !== radius) continue;
                    const placement = { tileX: centerTX + dx - Math.floor(bw/2), tileY: centerTY + dy - Math.floor(bh/2), widthTiles: bw, heightTiles: bh };
                    if (this._isValidPlacement(placement, aiIndex, isDefenseType)) return placement;
                }
            }
        }
        console.log(`AI: Kein Bauplatz für ${buildingType.name} gefunden (Spawn-Fallback).`);
        return null;
    }

    _isValidPlacement(placement, aiIndex, isDefenseType) {
        const aiPlayer = gameConfig.players[aiIndex];

        // Harte Randbedingung: Alle Teile müssen auf dem Spielfeld bleiben
        if (placement.tileX < 0 || placement.tileY < 0 ||
            placement.tileX + placement.widthTiles > this.cols ||
            placement.tileY + placement.heightTiles > this.rows) {
            return false;
        }

        // Harte Randbedingung: Keine Überschneidung zu Gebäuden anderer Spieler (und eigenen)
        const result = this.isPlacementFree(placement, { buildingType: null, owner: aiPlayer.type });
        if (!result.free) return false;

        // Weiche Bedingung: Distanz 0-1 Kachel zu eigenen Hauptgebäuden (nur für Nicht-Defense)
        if (!isDefenseType) {
            const mainBuildingBaseIds = ['constructionyard', 'powerplant', 'barracks', 'refinery', 'warfactory', 'radar', 'helipad'];
            const myMainBuildings = this.buildings.filter(b => {
                if (!b.ownerData || b.ownerData.spawn !== aiPlayer.spawn) return false;
                return mainBuildingBaseIds.includes(getBaseTypeId(b.name));
            });

            // Wenn eigene Hauptgebäude existieren, muss Platz in 0-1 Kacheln Distanz sein
            if (myMainBuildings.length > 0) {
                let withinDistance = false;
                for (const other of myMainBuildings) {
                    const otherGrid = getBuildingGridRect(other);

                    const pLeft = placement.tileX;
                    const pRight = placement.tileX + placement.widthTiles - 1;
                    const pTop = placement.tileY;
                    const pBottom = placement.tileY + placement.heightTiles - 1;

                    const oLeft = otherGrid.tileX;
                    const oRight = otherGrid.tileX + otherGrid.widthTiles - 1;
                    const oTop = otherGrid.tileY;
                    const oBottom = otherGrid.tileY + otherGrid.heightTiles - 1;

                    // Lücke berechnen (Chebyshev-Distanz der Ränder)
                    const hGap = Math.max(0, oLeft - pRight - 1, pLeft - oRight - 1);
                    const vGap = Math.max(0, oTop - pBottom - 1, pTop - oBottom - 1);
                    const minDist = Math.max(hGap, vGap);

                    if (minDist <= 1) {
                        withinDistance = true;
                        break;
                    }
                }

                if (!withinDistance) return false;
            }
        }

        return true;
    }

    enforceInfantryTileCapacity() {
        const movingGroupIds = new Set();
        for (const unit of this.units) {
            if (unit.type !== 'infantry' || unit.formationGroupId === null) continue;
            if (unit.formationIsLeader && unit.targetX !== null && unit.targetY !== null) {
                movingGroupIds.add(unit.formationGroupId);
            }
        }

        const groupsByTile = new Map();
        for (const unit of this.units) {
            if (unit.type !== 'infantry') continue;
            if (unit.targetX !== null || unit.targetY !== null) continue;
            if (unit.formationGroupId !== null && movingGroupIds.has(unit.formationGroupId)) continue;

            const tx = Math.floor(unit.x / TILE_SIZE);
            const ty = Math.floor(unit.y / TILE_SIZE);
            const key = `${tx},${ty}`;
            if (!groupsByTile.has(key)) groupsByTile.set(key, { tx, ty, units: [] });
            groupsByTile.get(key).units.push(unit);
        }

        groupsByTile.forEach(({ tx, ty, units }) => {
            if (units.length === 1) {
                const solo = units[0];
                if (solo.formationGroupId !== null) this.clearInfantryFormation(solo);
                solo.regroupOnArrival = false;
                return;
            }

            const hasSingleConsistentGroup = (() => {
                if (units.length < 2 || units.length > 5) return false;
                const g = units[0].formationGroupId;
                if (g === null) return false;
                if (!units.every(u => u.formationGroupId === g)) return false;
                const leaders = units.filter(u => u.formationIsLeader).length;
                return leaders === 1;
            })();

            if (units.length <= 5) {
                if (!hasSingleConsistentGroup) {
                    this.setInfantryTileFormation(units, tx, ty);
                }
                return;
            }

            const keep = units.slice(0, 5);
            this.setInfantryTileFormation(keep, tx, ty);

            let overflow = units.slice(5);
            while (overflow.length > 0) {
                const chunk = overflow.splice(0, 5);
                const occupancy = this.getInfantryTileOccupancy(new Set(chunk));
                const freeTile = this.findNearestTileWithCapacity(tx, ty, chunk.length, occupancy);
                if (!freeTile) break;
                this.setInfantryTileFormation(chunk, freeTile.tx, freeTile.ty);
            }
        });
    }

    deselectAll() {
        this.units.forEach(u => u.selected = false);
        this.selectedUnits = [];
        this.selectedBuilding = null;
    }

    buildStructure(placement) {
        const bType = this.buildingToPlace;
        const newBuilding = this.createBuildingEntity(bType, placement);
        
        this.buildings.push(newBuilding);
        this.recalculateBaseEconomy();

        if (getBaseTypeId(bType.id) === 'refinery') {
            const dock = this.getRefineryUnloadPoint(newBuilding);
            const h = new Entity(dock.x, dock.y, gameConfig.players[0], 'harvester');
            h.targetRefinery = newBuilding;
            h.harvesterState = 'leaving';
            h.leaveDistance = 0;
            h.harvestedDistance = 0;
            this.units.push(h);
        }
        
        if (!this.constructedBuildings.includes(bType.id)) {
            this.constructedBuildings.push(bType.id);

            this.initSidebar(); // UI aktualisieren (Tabs freischalten)
            if (getBaseTypeId(bType.id) === 'refinery') {
                this.updateUI("Rafinerie gebaut. Harvester bereit.");
            }
        } else {
            if (getBaseTypeId(bType.id) === 'refinery') {
                if (this.refineryCount === 2) {
                    this.updateUI("Zweite Rafinerie gebaut. Harvester bereit.");
                } else this.updateUI("Rafinerie gebaut. Harvester bereit.");
            } else {
                this.updateUI(`Gebaut: ${bType.name}`);
            }
        }
    }

    createBuildingEntity(typeData, placement, ownerData = null) {
        const centerX = (placement.tileX + placement.widthTiles / 2) * TILE_SIZE;
        const centerY = (placement.tileY + placement.heightTiles / 2) * TILE_SIZE;
        
        if (!ownerData) {
            ownerData = gameConfig.players[0];
        }

        const playerIndex = gameConfig.players.indexOf(ownerData);
        const playerColorIdx = playerIndex >= 0 ? playerIndex : 0;

        const building = {
            type: 'building',
            name: typeData.id,
            x: centerX,
            y: centerY,
            tileX: placement.tileX,
            tileY: placement.tileY,
            widthTiles: placement.widthTiles,
            heightTiles: placement.heightTiles,
            bibRows: typeData.bibRows || 0,
            drawSize: Math.max(placement.widthTiles, placement.heightTiles) * TILE_SIZE,
//            color: (this.playerColors && this.playerColors[playerColorIdx]) ? this.playerColors[playerColorIdx] : '#9e3a3a',
            color: colorMap[ownerData.color] || '#9e3a3a',
            owner: ownerData.type,
            ownerData,
            fraction: ownerData.fraction
        };

        // Nur eigene Fraktion zum Menü hinzufügen, nicht die der AI
        if (building.fraction && ownerData === gameConfig.players[0]) {
            this.addPlayerFraction(building.fraction);
        }


        return building;
    }

    // --- GAME LOOP ---

    loop(timestamp) {
        const dt = timestamp - this.lastTime;
        this.lastTime = timestamp;

        this.update();
        this.draw();

        requestAnimationFrame(this.loop);
    }

    update() {
        this.updateGameDisplay(); // Update time and energy display
        this.processBuildingProduction();
        this.processProduction(); // Produktion abarbeiten
        this.updateNPCAIBuilding(); // NPC-AI Gebäudebau
        
        this.units.forEach(u => u.update(this.units, this.buildings));
        this.updateInfantryVirtualVehicleFollowers();
        this.regroupIdleInfantryAtDestination();
        this.enforceInfantryTileCapacity();
        
        for(let i=this.clickMarkers.length-1; i>=0; i--) {
            this.clickMarkers[i].life--;
            if(this.clickMarkers[i].life <= 0) this.clickMarkers.splice(i, 1);
        }
    }

    draw() {
        // Background
        this.ctx.fillStyle = '#2b3a2b';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Grid
        this.ctx.strokeStyle = COLORS.grid;
        this.ctx.lineWidth = 1;
        
        // Nur sichtbaren Grid zeichnen (Optimierung könnte hier rein, aber wir halten es einfach)
        for(let x=0; x<this.canvas.width; x+=TILE_SIZE) { 
            this.ctx.beginPath(); this.ctx.moveTo(x,0); this.ctx.lineTo(x,this.canvas.height); this.ctx.stroke();
        }
        for(let y=0; y<this.canvas.height; y+=TILE_SIZE) { 
            this.ctx.beginPath(); this.ctx.moveTo(0,y); this.ctx.lineTo(this.canvas.width,y); this.ctx.stroke();
        }

        // Click Markers
        this.clickMarkers.forEach(m => {
            this.ctx.strokeStyle = `rgba(0, 255, 0, ${m.life / 15})`;
            this.ctx.lineWidth = 2;
            const s = 10 * WORLD_SCALE;
            this.ctx.beginPath();
            this.ctx.moveTo(m.x-s, m.y); this.ctx.lineTo(m.x+s, m.y);
            this.ctx.moveTo(m.x, m.y-s); this.ctx.lineTo(m.x, m.y+s);
            this.ctx.stroke();
        });

        // Buildings
        this.buildings.forEach(b => {
            const rect = getBuildingPixelRect(b);
            const body = getBuildingBodyPixelRect(b);
            
            // Schatten
            this.ctx.fillStyle = 'rgba(0,0,0,0.4)';
            this.ctx.fillRect(rect.x + 3 * WORLD_SCALE, rect.y + 3 * WORLD_SCALE, rect.width, rect.height);

            // Unterste Footprint-Reihe: befahrbare Betonplatte (Bib)
            if (body.bibHeight > 0) {
                this.ctx.fillStyle = '#8d9499';
                this.ctx.fillRect(rect.x, body.bibY, rect.width, body.bibHeight);

                this.ctx.fillStyle = 'rgba(255,255,255,0.25)';
                this.ctx.fillRect(rect.x, body.bibY, rect.width, 2 * WORLD_SCALE);

                this.ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                this.ctx.lineWidth = 1;
                for (let gx = rect.x + TILE_SIZE; gx < rect.x + rect.width; gx += TILE_SIZE) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(gx, body.bibY + 1);
                    this.ctx.lineTo(gx, body.bibY + body.bibHeight - 1);
                    this.ctx.stroke();
                }
            }

            // Gebäudekörper (ab Reihe 2 von unten)
            if (body.height > 0) {
                const cx = body.x + body.width / 2;
                const cy = body.y + body.height / 2;
                const rx = Math.max(6 * WORLD_SCALE, body.width * 0.42);
                const ry = Math.max(6 * WORLD_SCALE, body.height * 0.40);

                // Heller Hintergrund wie Beton-Bib
                this.ctx.fillStyle = '#8d9499';
                this.ctx.fillRect(body.x, body.y, body.width, body.height);

                // Einheitliche Ellipse in Construction Yard Farbe
                this.ctx.fillStyle = CONSTRUCTION_YARD_TYPE.color;
                this.ctx.beginPath();
                this.ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                this.ctx.fill();

                // Rahmen Ellipse in Spielerfarbe
                this.ctx.strokeStyle = b.color || '#9e3a3a';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();

                // Special rendering for Helipad: large H
                if (getBaseTypeId(b.name) === 'helipad') {
                    const fontSize = Math.max(28, Math.round(32 * WORLD_SCALE));
                    this.ctx.fillStyle = '#000';
                    this.ctx.font = `italic ${fontSize}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.lineWidth = 0.5;
                    this.ctx.fillText('H', cx, cy);
                } else {
                    const label = (getBaseTypeId(b.name) === 'pillbox') ? 'P' : getBuildingDisplayName(b.name);
                    const lines = splitLabelTwoLines(label);
                    const fontSize = Math.max(9, Math.round(11 * WORLD_SCALE));
                    this.ctx.fillStyle = '#000';
                    this.ctx.font = `${fontSize}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    if (lines.length > 1) {
                        this.ctx.fillText(lines[0], cx, cy - fontSize * 0.45);
                        this.ctx.fillText(lines[1], cx, cy + fontSize * 0.55);
                    } else {
                        this.ctx.fillText(lines[0], cx, cy);
                    }
                }
                this.ctx.textAlign = 'start';
                this.ctx.textBaseline = 'alphabetic';
            }

            // Außenrahmen des gesamten Footprints
            this.ctx.strokeStyle = b.color || '#9e3a3a';
            this.ctx.lineWidth = 1;
            this.ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);

            // Silo: Füllstand-Anzeige wenn ausgewählt
            if (getBaseTypeId(b.name) === 'silo' && b === this.selectedBuilding) {
                const playerAccount = this.getAccount(0);
                const fillRatio = playerAccount.harvestLimit > 0 ? playerAccount.harvest / playerAccount.harvestLimit : 0;
                const boxes = 5, boxSize = 2, gap = 1;
                const totalW = boxes * boxSize + (boxes - 1) * gap;
                const siloRect = getBuildingPixelRect(b);
                const startBX = siloRect.x + siloRect.width / 2 - totalW / 2;
                const bY = siloRect.y + siloRect.height - 4;
                const filled = Math.min(boxes, Math.floor(fillRatio * boxes + 0.0001));
                for (let si = 0; si < boxes; si++) {
                    const bx = startBX + si * (boxSize + gap);
                    this.ctx.fillStyle = (si < filled) ? '#00ff44' : '#1a2a1a';
                    this.ctx.fillRect(bx, bY, boxSize, boxSize);
                    if (si < boxes - 1) {
                        this.ctx.fillStyle = '#0b0b0b';
                        this.ctx.fillRect(bx + boxSize, bY, 1, boxSize);
                    }
                }
            }
        });

        // Units (Infanterie-Displaypositionen per Würfelaugen-Gruppierung aktualisieren)
        this.computeInfantryDisplayPositions();
        this.units.forEach(u => u.draw(this.ctx));

        // Selection Box
        const box = this.input.getSelectionBox();
        if (box) {
            this.ctx.strokeStyle = '#00ff00';
            this.ctx.lineWidth = 1;
            this.ctx.strokeRect(box.x, box.y, box.w, box.h);
            this.ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
            this.ctx.fillRect(box.x, box.y, box.w, box.h);
        }

        // Placement Ghost
        if (this.placementMode && this.buildingToPlace) {
            const mx = this.input.mouseX;
            const my = this.input.mouseY;
            const placement = this.getPlacementAt(mx, my, this.buildingToPlace);
            const placementFree = this.isPlacementFree(placement, { buildingType: this.buildingToPlace, owner: 'human' }).free;

            for (let ty = 0; ty < placement.heightTiles; ty++) {
                for (let tx = 0; tx < placement.widthTiles; tx++) {
                    const px = (placement.tileX + tx) * TILE_SIZE;
                    const py = (placement.tileY + ty) * TILE_SIZE;
                    this.ctx.strokeStyle = placementFree ? '#00ff00' : '#ff3333';
                    this.ctx.lineWidth = 2 * WORLD_SCALE;
                    this.ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                    this.ctx.fillStyle = placementFree ? 'rgba(0, 255, 0, 0.14)' : 'rgba(255, 0, 0, 0.14)';
                    this.ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                }
            }
        }
    }
}

// --- INPUT MANAGER ---
class InputManager {
    constructor(canvas) {
        this.canvas = canvas;
        this.mouseX = 0;
        this.mouseY = 0;
        this.isLeftMouseDown = false;
        
        this.selectionStart = { x: 0, y: 0 };
        this.currentSelectionEnd = { x: 0, y: 0 };
        this.isDraggingBox = false;

        this.setupListeners();
    }

    setupListeners() {
        window.addEventListener('resize', () => game.resize());

        this.canvas.addEventListener('mousemove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            this.mouseX = e.clientX - rect.left;
            this.mouseY = e.clientY - rect.top;
            
            if (this.isDraggingBox) {
                this.currentSelectionEnd = { x: this.mouseX, y: this.mouseY };
            }
        });

        this.canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Linksklick
                if (game.placementMode) {
                    // In placement mode we wait for mouseup to decide place/cancel
                    return;
                }

                if (game.sellMode) {
                    // sell is handled on mouseup / handleLeftClickUp
                }

                this.isLeftMouseDown = true;
                this.selectionStart = { x: this.mouseX, y: this.mouseY };
                this.currentSelectionEnd = { x: this.mouseX, y: this.mouseY };
                this.isDraggingBox = true;
            } else if (e.button === 2) { // Rechtsklick
                e.preventDefault();
                game.handleRightClick(this.mouseX, this.mouseY);
            }
        });

        this.canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                this.isLeftMouseDown = false;

                if (game.placementMode && game.buildingToPlace) {
                    // Linksklick im Platziermodus: grün = bauen, rot = abbrechen
                     const placement = game.getPlacementAt(this.mouseX, this.mouseY, game.buildingToPlace);
                     const canBuild = game.isPlacementFree(placement, { buildingType: game.buildingToPlace, owner: 'human' });
                    const state = game.getBuildingProductionState(game.buildingToPlace.id);
                    if (canBuild.free && state.status === 'ready') {
                        game.buildStructure(placement);
                        game.consumeReadyBuilding(game.buildingToPlace.id);
                        game.cancelPlacement(false);
                        game.initSidebar();
                    } else {
                        if (canBuild.reason === 'distance_too_far') {
                            game.updateUI('Zu weit vom nächsten Gebäude entfernt.');
                        } else {
                            game.updateUI(canBuild.free ? 'Nicht bereit.' : 'Baufeld blockiert.');
                        }
                        game.cancelPlacement(true); // Gebäude bleibt "ready" für erneute Platzierung
                    }
                    return;
                }

                if (this.isDraggingBox) {
                    const dist = Math.hypot(
                        this.mouseX - this.selectionStart.x,
                        this.mouseY - this.selectionStart.y
                    );
                    if (dist < 5 * WORLD_SCALE) {
                        game.handleLeftClickUp(this.mouseX, this.mouseY);
                    } else {
                        game.handleBoxSelection(this.selectionStart, this.currentSelectionEnd);
                    }
                }
                this.isDraggingBox = false;
            }
        });

        this.canvas.addEventListener('contextmenu', e => e.preventDefault());

        // --- TOUCH SUPPORT ---
        const getTouchPos = (touch) => {
            const rect = this.canvas.getBoundingClientRect();
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        };

        const handleLeftUp = (x, y) => {
            this.isLeftMouseDown = false;
            if (game.placementMode && game.buildingToPlace) {
                const placement = game.getPlacementAt(x, y, game.buildingToPlace);
                const canBuild  = game.isPlacementFree(placement, { buildingType: game.buildingToPlace, owner: 'human' });
                const state     = game.getBuildingProductionState(game.buildingToPlace.id);
                if (canBuild.free && state.status === 'ready') {
                    game.buildStructure(placement);
                    game.consumeReadyBuilding(game.buildingToPlace.id);
                    game.cancelPlacement(false);
                    game.initSidebar();
                } else {
                    game.updateUI(canBuild.reason === 'distance_too_far'
                        ? 'Zu weit vom nächsten Gebäude entfernt.'
                        : (canBuild.free ? 'Nicht bereit.' : 'Baufeld blockiert.'));
                    game.cancelPlacement(true);
                }
                return;
            }
            if (this.isDraggingBox) {
                const dist = Math.hypot(x - this.selectionStart.x, y - this.selectionStart.y);
                if (dist < 5 * WORLD_SCALE) {
                    game.handleLeftClickUp(x, y);
                } else {
                    game.handleBoxSelection(this.selectionStart, { x, y });
                }
            }
            this.isDraggingBox = false;
        };

        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const pos = getTouchPos(e.touches[0]);
            this.mouseX = pos.x;
            this.mouseY = pos.y;
            if (game.placementMode) return; // Wait for touchend
            this.isLeftMouseDown = true;
            this.selectionStart        = { x: pos.x, y: pos.y };
            this.currentSelectionEnd   = { x: pos.x, y: pos.y };
            this.isDraggingBox = true;
        }, { passive: false });

        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const pos = getTouchPos(e.touches[0]);
            this.mouseX = pos.x;
            this.mouseY = pos.y;
            if (this.isDraggingBox) this.currentSelectionEnd = { x: pos.x, y: pos.y };
        }, { passive: false });

        this.canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const pos = getTouchPos(e.changedTouches[0]);
            this.mouseX = pos.x;
            this.mouseY = pos.y;
            handleLeftUp(pos.x, pos.y);
        }, { passive: false });
    }

    getSelectionBox() {
        if (!this.isDraggingBox) return null;
        const x = Math.min(this.selectionStart.x, this.currentSelectionEnd.x);
        const y = Math.min(this.selectionStart.y, this.currentSelectionEnd.y);
        const w = Math.abs(this.currentSelectionEnd.x - this.selectionStart.x);
        const h = Math.abs(this.currentSelectionEnd.y - this.selectionStart.y);
        return { x, y, w, h };
    }
}

        { name: 'Commander', color: 'green', spawn: 'A', type: 'human', fraction: 0 },

let game = null; // Game object initialized after config

// Helper: Get all used colors
function getUsedColors() {
    return gameConfig.players.map(p => p.color);
}

// Helper: Get all used spawns
function getUsedSpawns() {
    return gameConfig.players.map(p => p.spawn);
}

// Helper: Get all available colors
function getAvailableColors() {
    const allColors = ['red', 'blue', 'yellow', 'green', 'orange', 'brown', 'magenta', 'black'];
    const used = getUsedColors();
    return allColors.filter(c => !used.includes(c));
}

// Helper: Get all available spawns
function getAvailableSpawns() {
    const allSpawns = ['A', 'B', 'C', 'D'];
    const used = getUsedSpawns();
    return allSpawns.filter(s => !used.includes(s));
}

// Get random element from array
const FRACTION_LABELS = {
    1: 'Ukraine',
    2: 'Russia',
    3: 'US',
    4: 'Iran'
}; // Fraction codes: 1=Ukraine, 2=Russia, 3=US, 4=Iran

function getRandomElement(arr) {
    if (!arr || arr.length === 0) return null;
    return arr[Math.floor(Math.random() * arr.length)];
}

function getRandomFraction() {
    return getRandomElement([1, 2, 3, 4]);
}

function getFractionLabel(id) {
    return FRACTION_LABELS[id] || 'Random';
}

function getBaseTypeId(typeId) {
    if (!typeId || typeof typeId !== 'string') return typeId;
    const parts = typeId.split('_');
    const last = parts[parts.length - 1];
    if (/^[1-4]$/.test(last) && parts.length > 1) {
        return parts.slice(0, -1).join('_');
    }
    return typeId;
}

    // Color change handler with conflict resolution
    function onColorChange(playerIdx, newColor) {
        gameConfig.players[playerIdx].color = newColor;
        
        // Check if another player has same color
        for (let i = 0; i < gameConfig.players.length; i++) {
            if (i !== playerIdx && gameConfig.players[i].color === newColor) {
                const available = getAvailableColors();
                if (available.length > 0) {
                    gameConfig.players[i].color = getRandomElement(available);
                    updateColorDropdown(i);
                } else {
                    // If no colors available, revert change
                    gameConfig.players[playerIdx].color = gameConfig.players[i].color;
                    updateColorDropdown(playerIdx);
                }
            }
        }
    }

    // Spawn change handler with conflict resolution
    function onSpawnChange(playerIdx, newSpawn) {
        gameConfig.players[playerIdx].spawn = newSpawn;
        
        // Check if another player has same spawn
        for (let i = 0; i < gameConfig.players.length; i++) {
            if (i !== playerIdx && gameConfig.players[i].spawn === newSpawn) {
                const available = getAvailableSpawns();
                if (available.length > 0) {
                    gameConfig.players[i].spawn = getRandomElement(available);
                    updateSpawnDropdown(i);
                } else {
                    gameConfig.players[playerIdx].spawn = gameConfig.players[i].spawn;
                    updateSpawnDropdown(playerIdx);
                }

    });

    });

    // AI 1 spawn change

        onSpawnChange(1, e.target.value);
    });

    elems.ai1Fraction.addEventListener('change', (e) => {
        gameConfig.players[1].fraction = parseInt(e.target.value, 10) || 0;
    });

    // AI 2 type change

    });

    // AI 2 color change

    });

    // Speed change
    elems.gameSpeed.addEventListener('change', (e) => {

// Start game after config
function startGame() {
    // Resolve random fractions before game start
    const wasRandom = gameConfig.players.map(p => p.fraction === 0 || p.fraction === '0');
    gameConfig.players.forEach((player) => {
        if (!player.fraction || !FRACTION_LABELS[player.fraction]) {
            player.fraction = getRandomFraction();
        }
    });

    // Calculate game speed factors at start
//todo löschen wenn Ersatz läuft    gameSpeedFactor = gameConfig.gameSpeed;  // For unit movement speed
//    productionFactor = 4 / gameConfig.gameSpeed;  // For production time (inverse)
    // Calculate per-player speed/production factors based on config selections
    const aiSpeedMap = { 'Open': 1, 'Rush-AI': 1, 'Normal-AI': 1.5, 'Turtle-AI': 2, 'Naval-AI': 3 };
    gameConfig.players.forEach((player, index) => {
        let rawValue;
        if (index === 0) {
            rawValue = parseFloat(gameConfig.gameSpeed);
        } else {
            const dropdownId = `config-ai${index}-type`;
            const textVal = document.getElementById(dropdownId)?.value || "Open";
            rawValue = aiSpeedMap[textVal] ?? 1;
        }
        player.gameSpeedFactor = isNaN(rawValue) ? 1 : rawValue;
        player.productionFactor = 4 / player.gameSpeedFactor; // Inverse für Produktionsdauer
    });
    
    // Hide config modal
    document.getElementById('config-overlay').classList.add('hidden');
    
    // Create game instance with config
    game = new Game();
    
    // Show resolved random fraction in UI
    if (wasRandom[0]) {
        const fractionName = FRACTION_LABELS[gameConfig.players[0].fraction] || 'Unknown';
        game.updateUI(`${gameConfig.players[0].name} is ${fractionName}`);
    }
    
    // Apply config values
    game.playerColors = gameConfig.players.map(p => colorMap[p.color] || '#9e3a3a');
    game.units[0].playerColor = game.playerColors[0]; // MCV
    console.log('Game Starting with Config:', gameConfig);
    console.log(`Game Speed Factors: movement=${gameSpeedFactor}, production=${productionFactor}`);
}
