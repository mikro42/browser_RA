<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>browser_RA Skirmish by Miko Mynski</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* --- LAYOUT --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        canvas {
            flex-grow: 1;
            background-color: #2b3a2b;
            cursor: crosshair;
        }

        /* --- SIDEBAR DESIGN --- */
        #sidebar {
            width: 280px;
            height: 100%;
            display: flex;
            background-color: #333;
            border-left: 4px solid #111;
            box-shadow: -5px 0 15px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .icon-strip {
            width: 45px;
            background-color: #1a1a1a;
            border-right: 2px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            gap: 5px;
        }

        .tab-icon {
            width: 36px;
            height: 36px;
            background: #222;
            border: 2px outset #555;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        .tab-icon:hover { background: #333; color: #fff; }
        
        /* Aktiver Tab */
        .tab-icon.active {
            background: #4a5a4a;
            border-style: inset;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
        }

        .tab-icon.disabled {
            filter: grayscale(100%);
            opacity: 0.3;
            pointer-events: none;
            border-color: #333;
        }

        .sidebar-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background-color: #252525;
        }
        
        /* --- UI ELEMENTE --- */

        .radar-box {
            width: 100%;
            height: 140px;
            background-color: #000;
            border: 2px inset #555;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .minimap-text { color: #00ff00; font-size: 10px; padding: 5px; opacity: 0.7; }

        .radar-scan {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 0, 0.3);
            position: absolute;
            top: 0;
            animation: scan 4s infinite linear;
        }
        @keyframes scan { from{top:0;} to{top:100%;} }

        .build-menu-container {
            flex-grow: 1;
            overflow-y: scroll;
            scrollbar-gutter: stable;
            background: #222;
            border: 2px inset #555;
            padding: 10px;
            display: none; 
        }
        
        .build-menu-container.active { display: block; }

        .build-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .build-item {
            aspect-ratio: 1;
            background: #333;
            border: 2px outset #666;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #ccc;
            overflow: hidden; /* Für Progress Bar */
        }

        .build-item:hover { background: #444; border-color: #fff; }

        .build-item.ready {
            border-color: #ffd24d;
            box-shadow: inset 0 0 0 1px rgba(255,210,77,0.8), 0 0 8px rgba(255,210,77,0.35);
        }
        
        /* Placing State für Gebäude */
        .build-item.placing {
            border-color: #00ff00;
            background: #2a3a2a;
        }

        /* Produktion Progress Bar Overlay */
        .progress-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px; /* Dünne Leiste am unteren Rand */
            background-color: #00ff00;
            transform-origin: left;
            transition: height 0.1s;
            z-index: 1;
            opacity: 0.55;
        }
        
        .timer-text {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 8px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            z-index: 3;
        }

        .count-text {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 10px;
            color: #ddd;
            text-shadow: 1px 1px 0 #000;
            z-index: 3;
        }

        .build-item .icon-box,
        .build-item .cost-label {
            position: relative;
            z-index: 2;
        }

        .icon-box {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            border-radius: 3px;
            background: #555; /* Fallback */
        }

        .icon-box.unit-icon {
            width: 72px;
            height: 72px;
            max-width: 80%;
            max-height: 80%;
            font-size: 30px;
            margin-bottom: 0;
            background: #3f3f3f;
            color: #fff;
            position: relative;
        }

        .icon-box .count-text {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            font-size: 11px;
            line-height: 18px;
            color: #fff;
            background: rgba(0, 0, 0, 0.32);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            z-index: 2;
        }

        .build-item.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); border-color: #333;}
        .build-item.disabled .count-text { pointer-events: auto; cursor: pointer; }

        .build-item.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); border-color: #333; pointer-events:none;}

        #unit-info {
            margin-top: auto;
            padding-top: 10px;
            font-size: 11px;
            color: #aaa;
            height: 40px;
            display: flex;
            align-items: center;
        }

        /* --- ACTION BUTTONS ABOVE RADAR --- */
        .action-buttons {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            height: 32px;
        }

        .action-btn {
            flex: 1;
            background: #333;
            border: 2px outset #666;
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.1s;
        }

        .action-btn:hover {
            background: #444;
            border-color: #fff;
        }

        .action-btn:active {
            border-style: inset;
            background: #555;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .action-btn.active {
            background: #6a5a22;
            border-style: inset;
            color: #fff1a6;
        }

        /* --- RESOURCE INFO BELOW RADAR --- */
        .radar-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .info-cell {
            background: #222;
            border: 1px solid #444;
            padding: 6px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 24px;
        }

        #credits-cell {
            text-align: left;
            color: gold;
        }

        #time-cell {
            color: #0f0;
        }

        #energy-cell {
            text-align: right;
            color: gold;
        }

        #energy-cell.low-power {
            color: #ff0000;
        }

        /* --- CONFIG MENU MODAL --- */
        #config-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #config-overlay.hidden {
            display: none;
        }

        #config-modal {
            width: 70%;
            height: 70%;
            background: #2b3a2b;
            background-image:
                linear-gradient(rgba(128, 128, 128, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128, 128, 128, 0.1) 1px, transparent 1px);
            background-size: 25px 25px;
            border: 3px solid #9e3a3a;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(158, 58, 58, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 90vh;
        }

        #config-modal h1 {
            text-align: center;
            color: #9e3a3a;
            margin: 0 0 15px 0;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(158, 58, 58, 0.5);
        }

        .config-section {
            margin-bottom: 15px;
        }

        .config-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
            color: #9e3a3a;
        }

        .config-header {
            display: flex;
            gap: 15px;
            font-weight: bold;
            color: #9e3a3a;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .config-label {
            width: 100px;
            font-weight: bold;
            color: #9e3a3a;
            text-align: right;
        }

        .config-name {
            width: 100px;
            font-size: 16px;
        }

        .config-color {
            width: 80px;
            font-size: 16px;
        }

        .config-team {
            width: 80px;
            font-size: 16px;
        }

        .config-spawn {
            width: 60px;
            font-size: 16px;
        }

        input[type="text"].config-input {
            background: #222;
            border: 2px inset #555;
            color: #fff;
            padding: 6px;
            font-size: 12px;
            color: #ccc;
            margin: 0;
            min-width: 80px;
        }

        input[type="text"].config-input:focus {
            outline: none;
            border-color: #9e3a3a;
            box-shadow: 0 0 5px rgba(158, 58, 58, 0.5);
        }

        select.config-select {
            background: #222;
            border: 2px outset #666;
            color: #ccc;
            padding: 5px;
            font-size: 12px;
            cursor: pointer;
            min-width: 75px;
        }

        select.config-select:hover {
            background: #333;
            border-color: #9e3a3a;
        }

        select.config-select:focus {
            outline: none;
            border-color: #9e3a3a;
            box-shadow: 0 0 5px rgba(158, 58, 58, 0.5);
        }

        input[type="checkbox"].config-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #9e3a3a;
        }

        .config-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            color: #9e3a3a;
        }

        .config-bottom {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
        }

        .config-bottom-left {
            display: flex;
            gap: 30px;
            flex: 1;
        }

        .config-option-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-start;
        }

        .config-option-group label {
            font-weight: bold;
            color: #9e3a3a;
            font-size: 12px;
        }

        button#config-start-btn {
            background: #222;
            border: 3px outset #9e3a3a;
            color: #9e3a3a;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-left: auto;
            transition: all 0.2s;
            text-shadow: 0 0 5px rgba(158, 58, 58, 0.3);
        }

        button#config-start-btn:hover {
            background: #333;
            box-shadow: 0 0 10px rgba(158, 58, 58, 0.4);
            border-style: inset;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="rtscanvas"></canvas>
    
    <!-- CONFIG MODAL OVERLAY -->
    <div id="config-overlay">
        <div id="config-modal">
            <h1>Skirmish Game</h1>
            
            <!-- Player Configuration Section -->
            <div class="config-section">
                <!-- Header Row -->
                <div class="config-header">
                    <div class="config-name" style="margin-left: 100px;">Name</div>
                    <div class="config-color" style="margin-left: 40px;">Color</div>
                    <div class="config-fraction" style="margin-left: 10px;">Fraction</div>
                    <div class="config-spawn" style="margin-left: 10px;">Spawn</div>
                </div>
                
                <!-- Human Player Row -->
                <div class="config-row">
                    <div class="config-label">Human:</div>
                    <input type="text" class="config-input" id="config-human-name" value="Commander" maxlength="20" style="width: 75px;">
                    <select class="config-select config-color-select" id="config-human-color">
                        <option value="brown">🟫🟫🟫</option>
                        <option value="red">🟥🟥🟥</option>
                        <option value="orange">🟧🟧🟧</option>
                        <option value="yellow">🟨🟨🟨</option>
                        <option value="green">🟩🟩🟩</option>
                        <option value="blue">🟦🟦🟦</option>
                        <option value="magenta">🟪🟪🟪</option>
                        <option value="black">⬛⬛⬛</option>
                    </select>
                    <select class="config-select" id="config-human-fraction" style="width: 110px; margin-left: 10px;">
                        <option value="0" selected>Random</option>
                        <option value="1">Ukraine</option>
                        <option value="2">Russia</option>
                        <option value="3">US</option>
                        <option value="4">Iran</option>
                    </select>
                    <select class="config-select" id="config-human-spawn">
                        <option value="A">A (Top-Left)</option>
                        <option value="B">B (Top-Right)</option>
                        <option value="C">C (Bot-Right)</option>
                        <option value="D">D (Bot-Left)</option>
                    </select>
                </div>
                
                <!-- AI Player 1 Row -->
                <div class="config-row">
                    <div class="config-label">AI 1:</div>
                    <select class="config-select" id="config-ai1-type" style="width: 96px;">
                        <option value="Open">Open</option>
                        <option value="Rush-AI">Rush-AI</option>
                        <option value="Normal-AI">Normal-AI</option>
                        <option value="Turtle-AI">Turtle-AI</option>
                        <option value="Naval-AI" selected>Naval-AI</option>
                    </select>
                    <select class="config-select config-color-select" id="config-ai1-color">
                        <option value="brown">🟫🟫🟫</option>
                        <option value="red"selected>🟥🟥🟥</option>
                        <option value="orange">🟧🟧🟧</option>
                        <option value="yellow">🟨🟨🟨</option>
                        <option value="green">🟩🟩🟩</option>
                        <option value="blue">🟦🟦🟦</option>
                        <option value="magenta">🟪🟪🟪</option>
                        <option value="black">⬛⬛⬛</option>
                    </select>
                    <select class="config-select" id="config-ai1-fraction" style="width: 110px; margin-left: 10px;">
                        <option value="0">Random</option>
                        <option value="1">Ukraine</option>
                        <option value="2">Russia</option>
                        <option value="3">US</option>
                        <option value="4">Iran</option>
                    </select>
                    <select class="config-select" id="config-ai1-spawn">
                        <option value="A">A (Top-Left)</option>
                        <option value="B">B (Top-Right)</option>
                        <option value="C">C (Bot-Right)</option>
                        <option value="D">D (Bot-Left)</option>
                    </select>
                </div>
                
                <!-- AI Player 2 Row -->
                <div class="config-row">
                    <div class="config-label">AI 2:</div>
                    <select class="config-select" id="config-ai2-type" style="width: 96px;">
                        <option value="Open" selected>Open</option>
                        <option value="Rush-AI">Rush-AI</option>
                        <option value="Normal-AI">Normal-AI</option>
                        <option value="Turtle-AI">Turtle-AI</option>
                        <option value="Naval-AI">Naval-AI</option>
                    </select>
                    <select class="config-select config-color-select" id="config-ai2-color">
                        <option value="brown">🟫🟫🟫</option>
                        <option value="red">🟥🟥🟥</option>
                        <option value="orange">🟧🟧🟧</option>
                        <option value="yellow">🟨🟨🟨</option>
                        <option value="green">🟩🟩🟩</option>
                        <option value="blue">🟦🟦🟦</option>
                        <option value="magenta">🟪🟪🟪</option>
                        <option value="black">⬛⬛⬛</option>
                    </select>
                    <select class="config-select" id="config-ai2-fraction" style="width: 110px; margin-left: 10px;">
                        <option value="0">Random</option>
                        <option value="1">Ukraine</option>
                        <option value="2">Russia</option>
                        <option value="3">US</option>
                        <option value="4">Iran</option>
                    </select>
                    <select class="config-select" id="config-ai2-spawn">
                        <option value="A">A (Top-Left)</option>
                        <option value="B">B (Top-Right)</option>
                        <option value="C">C (Bot-Right)</option>
                        <option value="D" selected>D (Bot-Left)</option>
                    </select>
                </div>
                
                <!-- AI Player 3 Row -->
                <div class="config-row">
                    <div class="config-label">AI 3:</div>
                    <select class="config-select" id="config-ai3-type" style="width: 96px;">
                        <option value="Open" selected>Open</option>
                        <option value="Rush-AI">Rush-AI</option>
                        <option value="Normal-AI">Normal-AI</option>
                        <option value="Turtle-AI">Turtle-AI</option>
                        <option value="Naval-AI">Naval-AI</option>
                    </select>
                    <select class="config-select config-color-select" id="config-ai3-color">
                        <option value="brown">🟫🟫🟫</option>
                        <option value="red">🟥🟥🟥</option>
                        <option value="orange">🟧🟧🟧</option>
                        <option value="yellow">🟨🟨🟨</option>
                        <option value="green">🟩🟩🟩</option>
                        <option value="blue">🟦🟦🟦</option>
                        <option value="magenta">🟪🟪🟪</option>
                        <option value="black">⬛⬛⬛</option>
                    </select>
                    <select class="config-select" id="config-ai3-fraction" style="width: 110px; margin-left: 10px;">
                        <option value="0">Random</option>

                    </select>

                    </select>
                </div>
            </div>
            
            <!-- Game Options Section -->
            <div class="config-section">
                <div class="config-row" style="margin-top: 10px;">
                    <label class="config-checkbox-label">
                        <input type="checkbox" class="config-checkbox" id="config-short-game">
                        <span>Short Game</span>
                    </label>
                    <label class="config-checkbox-label" style="margin-left: 30px;">
                        <input type="checkbox" class="config-checkbox" id="config-limited-build">
                        <span>Limited Build Area</span>
                    </label>
                </div>
            </div>
            
            <!-- Bottom Options Row -->
            <div class="config-bottom">
                <div class="config-bottom-left">
                    <div class="config-option-group">
                        <label>Starting Cash</label>
                        <select class="config-select" id="config-starting-cash">
                            <option value="2500">$2500</option>
                            <option value="5000" selected>$5000</option>
                            <option value="10000">$10000</option>
                            <option value="20000">$20000</option>
                        </select>
                    </div>
                    <div class="config-option-group">
                        <label>Game Speed</label>
                        <select class="config-select" id="config-game-speed">
                            <option value="1">Slowest</option>
                            <option value="1.5">Slower</option>
                            <option value="2" selected>Normal</option>
                            <option value="3">Faster</option>
                            <option value="4">Fastest</option>
                        </select>
                    </div>
                </div>
                <button id="config-start-btn">START</button>
            </div>
        </div>
    </div>
    
    <!-- SIDEBAR -->
    <aside id="sidebar">
        
        <!-- Icon Strip -->
        <div class="icon-strip">
            <div class="tab-icon disabled" id="btn-buildings" onclick="game.switchTab('buildings')" title="Buildings">🏠</div>
            <div class="tab-icon disabled" id="btn-defense" onclick="game.switchTab('defense')" title="Defense">🛡️</div>
            <!-- Infantry Tab -->
            <div class="tab-icon disabled" id="btn-infantry" onclick="game.switchTab('infantry')" title="Infantry">👮</div>
            <!-- Vehicles Tab -->
            <div class="tab-icon disabled" id="btn-vehicles" onclick="game.switchTab('vehicles')" title="Vehicles">🚙</div>
            
            <div class="tab-icon disabled" id="btn-aircraft" onclick="game.switchTab('aircraft')" title="Aircraft">✈️</div>
        </div>

        <!-- Content -->
        <div class="sidebar-content">

            <!-- Action Buttons Above Radar -->
            <div class="action-buttons">
                <button class="action-btn" id="action-beacon" title="Place Beacon">👇</button>
                <button class="action-btn" id="action-sell" title="Sell">💲</button>
                <button class="action-btn" id="action-power" title="Power Down">⚡</button>
                <button class="action-btn" id="action-repair" title="Repair">🔧</button>
                <button class="action-btn" id="action-options" title="Options">⚙️</button>
            </div>

            <div class="radar-box">
                <div class="minimap-text">SECTOR SCAN ACTIVE...</div>
                <div class="radar-scan"></div>
            </div>

            <!-- Resource Info Below Radar -->
            <div class="radar-info">
                <div class="info-cell" id="credits-cell">
                    $<span id="credits-info">5000</span>
                </div>
                <div class="info-cell" id="time-cell">
                    <span id="game-time">0:00</span>
                </div>
                <div class="info-cell" id="energy-cell">
                    <span id="energy-display">0</span>⚡
                </div>
            </div>

            <!-- 1. Buildings Menu -->
            <div id="menu-buildings" class="build-menu-container active">
                <div class="build-grid" id="grid-buildings"></div>
            </div>

            <!-- 1b. Defense Menu -->
            <div id="menu-defense" class="build-menu-container">
                <div style="display:none;" id="defense-msg"></div>
                <div class="build-grid" id="grid-defense"></div>

function getBuildingGridRect(building) {
    const widthTiles = building.widthTiles || Math.max(1, Math.round((building.drawSize || TILE_SIZE) / TILE_SIZE));
    const heightTiles = building.heightTiles || widthTiles;

    let tileX;
    let tileY;

    if (typeof building.tileX === 'number' && typeof building.tileY === 'number') {
        tileX = building.tileX;
        tileY = building.tileY;
    } else {
        const cx = building.x ?? TILE_SIZE / 2;
        const cy = building.y ?? TILE_SIZE / 2;
        tileX = Math.round(cx / TILE_SIZE - widthTiles / 2);
        tileY = Math.round(cy / TILE_SIZE - heightTiles / 2);
    }

    return { tileX, tileY, widthTiles, heightTiles };
}

function getBuildingPixelRect(building) {
    const grid = getBuildingGridRect(building);
    return {
        x: grid.tileX * TILE_SIZE,
        y: grid.tileY * TILE_SIZE,
        width: grid.widthTiles * TILE_SIZE,
        height: grid.heightTiles * TILE_SIZE
    };
}

function getBuildingBodyPixelRect(building) {
    const rect = getBuildingPixelRect(building);
    const bibRows = Math.max(0, Math.min(building.bibRows || 0, building.heightTiles || 0));
    const bibHeight = bibRows * TILE_SIZE;

    return {
        x: rect.x,
        y: rect.y,
        width: rect.width,
        height: Math.max(0, rect.height - bibHeight),
        bibY: rect.y + rect.height - bibHeight,
        bibHeight
    };
}

function getBuildingBlockedGridRect(building) {
    const grid = getBuildingGridRect(building);
    const bibRows = Math.max(0, Math.min(building.bibRows || 0, grid.heightTiles));

    return {
        tileX: grid.tileX,
        tileY: grid.tileY,
        widthTiles: grid.widthTiles,
        heightTiles: Math.max(0, grid.heightTiles - bibRows)
    };
}

function getBuildingCenter(building) {
    const rect = getBuildingPixelRect(building);
    return {
        x: rect.x + rect.width / 2,
        y: rect.y + rect.height / 2
    };
}

function distancePointToRect(px, py, rect) {
    const dx = Math.max(rect.x - px, 0, px - (rect.x + rect.width));
    const dy = Math.max(rect.y - py, 0, py - (rect.y + rect.height));
    return Math.hypot(dx, dy);
}

function getBuildingDisplayName(id) {
    if (BUILDING_TYPES[id]) return BUILDING_TYPES[id].name;
    if (DEFENSE_TYPES[id]) return DEFENSE_TYPES[id].name;
    if (id === 'constructionyard') return 'Construction Yard';
    return id;
}

function splitLabelTwoLines(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (words.length <= 1) return [text];
    if (words.length === 2) return [words[0], words[1]];
    const mid = Math.ceil(words.length / 2);
    return [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
}

// --- A* PATHFINDER ---
class Pathfinder {
    static getGridPos(x, y) {
        return { x: Math.floor(x / TILE_SIZE), y: Math.floor(y / TILE_SIZE) };
    }

    // Findet Pfad von Start (Pixel) zu Ziel (Pixel) unter Berücksichtigung von Gebäude-Blockaden
    static findPath(startX, startY, endX, endY, buildings, mapWidth, mapHeight, options = {}) {
        const startNode = this.getGridPos(startX, startY);
        const endNode = this.getGridPos(endX, endY);
        const allowEndInBlocked = !!options.allowEndInBlocked;

        // Grid Dimensionen
        const cols = Math.ceil(mapWidth / TILE_SIZE);
        const rows = Math.ceil(mapHeight / TILE_SIZE);

        // Closed Set (Besuchte Nodes)
        const closedSet = new Set();
        
        // Open Set (zu besuchende Nodes) mit Priority Queue simuliert durch Array Sortierung
        let openSet = [startNode];
        
        // CameFrom Map für Rekonstruktion
        const cameFrom = new Map();

        // gScore: Kosten vom Start bis hier
        const gScore = new Map();
        gScore.set(this.key(startNode), 0);

        // fScore: Geschätzte Gesamtkosten
        const fScore = new Map();
        fScore.set(this.key(startNode), Math.hypot(endNode.x - startNode.x, endNode.y - startNode.y));

        while (openSet.length > 0) {
            // Node mit niedrigstem fScore holen
            openSet.sort((a, b) => {
                const fa = fScore.get(this.key(a)) ?? Infinity;
                const fb = fScore.get(this.key(b)) ?? Infinity;
                return fa - fb;
            });
            
            const current = openSet.shift();

            // Ziel erreicht?
            if (current.x === endNode.x && current.y === endNode.y) {
                return this.reconstructPath(cameFrom, current);
            }

            closedSet.add(this.key(current));

            // Nachbarn
            const neighbors = [
                {x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0} // 4-Richtung
                // Diagonale könnten hier ergänzt werden, aber für RTT ist Manhattan oft besser
            ];

            for (let offset of neighbors) {
                const neighbor = { x: current.x + offset.x, y: current.y + offset.y };
                const nKey = this.key(neighbor);

                // Grenzen prüfen
                if (neighbor.x < 0 || neighbor.x >= cols || neighbor.y < 0 || neighbor.y >= rows) continue;
                
                // Kollision mit Gebäuden
                let blocked = false;
                for(let b of buildings) {
                    const bGrid = getBuildingBlockedGridRect(b);
                    if (neighbor.x >= bGrid.tileX && neighbor.x < bGrid.tileX + bGrid.widthTiles &&
                        neighbor.y >= bGrid.tileY && neighbor.y < bGrid.tileY + bGrid.heightTiles) {
                        blocked = true;
                        break;
                    }
                }

                // Ziel in blockierter Zelle nur erlauben, wenn explizit freigegeben (z.B. Harvester-Dock).
                if (blocked && !(allowEndInBlocked && neighbor.x === endNode.x && neighbor.y === endNode.y)) continue;

                if (closedSet.has(nKey)) continue;

                const tentativeG = gScore.get(this.key(current)) + 1; // Kosten immer 1 pro Kachel

                if (tentativeG < (gScore.get(nKey) ?? Infinity)) {
                    cameFrom.set(nKey, current);
                    gScore.set(nKey, tentativeG);
                    fScore.set(nKey, tentativeG + Math.hypot(endNode.x - neighbor.x, endNode.y - neighbor.y));
                    
                    if (!openSet.some(n => n.x === neighbor.x && n.y === neighbor.y)) {
                        openSet.push(neighbor);
                    }
                }
            }
        }
        
        // Kein Pfad gefunden (Direkte Linie als Fallback für sehr kurze Distanzen oder Bug-Vermeidung)
        return null; 
    }

    static key(node) { return `${node.x},${node.y}`; }

    static reconstructPath(cameFrom, current) {
        const totalPath = [current];
        let cKey = this.key(current);
        while (cameFrom.has(cKey)) {
            current = cameFrom.get(cKey);
            cKey = this.key(current);
            totalPath.unshift(current);
        }
        
        // Konvertiere Grid-Koordinaten zurück zu Pixel-Mittelpunkten
        return totalPath.map(n => ({ x: n.x * TILE_SIZE + TILE_SIZE/2, y: n.y * TILE_SIZE + TILE_SIZE/2 }));
    }
}

// --- ENTITY KLASSEN ---

class Entity {
    constructor(x, y, owner, typeKey) {
        this.id = Math.random().toString(36).substr(2, 9);
        this.x = x;
        this.y = y;
        if (owner && typeof owner === 'object') {
            this.ownerData = owner;
            this.owner = owner.type || owner.name || 'human';
        } else {
            this.ownerData = null;
            this.owner = owner;
        }
        this.typeKey = typeKey || 'tank';
        
        const stats = UNIT_TYPES[this.typeKey] || UNIT_TYPES['tank'];
        this.type = stats.type; // infantry, vehicle, harvester
        this.speed = stats.speed;
        this.radius = ((this.type === 'infantry') ? 6 : 14) * WORLD_SCALE;

        this.selected = false;
        // Anzeigeposition für Infanterie-Würfelaugen-Gruppierung (gesetzt durch computeInfantryDisplayPositions)
        this._dispX = x;
        this._dispY = y;
        this.formationGroupId = null;
        this.formationIsLeader = false;
        this.formationOffsetX = 0;
        this.formationOffsetY = 0;
        this.regroupOnArrival = false;
        this.targetX = null;
        this.targetY = null;
        
        // Pfadfindung
        this.path = []; // Array von {x,y} Punkten
        this.currentPathIndex = 0;
        
        // Harvester spezifisch
        this.harvestedDistance = 0; // Pixel
        this.maxHarvestDist = 35 * TILE_SIZE; // Voll nach 35 Kacheln

        this.allowEndInBlocked = false;
        this.playerColor = this.ownerData ? colorMap[this.ownerData.color] || '#9e3a3a' : null;
        this.faction = this.ownerData ? this.ownerData.fraction : null;

        if (this.type === 'harvester') {
            this.harvesterNormalSpeed = stats.speed;
            this.harvesterHarvestSpeed = stats.speed * 0.5;
            this.harvesterState = 'leaving'; // leaving | harvesting | returning | unloading | manual
            this.leaveDistance = 0;
            this.leaveDistanceTarget = 10 * TILE_SIZE;
            this.harvesterHeading = Math.random() * Math.PI * 2;
            this.targetRefinery = null;
            this.unloadDurationMs = 10000;
            this.unloadingUntil = 0;
            this.unloadStartMs = 0;
            this.unloadProgressMs = 0;
            this.unloadLastTick = 0;
            this.unloadTickIndex = 0;
            this.unloadCreditsPerSecond = 70;
            this.unloadTotalTicks = 10;
            this.blockedFrames = 0;
            this.pathAfterDetour = null;
        }

        if (this.type === 'aircraft') {
            this.parking = true; // Geparkt auf Helipad
            this.helicopterHeading = Math.PI * 3/2; // Blick nach Westen (links), entgegengesetzt zur Tank-Ausrichtung
            this.targetHelipad = null; // Zugehöriges Helipad
        }
    }

    update(units, buildings) {
        if (this.type === 'harvester') {
            this.updateHarvester(units, buildings);
            return;
        }

        if (this.type === 'infantry' && this.formationGroupId !== null && !this.formationIsLeader) {
            return;
        }

        this.moveAlongPath(units, buildings, false);
    }

    setMoveTarget(x, y, allowEndInBlocked = false) {
        this.targetX = x;
        this.targetY = y;
        this.path = [];
        this.currentPathIndex = 0;
        this.allowEndInBlocked = allowEndInBlocked;
    }

    moveAlongPath(units, buildings, allowEndInBlocked = false) {
        if (this.targetX === null || this.targetY === null) {
            return { movedDistance: 0, reachedDestination: false };
        }

        if (!this.path || this.path.length === 0) {
            const p = Pathfinder.findPath(
                this.x,
                this.y,
                this.targetX,
                this.targetY,
                buildings,
                window.innerWidth - 280,
                window.innerHeight,
                { allowEndInBlocked }
            );

            if (p && p.length > 1) {
                this.path = p;
                this.currentPathIndex = 1;
            } else {
                const prevX = this.x;
                const prevY = this.y;
                this.moveToDirect(this.targetX, this.targetY);
                const movedDistance = Math.hypot(this.x - prevX, this.y - prevY);

                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) <= this.speed * gameSpeedFactor) {
                    this.targetX = null;
                    this.targetY = null;
                    this.path = [];
                    this.currentPathIndex = 0;
                    this.allowEndInBlocked = false;
                    return { movedDistance, reachedDestination: true };
                }

                return { movedDistance, reachedDestination: false };
            }
        }

        let movedDistance = 0;

        if (this.path && this.currentPathIndex < this.path.length) {
            const nextPoint = this.path[this.currentPathIndex];
            const dx = nextPoint.x - this.x;
            const dy = nextPoint.y - this.y;
            const dist = Math.hypot(dx, dy);
            const prevX = this.x;
            const prevY = this.y;

            const moveMult = this.ownerData?.gameSpeedFactor || 1;
            if (dist < this.speed * moveMult) {
                this.x = nextPoint.x;
                this.y = nextPoint.y;
                this.currentPathIndex++;
            } else {
                const angle = Math.atan2(dy, dx);

                let avoidX = 0, avoidY = 0;
                units.forEach(other => {
                    if (other !== this) {
                        if (this.formationGroupId !== null && other.formationGroupId === this.formationGroupId) return;
                        const dOther = Math.hypot(this.x - other.x, this.y - other.y);
                        if (dOther < this.radius * 2 + 5) {
                            avoidX += (this.x - other.x);
                            avoidY += (this.y - other.y);
                        }
                    }
                });

                const avoidDist = Math.hypot(avoidX, avoidY);
                if (avoidDist > 0) {
                    const moveMult = this.ownerData?.gameSpeedFactor || 1;
                    avoidX = (avoidX / avoidDist) * this.speed * moveMult;
                    avoidY = (avoidY / avoidDist) * this.speed * moveMult;
                    this.x += Math.cos(angle) * (this.speed * moveMult * 0.5) + avoidX * 0.5;
                    this.y += Math.sin(angle) * (this.speed * moveMult * 0.5) + avoidY * 0.5;
                } else {
                    this.x += Math.cos(angle) * this.speed * moveMult;
                    this.y += Math.sin(angle) * this.speed * moveMult;
                }
            }

            movedDistance = Math.hypot(this.x - prevX, this.y - prevY);
        }

        if (!this.path || this.currentPathIndex >= this.path.length) {
            this.targetX = null;
            this.targetY = null;
            this.path = [];
            this.currentPathIndex = 0;
            this.allowEndInBlocked = false;
            return { movedDistance, reachedDestination: true };
        }

        return { movedDistance, reachedDestination: false };
    }

    resolveHarvesterRefinery(buildings) {
        if (this.targetRefinery && buildings.includes(this.targetRefinery) && getBaseTypeId(this.targetRefinery.name) === 'refinery') {
            return this.targetRefinery;
        }

        // Nur Raffinerien des eigenen Besitzers als Ziel erlauben (dynamisch für Human & AI)
        const nearest = buildings
            .filter(b => getBaseTypeId(b.name) === 'refinery' && b.owner === this.owner)
            .sort((a, b) => {
                const ca = getBuildingCenter(a);
                const cb = getBuildingCenter(b);
                return Math.hypot(this.x - ca.x, this.y - ca.y) - Math.hypot(this.x - cb.x, this.y - cb.y);
            })[0] || null;

        this.targetRefinery = nearest;
        return nearest;
    }


    setNextHarvesterRoamTarget() {
        if (!game || !game.canvas) return;

        const step = TILE_SIZE * 3;
        const margin = TILE_SIZE * 0.6;
        const maxX = game.canvas.width - margin;
        const maxY = game.canvas.height - margin;

        let nextX = this.x + Math.cos(this.harvesterHeading) * step;
        let nextY = this.y + Math.sin(this.harvesterHeading) * step;

        if (nextX < margin || nextX > maxX) {
            this.harvesterHeading = Math.PI - this.harvesterHeading;
            nextX = this.x + Math.cos(this.harvesterHeading) * step;
        }

        if (nextY < margin || nextY > maxY) {
            this.harvesterHeading = -this.harvesterHeading;
            nextY = this.y + Math.sin(this.harvesterHeading) * step;
        }

        nextX = Math.max(margin, Math.min(maxX, nextX));
        nextY = Math.max(margin, Math.min(maxY, nextY));

        if (game && typeof game.getValidatedMoveTarget === 'function') {
            const safe = game.getValidatedMoveTarget(this, nextX, nextY, { allowRefineryDock: false });
            nextX = safe.x;
            nextY = safe.y;
        }

        this.setMoveTarget(nextX, nextY, false);
    }

    orderHarvesterReturnToRefinery(refinery, dockX, dockY) {
        this.targetRefinery = refinery;
        this.harvesterState = 'returning';
        this.speed = this.harvesterNormalSpeed;
        this.setMoveTarget(dockX, dockY, true);
    }

    startHarvesterUnload() {
        this.harvesterState = 'unloading';
        this.unloadStartMs = Date.now();
        this.unloadProgressMs = 0;
        this.unloadLastTick = this.unloadStartMs;
        this.unloadTickIndex = 0;
        this.hitStorageLimitThisUnload = false;
        this.targetX = null;
        this.targetY = null;
        this.path = [];
        this.currentPathIndex = 0;
        this.allowEndInBlocked = false;
        game.updateUI('Harvester entlädt...');
    }

    updateHarvester(units, buildings) {
        const now = Date.now();
        const refinery = this.resolveHarvesterRefinery(buildings);

        if (this.harvesterState === 'unloading') {
            if (!this.unloadLastTick) this.unloadLastTick = now;
            const delta = Math.max(0, now - this.unloadLastTick);
            this.unloadLastTick = now;
            const speedFactor = (game && typeof game.getProductionSpeedFactor === 'function') ? game.getProductionSpeedFactor() : 1;
            this.unloadProgressMs = Math.min(this.unloadDurationMs, this.unloadProgressMs + delta * speedFactor);

            const elapsedSec = Math.floor(this.unloadProgressMs / 1000);
            const payableTicks = Math.min(this.unloadTotalTicks, elapsedSec);

            while (this.unloadTickIndex < payableTicks) {
                const harvestCreditResult = game.addHarvestCredits(this.unloadCreditsPerSecond, game.getAccount(0));
                if (harvestCreditResult.lost > 0) {
                    this.hitStorageLimitThisUnload = true;
                    console.log('Silos needed');
                }
                this.unloadTickIndex++;
                if (this.hitStorageLimitThisUnload) game.updateUI('Silos needed');
                else game.updateUI(`Harvester entlädt... +$${this.unloadTickIndex * this.unloadCreditsPerSecond}`);
            }

            if (this.unloadProgressMs >= this.unloadDurationMs) {
                this.harvestedDistance = 0;
                this.leaveDistance = 0;
                this.harvesterHeading = Math.random() * Math.PI * 2;
                this.harvesterState = 'leaving';
                this.speed = this.harvesterNormalSpeed;
                this.unloadTickIndex = 0;
                this.unloadProgressMs = 0;
                this.unloadLastTick = 0;
                if (this.hitStorageLimitThisUnload) game.updateUI('Silos needed');
                else game.updateUI('Harvester entladen.');
            }
            return;
        }

        if (!refinery && this.harvesterState === 'returning') {
            this.harvesterState = 'manual';
            this.allowEndInBlocked = false;
        }

        if (this.harvesterState === 'leaving' || this.harvesterState === 'harvesting') {
            if (this.targetX === null || this.targetY === null) {
                this.setNextHarvesterRoamTarget();
            }
        }

        if (this.harvesterState === 'returning' && this.targetX === null && refinery) {
            const dock = game.getRefineryUnloadPoint(refinery);
            this.setMoveTarget(dock.x, dock.y, true);
        }

        this.speed = (this.harvesterState === 'harvesting') ? this.harvesterHarvestSpeed : this.harvesterNormalSpeed;

        const movement = this.moveAlongPath(units, buildings, this.allowEndInBlocked);

        if (this.targetX !== null && this.targetY !== null) {
            const moveMult = this.ownerData?.gameSpeedFactor || 1;
            const moveThreshold = Math.max(0.03, this.speed * moveMult * 0.08);
            if (movement.movedDistance < moveThreshold) this.blockedFrames++;
            else this.blockedFrames = 0;

            if (this.blockedFrames > 20) {
                const originalTarget = {
                    x: this.targetX,
                    y: this.targetY,
                    allowEndInBlocked: this.allowEndInBlocked
                };

                const approachAngle = Math.atan2(originalTarget.y - this.y, originalTarget.x - this.x);
                const side = Math.random() < 0.5 ? -1 : 1;
                const dodgeAngle = approachAngle + side * Math.PI / 2;
                const step = TILE_SIZE * 1.2;
                const margin = TILE_SIZE * 0.6;
                const maxX = (game?.canvas?.width ?? (window.innerWidth - 280)) - margin;
                const maxY = (game?.canvas?.height ?? window.innerHeight) - margin;
                const dodgeX = Math.max(margin, Math.min(maxX, this.x + Math.cos(dodgeAngle) * step));
                const dodgeY = Math.max(margin, Math.min(maxY, this.y + Math.sin(dodgeAngle) * step));

                this.pathAfterDetour = originalTarget;
                this.setMoveTarget(dodgeX, dodgeY, false);
                this.blockedFrames = 0;
            }
        } else {
            this.blockedFrames = 0;
        }

        if (this.pathAfterDetour && this.targetX === null && this.targetY === null) {
            const resume = this.pathAfterDetour;
            this.pathAfterDetour = null;
            this.setMoveTarget(resume.x, resume.y, resume.allowEndInBlocked);
        }

        if (this.harvesterState === 'leaving') {
            this.leaveDistance += movement.movedDistance;
            if (this.leaveDistance >= this.leaveDistanceTarget) {
                this.harvesterState = 'harvesting';
                this.speed = this.harvesterHarvestSpeed;
                this.path = [];
            }
        } else if (this.harvesterState === 'harvesting') {
            this.harvestedDistance = Math.min(this.maxHarvestDist, this.harvestedDistance + movement.movedDistance);
            if (this.harvestedDistance >= this.maxHarvestDist && refinery) {
                this.harvesterState = 'returning';
                this.speed = this.harvesterNormalSpeed;
                this.path = [];
                this.targetX = null;
                this.targetY = null;
            }
        }

        if ((this.harvesterState === 'leaving' || this.harvesterState === 'harvesting') && movement.reachedDestination) {
            this.setNextHarvesterRoamTarget();
        }

        if (this.harvesterState === 'returning' && refinery) {
            const dock = game.getRefineryUnloadPoint(refinery);
            const dockDist = Math.hypot(this.x - dock.x, this.y - dock.y);
            if (dockDist <= Math.max(4, this.speed * gameSpeedFactor + 1)) {
                if (this.harvestedDistance >= this.maxHarvestDist) {
                    this.startHarvesterUnload();
                } else {
                    this.harvesterState = 'leaving';
                    this.leaveDistance = 0;
                    this.harvesterHeading = Math.random() * Math.PI * 2;
                    this.path = [];
                    this.targetX = null;
                    this.targetY = null;
                    this.allowEndInBlocked = false;
                }
            }
        }

        if (this.harvesterState === 'manual' && this.targetX === null) {
            this.speed = this.harvesterNormalSpeed;
        }
    }
    
    moveToDirect(tx, ty) {
         const dx = tx - this.x;
         const dy = ty - this.y;
         const dist = Math.hypot(dx, dy);
         if(dist > 0) {
            this.x += (dx/dist) * this.speed * gameSpeedFactor;
            this.y += (dy/dist) * this.speed * gameSpeedFactor;
         }
    }

    draw(ctx) {
        const px = WORLD_SCALE;

        ctx.save();
        ctx.translate(
            this.type === 'infantry' ? this._dispX : this.x,
            this.type === 'infantry' ? this._dispY : this.y
        );

        if (this.selected) {
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            ctx.beginPath(); 
            ctx.arc(0, 0, this.radius + 6 * px, 0, Math.PI * 2); 
            ctx.stroke();
            
            // Healthbar placeholder
            ctx.fillStyle = 'green';
            ctx.fillRect(-10 * px, -this.radius - 8 * px, 20 * px, 3 * px);
        }

        const color = this.playerColor || ((this.owner === gameConfig.players[0].type) ? '#4da6ff' : '#ff3333');

        if(this.type === 'infantry') {
            const isCivilian = this.typeKey === 'civilian1' || this.typeKey === 'civilian2';
            const torsoColor = this.typeKey === 'civilian1' ? '#cf5c78' : (this.typeKey === 'civilian2' ? '#4a9f78' : this.playerColor || color);
            const legColor = this.typeKey === 'civilian1' ? '#3757a6' : (this.typeKey === 'civilian2' ? '#8a6a2c' : this.playerColor || color);
            const skinColor = '#f2c9a0';

            ctx.lineWidth = 2 * px;

            // Kopf
            ctx.fillStyle = skinColor;
            ctx.beginPath(); ctx.arc(0, -6 * px, 4 * px, 0, Math.PI*2); ctx.fill();

            if (isCivilian) {
                ctx.fillStyle = torsoColor;
                ctx.fillRect(-3 * px, -2 * px, 6 * px, 8 * px);

                ctx.strokeStyle = skinColor;
                ctx.beginPath();
                ctx.moveTo(-2 * px, -1 * px); ctx.lineTo(-5 * px, 3 * px);
                ctx.moveTo(2 * px, -1 * px); ctx.lineTo(5 * px, 3 * px);
                ctx.stroke();

                ctx.strokeStyle = legColor;
                ctx.beginPath();
                ctx.moveTo(-1 * px, 6 * px); ctx.lineTo(-3 * px, 11 * px);
                ctx.moveTo(1 * px, 6 * px); ctx.lineTo(3 * px, 11 * px);
                ctx.stroke();
            } else {
                // --- STRICHMÄNNCHEN ---
                ctx.strokeStyle = color;

                // Körper
                ctx.beginPath(); ctx.moveTo(0, -2 * px); ctx.lineTo(0, 5 * px); ctx.stroke();

                // Arme (Waffe halten)
                ctx.beginPath();
                ctx.moveTo(-3 * px, 0); ctx.lineTo(3 * px, 2 * px);
                ctx.lineTo(6 * px, -1 * px); ctx.stroke();

                // Beine
                ctx.beginPath();
                ctx.moveTo(0, 5 * px); ctx.lineTo(-3 * px, 10 * px);
                ctx.moveTo(0, 5 * px); ctx.lineTo(3 * px, 9 * px);
                ctx.stroke();
            }
            
        } else if (this.type === 'harvester') {
             // --- HARVESTER ---
             // Dreht sich in Bewegungsrichtung
             let angle = 0;
             if(this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
             
             ctx.rotate(angle + Math.PI/2);

             // Chassis (Gelb)
             ctx.fillStyle = this.playerColor || '#cc9900';
             ctx.fillRect(-12 * px, -14 * px, 24 * px, 28 * px);
             
             // Rad hinten
             ctx.fillStyle = '#333';
             ctx.beginPath(); ctx.arc(0, 10 * px, 6 * px, 0, Math.PI*2); ctx.fill();
             
             // Kabine vorne
             ctx.fillStyle = '#663300'; // Braun
             ctx.fillRect(-8 * px, -14 * px, 16 * px, 12 * px);
             
             // Lader / Mulde (Grafik)
             ctx.strokeStyle = '#fff';
             ctx.lineWidth = 1 * px;
             ctx.strokeRect(-10 * px, -6 * px, 20 * px, 14 * px);
             
             // Füllstand Anzeige
             const fillPct = Math.min(1, this.harvestedDistance / this.maxHarvestDist);
             if(fillPct > 0.01) {
                 ctx.fillStyle = `rgba(255, 215, 0, ${fillPct})`;
                 ctx.fillRect(-9 * px, -5 * px, 18 * fillPct * px, 12 * px);
             }

             if (this.selected) {
                 const boxes = 5;
                 const boxSize = 2;
                 const gap = 1;
                 const totalWidth = boxes * boxSize + (boxes - 1) * gap;
                 const startX = -totalWidth / 2;
                 const y = 12 * px;
                 const filled = Math.min(boxes, Math.floor((this.harvestedDistance / this.maxHarvestDist) * boxes + 0.0001));

                 for (let i = 0; i < boxes; i++) {
                     const bx = startX + i * (boxSize + gap);
                     ctx.fillStyle = (i < filled) ? '#00ff44' : '#1a2a1a';
                     ctx.fillRect(bx, y, boxSize, boxSize);

                     if (i < boxes - 1) {
                         ctx.fillStyle = '#0b0b0b';
                         ctx.fillRect(bx + boxSize, y, 1, boxSize);
                     }
                 }
             }

        } else if (this.typeKey === 'mcv') {
            let angle = 0;
            if(this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);

            ctx.rotate(angle + Math.PI/2);

            const c = this.playerColor || '#8a7d60';
            const d = '#4a4535';
            const w = '#1a1a1a';
            const g = '#999';

            // Trailer (leicht abgetrennt)
            ctx.fillStyle = c;
            ctx.fillRect(-8 * px, 6 * px, 16 * px, 14 * px);
            ctx.strokeStyle = d; ctx.lineWidth = 1.5 * px;
            ctx.strokeRect(-6 * px, 7 * px, 12 * px, 10 * px);

            // Kupplung/Verbindungslinie
            ctx.fillStyle = g;
            ctx.fillRect(-2 * px, 2 * px, 4 * px, 3 * px);

            // Chassis & Kabine
            ctx.fillStyle = c;
            ctx.fillRect(-8 * px, -6 * px, 16 * px, 8 * px);
            ctx.fillStyle = '#7a7060';
            ctx.fillRect(-6 * px, -5 * px, 12 * px, 4 * px);

            // Motorhaube (schmal zulaufend)
            ctx.beginPath();
            ctx.moveTo(-5 * px, -14 * px);
            ctx.lineTo(5 * px, -14 * px);
            ctx.lineTo(7 * px, -6 * px);
            ctx.lineTo(-7 * px, -6 * px);
            ctx.closePath();
            ctx.fillStyle = c; ctx.fill();
            ctx.strokeStyle = d; ctx.lineWidth = 1.5 * px; ctx.stroke();

            // Windschutzscheibe & Frontgitter
            ctx.fillStyle = g;
            ctx.fillRect(-4 * px, -8 * px, 8 * px, 2 * px);

            // Chassis-Rahmen (vereinfacht)
            ctx.strokeStyle = d; ctx.lineWidth = 2 * px;
            ctx.beginPath();
            ctx.moveTo(-8 * px, -6 * px); ctx.lineTo(8 * px, -6 * px);
            ctx.stroke();

        } else if (getBaseTypeId(this.typeKey) === 'mobile_flak') {
            // --- Radpanzer mit Turm und Kanone ---
            let angle = 0;
            if(this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);

            ctx.rotate(angle); // Fahrzeug zeigt nach Osten (x-Achse)

            // Rahmen: länglich, 10% breiter (Nord-Süd)
            ctx.fillStyle = this.playerColor || '#c0c000';
            ctx.fillRect(-15 * px, -9 * px, 30 * px, 18 * px);

            // Räder: Durchmesser +50%, Breite reduziert (wie Breitreifen, halb im Rahmen)
            ctx.fillStyle = '#222'; // dunkleres Gummi
            // vorne links
            ctx.fillRect(-13 * px, -11 * px, 7 * px, 6 * px);
            // vorne rechts
            ctx.fillRect(-13 * px, 3, 7 * px, 6 * px);
            // hinten links
            ctx.fillRect(6 * px, -11 * px, 7 * px, 6 * px);
            // hinten rechts
            ctx.fillRect(6 * px, 3, 7 * px, 6 * px);

            // Turm: dunkleres Grau, leicht nach hinten versetzt
            ctx.fillStyle = '#606060';
            ctx.beginPath();
            ctx.arc(-3 * px, 0, 6 * px, 0, Math.PI * 2);
            ctx.fill();

            // Kanone: heller Grau (#a0a0a0), unterscheidbar vom Turm
            // Beginn bei 1/3 Turmdurchmesser von außen
            ctx.strokeStyle = '#a0a0a0';
            ctx.lineWidth = 3 * px;
            ctx.beginPath();
            ctx.moveTo(0 * px, 0);           // Startpunkt
            ctx.lineTo(10 * px, 0);          // Laenge
            ctx.stroke();

        } else if (getBaseTypeId(this.typeKey) === 'helicopter') {
            // --- Helicopter ---
            let angle = this.helicopterHeading || 0;
            if (!this.parking && this.targetX) {
                angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);
            }

            ctx.rotate(angle + Math.PI / 2);

            // Rumpf (schlankes Oval)
            ctx.fillStyle = this.playerColor || color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 8 * px, 14 * px, 0, 0, Math.PI * 2);
            ctx.fill();

            // Heckausleger (breit beginnend, spitz zulaufend)
            ctx.fillStyle = this.playerColor || color;
            ctx.strokeStyle = '#147f98';
            ctx.lineWidth = 2 * px;
            ctx.beginPath();
            ctx.moveTo(-3 * px, 14 * px);
            ctx.lineTo(3 * px, 14 * px);
            ctx.lineTo(0, 28 * px);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Querflügel kurz vor Ende des Hecks
            ctx.fillStyle = this.playerColor || color;
            ctx.beginPath();
            ctx.rect(-6 * px, 24 * px, 12 * px, 2 * px);
            ctx.fill();

            // Heckrotor (kleiner Kreis am Ende)
            ctx.fillStyle = '#147f98';
            ctx.beginPath();
            ctx.arc(0, 28 * px, 2.5 * px, 0, Math.PI * 2);
            ctx.fill();

            // Hauptrotor (größer, dickere Linien, Rahmenfarbe)
            if (this.parking || !this.targetX) {
                // Geparkt: X-Form Rotor
                ctx.strokeStyle = '#147f98';
                ctx.lineWidth = 3 * px;
                ctx.beginPath();
                ctx.moveTo(-15 * px, -15 * px);
                ctx.lineTo(15 * px, 15 * px);
                ctx.moveTo(15 * px, -15 * px);
                ctx.lineTo(-15 * px, 15 * px);
                ctx.stroke();
            } else {
                // In Bewegung: Kreis-Rotor
                ctx.strokeStyle = '#147f98';
                ctx.lineWidth = 3 * px;
                ctx.beginPath();
                ctx.arc(0, -10 * px, 7.5 * px, 0, Math.PI * 2);
                ctx.stroke();
            }
        } else {
            // --- TANK (Standard) ---
            let angle = 0;
            if(this.targetX) angle = Math.atan2(this.targetY - this.y, this.targetX - this.x);

            ctx.rotate(angle + Math.PI/2);
            
            // Ketten
            ctx.fillStyle = '#222';
            ctx.fillRect(-12 * px, -14 * px, 6 * px, 28 * px); // Links
            ctx.fillRect(6 * px, -14 * px, 6 * px, 28 * px);   // Rechts
            
            // Körper
            ctx.fillStyle = this.playerColor || color;
            ctx.fillRect(-10 * px, -12 * px, 20 * px, 24 * px);
            
            // Turm
            ctx.fillStyle = '#003366'; // Dunkelblau für Alliiert
            ctx.beginPath(); ctx.arc(0, -2 * px, 8 * px, 0, Math.PI*2); ctx.fill();
            
            // Kanone
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 3 * px;
            ctx.beginPath(); ctx.moveTo(0, -5 * px); ctx.lineTo(0, -20 * px); ctx.stroke();
        }

        ctx.restore();
    }
}

// --- GAME ENGINE ---

class Game {
    constructor() {
        this.canvas = document.getElementById('rtscanvas');
        this.ctx = this.canvas.getContext('2d');
        
        // UI State
        this.currentTab = 'buildings';
        
        this.resize();
        this.cols = Math.ceil(this.canvas.width / TILE_SIZE);
        this.rows = Math.ceil(this.canvas.height / TILE_SIZE);
        
        this.input = new InputManager(this.canvas);

        // Sidebar: leere Fläche klicken → Auswahl aufheben / Platziermodus abbrechen
        const sidebar = document.getElementById('sidebar');
        if (sidebar) {
            const sidebarEmptyHandler = (e) => {
                const interactiveEl = e.target.closest('.build-item, .tab-icon, .action-btn, button');

                    if (e.cancelable) e.preventDefault();
                    this.handleSidebarEmptyClick();
                }
            };
            sidebar.addEventListener('click', sidebarEmptyHandler);
            sidebar.addEventListener('touchend', sidebarEmptyHandler, { passive: false });
        }
        
        this.units = [];
        this.buildings = []; 
        this.selectedUnits = [];

            return {
                ownerIndex: index,
                ownerId: accountId,
                type: player.type,
                color: player.color,
                base: gameConfig.startingCash,
                harvest: 0,
                harvestLimit: 0,
                unitBuild: 0,
                credits: gameConfig.startingCash
            };
        });

        this.accountById = this.accounts.reduce((map, account) => {
            map[account.ownerId] = account;
            return map;
        }, {});

        // Player aliases for backward compatibility
        this.energyBalance = 0; // Energy balance of the base
        this.startTime = Date.now(); // Game start time for duration tracking
        this.constructedBuildings = []; // IDs gebauter Gebäude für Prereqs
        this.refineryCount = 0; // Count of refineries built
        this.buildingsUnlocked = false;
        
        // Player configuration from config menu
//        this.playerColor = '#9e3a3a'; // Default fallback
        this.playerColor = colorMap[gameConfig.players[0].color] || '#9e3a3a';
        this.playerFractions = new Set([gameConfig.players[0].fraction || 1]);
        
        // Placement Logic
        this.placementMode = false;
        this.buildingToPlace = null;
        this.sellMode = false;
        this.isHoveringBuildMenu = false;
        this.sellCursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><rect x='1' y='1' width='30' height='30' rx='4' fill='%23221'/><text x='8' y='22' font-size='20' font-family='Arial' fill='%23ffd24d'>$</text></svg>") 8 8, auto`;

        // Production Queue - Liste von {type, count}
        this.productionQueueInfantry = [];
        this.productionQueueVehicle = [];
        this.productionQueueAircraft = [];
        this.currentProductionInfantry = null;
        this.currentProductionVehicle = null;
        this.currentProductionAircraft = null;
        this.buildingProductionQueue = [];
        this.defenseProductionQueue = [];
        this.currentBuildingProduction = null; // Building type currently in progress
        this.currentDefenseProduction = null; // Defense type currently in progress
        this.buildMenuHoverListenersAttached = false;
        this.buildingBuildTimeMs = 3000;
        this.buildingProductionStates = {};
        this.buildingButtons = {};
        this.unitButtons = {};

        const spawnPositions = {
            A: { x: (6.5) * TILE_SIZE, y: (6.5) * TILE_SIZE },
            B: { x: (this.cols - 6.5) * TILE_SIZE, y: (6.5) * TILE_SIZE },
            C: { x: (this.cols - 6.5) * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE },
            D: { x: (6.5) * TILE_SIZE, y: (this.rows - 6.5) * TILE_SIZE }

        this.npcAiState = [

            { buildQueue: [], nextBuildingIndex: 0, currentBuilding: null, buildStartTime: 0, nextBuildDelayUntil: 0 },
            { buildQueue: [], nextBuildingIndex: 0, currentBuilding: null, buildStartTime: 0, nextBuildDelayUntil: 0 },
            { buildQueue: [], nextBuildingIndex: 0, currentBuilding: null, buildStartTime: 0, nextBuildDelayUntil: 0 }

        // Starte die NPC-AI Gebäudelisten für AI-Spieler
        for (let aiIndex = 1; aiIndex < gameConfig.players.length; aiIndex++) {

    resize() {
        // Canvas Breite anpassen (Fensterbreite - Sidebar)
        const sidebarWidth = 280;
        this.canvas.width = window.innerWidth - sidebarWidth; 
        this.canvas.height = window.innerHeight;
        
        // Grid neu berechnen wenn nötig
    }

    setupActionButtons() {
        // Setup action button event listeners (currently for future expansion)
        const buttons = ['beacon', 'sell', 'power', 'repair', 'options'];
        buttons.forEach(btnId => {
            const btn = document.getElementById(`action-${btnId}`);
            if (btn) {
                btn.addEventListener('click', () => {
                    if (btnId === 'sell') {
                        this.setSellMode(!this.sellMode);
                        if (this.sellMode) this.updateUI('Verkaufsmodus aktiv. Gebaeude anklicken.');
                        else this.updateUI(null);
                        return;
                    }
                    // Action buttons will be implemented as needed
                    console.log(`Action: ${btnId}`);
                });
            }
        });
    }

    getAccount(identifier = 0) {
        if (typeof identifier === 'number') {
            return this.accounts[identifier] || this.accounts[0];
        }
        if (typeof identifier === 'string') {
            return this.accountById[identifier] || this.accounts[0];
        }
        return this.accounts[0];
    }

    updateGameDisplay() {
        // Update game time
        const elapsed = Date.now() - this.startTime;
        const seconds = Math.floor(elapsed / 1000);
        const minutes = Math.floor(seconds / 60);
        const displaySeconds = seconds % 60;
        document.getElementById('game-time').innerText = `${minutes}:${String(displaySeconds).padStart(2, '0')}`;

        const creditsInfo = document.getElementById('credits-info');
        if (creditsInfo) creditsInfo.innerText = this.getAccount(0).credits;
        
        // Update energy display
        const energyDisplay = document.getElementById('energy-display');
        const energyCell = document.getElementById('energy-cell');
        energyDisplay.innerText = this.energyBalance;
        if (this.energyBalance < 0) {
            energyCell.classList.add('low-power');
        } else {
            energyCell.classList.remove('low-power');
        }
    }

    recalculateCredits(account = this.getAccount(0)) {
        account.base = Math.max(0, Math.floor(account.base));
        account.harvest = Math.max(0, Math.floor(account.harvest));
        account.harvestLimit = Math.max(0, Math.floor(account.harvestLimit));
        account.credits = account.base + account.harvest;
    }

    canAfford(amount, account = this.getAccount(0)) {
        return account.credits >= amount;
    }

    spendCredits(amount, account = this.getAccount(0)) {
        if (!this.canAfford(amount, account)) return false;

        let remaining = amount;
        if (account.harvest >= remaining) {
            account.harvest -= remaining;
            remaining = 0;
        } else {
            remaining -= account.harvest;
            account.harvest = 0;
        }

        if (remaining > 0) {
            account.base = Math.max(0, account.base - remaining);
        }

        this.recalculateCredits(account);
        return true;
    }

    refundCredits(amount, account = this.getAccount(0)) {
        // Standard: alles zurück ins Harvest-Wallet, solange Limit nicht überschritten
        if (account.harvest + amount <= account.harvestLimit) {
            account.harvest += amount;
        } else {
            // Überschuss ins Start-Wallet
            const overflow = (account.harvest + amount) - account.harvestLimit;
            account.harvest = account.harvestLimit;
            account.base += overflow;
        }
        this.recalculateCredits(account);
    }

    addBaseCredits(amount, account = this.getAccount(0)) {
        account.base += amount;
        this.recalculateCredits(account);
        return amount;
    }

    addHarvestCredits(amount, account = this.getAccount(0)) {
        const before = account.harvest;
        const after = Math.min(account.harvestLimit, before + amount);
        const added = after - before;
        const lost = amount - added;

        account.harvest = after;
        this.recalculateCredits(account);

        return { added, lost };
    }

    addSaleCredits(amount, account = this.getAccount(0)) {
        const freeHarvestStorage = Math.max(0, account.harvestLimit - account.harvest);
        const harvestGain = Math.min(amount, freeHarvestStorage);
        const baseGain = Math.max(0, amount - harvestGain);

        account.harvest += harvestGain;
        account.base += baseGain;
        this.recalculateCredits(account);

        return { harvestGain, baseGain };
    }

    getStorageBonusForBuilding(typeId) {
        const baseId = getBaseTypeId(typeId);
        if (baseId === 'refinery') return 2000;
        if (baseId === 'silo') return 3000;
        return 0;
    }

    hasBuildingType(typeId) {
        const normalizedId = getBaseTypeId(typeId);
        // Nur Gebäude des menschlichen Spielers zählen für Prerequisites/UI-Updates
        return this.buildings.some(b => {
            if (!b || !b.name) return false;
            if (b.owner !== gameConfig.players[0].type) return false; 
            return b.name === typeId || getBaseTypeId(b.name) === normalizedId;
        });
    }


    hasReqs(typeData) {
        return !typeData.req || typeData.req.every(req => this.hasBuildingType(req));
    }

    isTypeAvailableForPlayer(typeData) {
        if (!typeData || !typeData.fraction) return true;
        // Fraktion 5: Harvester - universal verfügbar
        if (typeData.fraction === 5) return true;
        // Fraktion 6: Civilians - nur beim Gebäudeverkauf verfügbar, nicht im Menü
        if (typeData.fraction === 6) return false;
        // Fraktionen 1-4: nur wenn im playerFractions Set
        return this.playerFractions.has(typeData.fraction);
    }

    addPlayerFraction(fraction) {
        if (fraction && FRACTION_LABELS[fraction]) {
            this.playerFractions.add(fraction);
        }
    }

    recalculateBaseEconomy() {
        let energyBalance = 0;
        let creditsLimit = 0;
        let refineryCount = 0;

        for (const building of this.buildings) {
            const typeData = this.getBuildingTypeById(building.name);
            if (!typeData) continue;

            energyBalance += typeData.energy || 0;
            creditsLimit += this.getStorageBonusForBuilding(building.name);
            if (getBaseTypeId(building.name) === 'refinery') refineryCount++;
        }

        this.energyBalance = energyBalance;
        this.refineryCount = refineryCount;
        this.buildingsUnlocked = this.hasBuildingType('constructionyard');

        const playerAccount = this.getAccount(0);
        playerAccount.harvestLimit = creditsLimit;
        playerAccount.harvest = Math.min(playerAccount.harvest, playerAccount.harvestLimit);
        this.recalculateCredits(playerAccount);
        this.updateGameDisplay();
    }

    updateCursorState() {
        const sellBtn = document.getElementById('action-sell');
        if (sellBtn) {
            sellBtn.classList.toggle('active', this.sellMode);
        }

        if (this.placementMode) {
            if (this.isHoveringBuildMenu) {
                document.body.style.cursor = 'default';
            } else {
                document.body.style.cursor = 'none';
            }
            this.canvas.style.cursor = 'none';
            return;
        }

        document.body.style.cursor = 'default';
        this.canvas.style.cursor = this.sellMode ? this.sellCursor : 'crosshair';
    }

    setSellMode(active) {
        this.sellMode = !!active;
        if (this.sellMode && this.placementMode) {
            this.cancelPlacement(true);
        }
        this.updateCursorState();
    }

    findBuildingAt(x, y) {
        for (let i = this.buildings.length - 1; i >= 0; i--) {
            const building = this.buildings[i];
            const rect = getBuildingPixelRect(building);
            if (x >= rect.x && x <= rect.x + rect.width && y >= rect.y && y <= rect.y + rect.height) {
                return building;
            }
        }
        return null;
    }

    findBuildingBodyAt(x, y) {
        for (let i = this.buildings.length - 1; i >= 0; i--) {
            const building = this.buildings[i];
            const body = getBuildingBodyPixelRect(building);
            if (body.height <= 0) continue;
            if (x >= body.x && x <= body.x + body.width && y >= body.y && y <= body.y + body.height) {
                return building;
            }
        }
        return null;
    }

    getProductionTabForBuilding(building) {
        if (!building) return null;
        const baseId = getBaseTypeId(building.name);
        if (baseId === 'constructionyard') return 'buildings';
        if (baseId === 'barracks') return 'infantry';
        if (baseId === 'warfactory') return 'vehicles';
        if (baseId === 'helipad') return 'aircraft';
        return null;
    }

    spawnUnitsOnSoldBuilding(building, buildingCost) {
        const rect = getBuildingPixelRect(building);
        const trials = Math.floor((buildingCost || 0) / 300);
        const candidates = ['rifleman', 'civilian1', 'civilian2'];

        let spawnCount = 0;
        for (let i = 0; i < trials; i++) {
            if (Math.random() < 0.5) {
                const unitId = candidates[Math.floor(Math.random() * candidates.length)];
                const col = spawnCount % 3;
                const row = Math.floor(spawnCount / 3);
                const x = rect.x + rect.width * (0.25 + col * 0.25) + (Math.random() - 0.5) * 8 * WORLD_SCALE;
                const y = rect.y + rect.height * (0.35 + row * 0.2) + (Math.random() - 0.5) * 8 * WORLD_SCALE;
                this.units.push(new Entity(x, y, gameConfig.players[0], unitId));
                spawnCount++;
            }
        }
    }

    sellBuildingAt(x, y) {
        const building = this.findBuildingAt(x, y);
        if (!building || building.owner !== 'human') return false;

        const typeData = this.getBuildingTypeById(building.name);
        if (!typeData) return false;

        if (building.name === 'constructionyard' || getBaseTypeId(building.name) === 'constructionyard') {
            const center = getBuildingCenter(building);
            this.buildings = this.buildings.filter(b => b !== building);
            this.units.push(new Entity(center.x, center.y, gameConfig.players[0], 'mcv'));
            this.recalculateBaseEconomy();
            this.initSidebar();
            this.updateUI('Construction Yard eingerollt. MCV bereit.');
            return true;
        }

        const saleValue = Math.floor((typeData.cost || 0) / 2);
        const buildingCost = typeData.cost || 0;

        this.buildings = this.buildings.filter(b => b !== building);
        this.recalculateBaseEconomy();
        this.addSaleCredits(saleValue);
        this.spawnUnitsOnSoldBuilding(building, buildingCost);
        this.initSidebar();
        this.updateUI(`Verkauft: ${typeData.name} +$${saleValue}`);
        return true;
    }

    getRefineryUnloadPoint(refinery) {
        const grid = getBuildingGridRect(refinery);
        const tileX = grid.tileX + Math.floor(grid.widthTiles / 2); // Mitte (Spalte 2 bei 3)
        const tileY = grid.tileY + grid.heightTiles - 2; // Zeile 2 von unten
        return {
            x: tileX * TILE_SIZE + TILE_SIZE / 2,
            y: tileY * TILE_SIZE + TILE_SIZE / 2
        };
    }

    isTileBlockedByBuildingBody(tileX, tileY) {
        for (const building of this.buildings) {
            const body = getBuildingBlockedGridRect(building);
            if (
                tileX >= body.tileX &&
                tileX < body.tileX + body.widthTiles &&
                tileY >= body.tileY &&
                tileY < body.tileY + body.heightTiles
            ) {
                return true;
            }
        }
        return false;
    }

    getValidatedMoveTarget(unit, targetX, targetY, options = {}) {
        const allowRefineryDock = options.allowRefineryDock !== false;

        // Ausnahme: Harvester-Dock in Raffinerie (Zeile 2 von unten, Mitte)
        if (unit.type === 'harvester' && allowRefineryDock) {
            // Try to match a refinery more leniently (clicking near or inside the building)
            const clickedRefinery = this.buildings.find(b => {
                if (b.baseId !== 'refinery') return false;
                if (b.owner !== unit.owner) return false; // Nur eigene Raffinerien erlauben Docking/Auftrag
                const rect = getBuildingPixelRect(b);
                return distancePointToRect(targetX, targetY, rect) <= TILE_SIZE * 1.2;
            });

            if (clickedRefinery) {
                const dock = this.getRefineryUnloadPoint(clickedRefinery);
                return { x: dock.x, y: dock.y, allowEndInBlocked: true, refinery: clickedRefinery };
            }
        }

        const targetTile = Pathfinder.getGridPos(targetX, targetY);
        const cols = Math.floor(this.canvas.width / TILE_SIZE);
        const rows = Math.floor(this.canvas.height / TILE_SIZE);

        const hitBuilding = this.buildings.find(b => {
            const blocked = getBuildingBlockedGridRect(b);
            return (
                targetTile.x >= blocked.tileX &&
